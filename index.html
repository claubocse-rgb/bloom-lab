},"profile":{"ro":"Scopul: dulceață, aciditate plăcută și un final curat, fără amăreală care persistă.","en":"Goal: sweetness, pleasant acidity and a clean finish with no lingering bitterness."},"grindKey":"espresso","mistakes":[{"ro":"Urmărești doar timpul și ignori gustul.","en":"Chasing time only and ignoring taste."},{"ro":"Faci pași uriași la râșniță; schimbă puțin și repetă.","en":"Making huge grinder jumps; change a little and repeat."},{"ro":"Arunci trei shot-uri la rând fără să notezi nimic.","en":"Dumping three shots in a row without writing anything down."}],"tips":[{"ro":"Ordine: doză → raport → măcinătură → temperatură. Temperatura e ultimul reglaj fin.","en":"Order: dose → ratio → grind → temperature. Temperature is the last fine-tune."},{"ro":"Primul shot după o pauză lungă de obicei iese diferit; nu regla după el.","en":"The first shot after a long pause often runs differently; don't adjust off it."},{"ro":"Dacă shot-ul e acru și amar în același timp, problema e de obicei canalizarea, nu măcinătura.","en":"If a shot is both sour and bitter, the cause is usually channeling, not grind size."}],"recipeIds":["espresso"],"sources":["https://decentespresso.com/docs/masterclass_on_how_to_find_the_right_recipe_for_your_beans","https://clivecoffee.com/blogs/learn/espresso-extraction-time-ratio-a-complete-guide-clive-coffee","https://completehomebarista.com/guides/espresso-extraction-ratio-explained/","https://home.lamarzoccousa.com/brew-ratios-around-world/"]},{"id":"puck-prep","name":{"ro":"Pregătirea turtei: WDT, distribuție, tasare, puck screen","en":"Puck prep: WDT, distribution, tamping, puck screens"},"category":"espresso","difficulty":2,"gear":{"ro":"Unealtă WDT (ace de 0,3–0,4 mm), pâlnie de dozare, tamper de mărimea exactă a coșului, opțional puck screen și pulverizator (RDT).","en":"WDT tool (0.3–0.4 mm needles), dosing funnel, tamper sized to your basket, optional puck screen and spray bottle (RDT)."},"history":{"ro":"John Weiss a publicat tehnica în 2005 pe forumul Home-Barista, folosind o agrafă și un pahar de iaurt tăiat drept pâlnie.","en":"John Weiss published the technique in 2005 on the Home-Barista forum, using a paperclip and a cut-down yoghurt cup as a funnel."},"howItWorks":{"ro":"Apa caută drumul cel mai ușor; zonele mai puțin dense devin canale care se supraextrag, iar restul rămâne subextras. WDT (Weiss Distribution Technique) sparge cocoloașele și uniformizează densitatea, apoi o tasare plană închide turta. Puck screen-ul pus deasupra distribuie apa mai uniform și ține dușul curat.","en":"Water takes the easiest path; less dense zones become channels that over-extract while the rest stays under-extracted. WDT (Weiss Distribution Technique) breaks clumps and evens out density, then a level tamp seals the bed. A puck screen on top spreads water more evenly and keeps the shower screen clean."},"profile":{"ro":"O turtă bună dă shot-uri constante, mai dulci, fără stropi din portafiltrul fără fund.","en":"Good prep gives consistent, sweeter shots with no spurts from a bottomless portafilter."},"grindKey":"espresso","mistakes":[{"ro":"Apeși cu 30 kg și răsucești tamperul: presiunea nu contează, planeitatea da.","en":"Tamping with 30 kg and twisting: force doesn't matter, levelness does."},{"ro":"Faci WDT doar la suprafață; acele trebuie să ajungă până la fundul coșului.","en":"Doing WDT only on the surface; needles should reach the basket floor."},{"ro":"Bați în portafiltru după tasare și crăpi turta.","en":"Knocking the portafilter after tamping and cracking the bed."}],"tips":[{"ro":"Câteva picături de apă pe boabe înainte de măcinat (RDT) reduc electricitatea statică.","en":"A few drops of water on the beans before grinding (RDT) cut static."},{"ro":"Mișcări mici, circulare, în toată adâncimea, apoi o lovitură ușoară pe masă înainte de tasare.","en":"Small circles through the full depth, then one light tap on the bench before tamping."},{"ro":"Un portafiltru fără fund îți arată instant unde apar canalele.","en":"A bottomless portafilter shows you instantly where channels form."}],"recipeIds":["espresso"],"sources":["https://www.baristahustle.com/?p=345144","https://decentespresso.com/doc/puck_preparation/","https://clivecoffee.com/blogs/learn/what-is-wdt-and-should-i-use-it-for-home-espresso","https://clivecoffee.com/blogs/learn/extraction-showdown-which-puck-prep-is-actually-boosting-your-espresso","https://completehomebarista.com/guides/espresso-puck-prep-wdt-distribution/","https://procoffeegear.com/blogs/articles/puck-screen-purpose-espresso"]},{"id":"preinfusion-profiling","name":{"ro":"Preinfuzie și profilare de presiune acasă","en":"Pre-infusion and pressure profiling at home"},"category":"espresso","difficulty":3,"gear":{"ro":"Aparat cu control de debit sau presiune (paletă E61 cu flow control, Decent, Lelit Bianca, Meticulous) sau o pârghie manuală (Flair, Robot).","en":"Machine with flow or pressure control (E61 flow-control paddle, Decent, Lelit Bianca, Meticulous) or a manual lever (Flair, Robot)."},"howItWorks":{"ro":"Preinfuzia udă turta la presiune mică (1–4 bari) înainte de presiunea maximă, ca să se umfle uniform și să nu crape. Blooming espresso adaugă o pauză de ~30 s, apoi urcă la 6–9 bari. Profilul declinant (presiunea scade spre final) imită pârghia cu arc și îmblânzește amăreala de la sfârșit.","en":"Pre-infusion wets the puck at low pressure (1–4 bar) before full pressure, so it swells evenly instead of cracking. Blooming espresso adds a ~30 s pause, then ramps to 6–9 bar. A declining profile (pressure drops toward the end) mimics a spring lever and tames late bitterness."},"profile":{"ro":"Preinfuzia lungă și bloom-ul aduc dulceață și claritate la prăjirile deschise; presiunea mică pe tot parcursul (soup) dă un shot foarte limpede.","en":"Long pre-infusion and blooming bring sweetness and clarity to light roasts; low pressure throughout (soup) gives a very clean cup."},"grindKey":"espresso","mistakes":[{"ro":"Copiezi un profil de pe internet fără să schimbi măcinătura.","en":"Copying an online profile without changing the grind."},{"ro":"Folosești bloom pentru o prăjire închisă: devine amară și plată.","en":"Using a bloom on a dark roast: it turns flat and bitter."},{"ro":"Urci presiunea brusc după preinfuzie și crăpi turta.","en":"Ramping pressure abruptly after pre-infusion and cracking the puck."}],"tips":[{"ro":"Fără control? Unele aparate au preinfuzie din setări; folosește-o la 3–8 s.","en":"No control? Many machines have pre-infusion in settings; use 3–8 s."},{"ro":"Pentru bloom, macină mai fin decât la un shot clasic.","en":"For a bloom, grind finer than for a classic shot."},{"ro":"Prăjire închisă: 6–7 bari în loc de 9 reduc amăreala.","en":"Dark roast: 6–7 bar instead of 9 reduces bitterness."}],"recipeIds":["blooming-espresso","soup-shot","cafelat-robot"],"sources":["https://decentespresso.com/docs/all_about_blooming_espresso","https://www.decentespresso.com/blog/5_espresso_profiles_for_light_roasted_coffee_beans","https://www.scottrao.com/blog/2021/5/18/best-practice-espresso-profile","https://flairespresso.com/blog/espresso-pre-infusion-techniques/","https://clivecoffee.com/blogs/learn/what-are-soup-shots"]},{"id":"single-dosing","name":{"ro":"Single dosing: măcini doza, nu buncărul","en":"Single dosing"},"category":"gear","difficulty":2,"gear":{"ro":"Râșniță cu retenție mică (DF54, DF64, Niche Zero, 1Zpresso J-Ultra, Kingrinder K6), recipiente pentru doze, cântar, pulverizator.","en":"Low-retention grinder (DF54, DF64, Niche Zero, 1Zpresso J-Ultra, Kingrinder K6), dose tubes, scale, spray bottle."},"howItWorks":{"ro":"În loc să ții boabele în buncăr, cântărești exact doza (de exemplu 18 g) și o macini toată. Boabele rămân închise ermetic, poți schimba cafeaua de la un shot la altul și nu rămâne cafea veche în râșniță. Funcționează doar dacă râșnița reține foarte puțină cafea (sub 0,2 g).","en":"Instead of keeping beans in a hopper, you weigh the exact dose (say 18 g) and grind all of it. Beans stay sealed, you can switch coffees shot to shot, and no stale grounds sit in the grinder. It only works if the grinder retains very little (under 0.2 g)."},"profile":{"ro":"Mai multă prospețime și gust constant; ușor de comparat două cafele una lângă alta.","en":"Fresher, more consistent cups; easy to compare two coffees side by side."},"grindKey":"espresso","mistakes":[{"ro":"Nu cântărești ce iese din râșniță și pierzi 0,5 g la fiecare doză.","en":"Not weighing what comes out and losing 0.5 g every dose."},{"ro":"Uiți de electricitatea statică: cafeaua zboară pe masă.","en":"Ignoring static: grounds fly all over the counter."},{"ro":"Păstrezi boabele la frigider, deschise; condensul le strică.","en":"Keeping beans open in the fridge; condensation ruins them."}],"tips":[{"ro":"Două pufuri de apă pe boabe (RDT) și o lovitură pe burduf golesc râșnița.","en":"Two spritzes on the beans (RDT) and a pump of the bellows empty the grinder."},{"ro":"Congelează doze cântărite în tuburi etanșe; macină-le direct din congelator.","en":"Freeze pre-weighed doses in airtight tubes; grind straight from frozen."},{"ro":"O râșniță manuală bună pentru espresso costă cât jumătate dintr-una electrică și e excelentă pentru single dosing.","en":"A good espresso hand grinder costs half as much as an electric one and is excellent for single dosing."}],"recipeIds":["espresso"],"sources":["https://decentespresso.com/doc/puck_preparation/","https://completehomebarista.com/guides/espresso-puck-prep-wdt-distribution/","https://www.hachette.com.au/james-hoffmann/how-to-make-the-best-coffee"]},{"id":"lever-espresso","name":{"ro":"Espresso manual cu pârghie: Flair și Cafelat Robot","en":"Manual lever espresso: Flair and Cafelat Robot"},"category":"gear","difficulty":3,"gear":{"ro":"Flair 58/58+/Pro 3 sau Cafelat Robot, fierbător cu temperatură reglabilă, râșniță pentru espresso, cântar, manometru (inclus pe majoritatea).","en":"Flair 58/58+/Pro 3 or Cafelat Robot, temperature-control kettle, espresso grinder, scale, pressure gauge (included on most)."},"history":{"ro":"Flair a pornit dintr-o campanie Kickstarter în 2016; Cafelat Robot, lansat în 2018, e inspirat de aparatele manuale italiene din anii '60, precum Faemina.","en":"Flair started on Kickstarter in 2016; the Cafelat Robot, launched in 2018, draws on 1960s Italian manual machines such as the Faemina."},"howItWorks":{"ro":"Tu ești pompa: torni apă fierbinte peste turtă și apeși pârghia, urmărind manometrul. Asta îți dă control total asupra preinfuziei și a profilului de presiune, fără electricitate (Flair 58 are doar un încălzitor pentru grup). Preîncălzirea e partea critică, pentru că metalul rece fură căldura apei.","en":"You are the pump: pour hot water over the puck and pull the lever while watching the gauge. That gives total control of pre-infusion and pressure profile without electricity (the Flair 58 only has a group heater). Preheating is the critical part, because cold metal steals heat from the water."},"profile":{"ro":"Shot-uri foarte dulci și texturate când profilul e declinant; la prăjiri deschise pot egala aparate de câteva ori mai scumpe.","en":"Very sweet, textured shots with a declining profile; with light roasts they can rival machines several times the price."},"grindKey":"espresso","mistakes":[{"ro":"Nu preîncălzești cilindrul (Robot) sau grupul (Flair): shot acru, subțire.","en":"Not preheating the basket (Robot) or the group (Flair): sour, thin shot."},{"ro":"Apeși la 12 bari pentru că „mai mult e mai bine”; 6–9 bari ajung.","en":"Pushing 12 bar because more seems better; 6–9 bar is plenty."},{"ro":"Treci direct la presiune maximă fără preinfuzie.","en":"Going straight to full pressure with no pre-infusion."}],"tips":[{"ro":"Țintă de pornire Flair 58: 18 g → 40 g, 3 bari 5–10 s, apoi 6–9 bari, ~30 s.","en":"Flair 58 starting point: 18 g → 40 g, 3 bar for 5–10 s, then 6–9 bar, ~30 s."},{"ro":"La Robot, apa direct din fierbător e corectă: metalul o răcește oricum.","en":"With the Robot, water straight off the boil is right: the metal cools it anyway."},{"ro":"Încălzirea Flair 58: LOW 85 °C pentru prăjiri închise, MEDIUM 90 °C, HIGH 95 °C pentru prăjiri deschise.","en":"Flair 58 heater: LOW 85 °C for dark roasts, MEDIUM 90 °C, HIGH 95 °C for light roasts."}],"recipeIds":["flair-58","cafelat-robot"],"sources":["https://flairespresso.com/blogs/news/dialing-in-flair-58-plus-manual-espresso-maker","https://flairespresso.com/blog/espresso-pre-infusion-techniques/","https://www.flairespresso.com/advanced","https://kaldiscoffee.com/blogs/recipes/cafelat-robot-declining-pressure-recipe","https://www.manualslib.com/manual/1994799/Cafelat-Robot.html"]},{"id":"portable-espresso","name":{"ro":"Espresso portabil: Nanopresso, Picopresso, Outin","en":"Portable espresso: Nanopresso, Picopresso, Outin"},"category":"gear","difficulty":2,"gear":{"ro":"Wacaco Nanopresso sau Picopresso (pompă manuală), Outin Nano/Ultra (cu baterie și încălzire), termos cu apă fierbinte, râșniță manuală.","en":"Wacaco Nanopresso or Picopresso (hand pump), Outin Nano/Ultra (battery with heating), thermos of hot water, hand grinder."},"howItWorks":{"ro":"Un piston mic, acționat cu mâna, ridică presiunea până la 18 bari prin pompări repetate. Picopresso are coș de 52 mm de tip profesional și cere cafea proaspăt măcinată; Nanopresso merge și cu măcinătură comercială sau capsule (adaptor). Outin încălzește singur apa, dar mai lent și cu baterie limitată.","en":"A small hand-driven piston builds up to 18 bar through repeated pumping. The Picopresso has a pro-style 52 mm basket and wants freshly ground coffee; the Nanopresso also works with pre-ground or capsules (adapter). The Outin heats its own water, but slowly and on a limited battery."},"profile":{"ro":"Picopresso poate da un espresso adevărat, cu cremă; restul dau un shot bun, puțin mai subțire.","en":"The Picopresso can make true espresso with crema; the others give a good, slightly thinner shot."},"grindKey":"espresso","mistakes":[{"ro":"Torni apă de 80 °C dintr-un termos vechi: shot acru.","en":"Using 80 °C water from an old thermos: sour shot."},{"ro":"Nu preîncălzești corpul aparatului; pierde repede căldura.","en":"Not preheating the body; it loses heat fast."},{"ro":"Coș umplut pe jumătate: apare canalizarea.","en":"Half-filled basket: channeling follows."}],"tips":[{"ro":"Preîncălzește cu o tură de apă fierbinte pompată în gol, apoi încarcă imediat.","en":"Preheat by pumping one load of hot water through empty, then load immediately."},{"ro":"Dacă nu apar picături după ~10 pompări, măcinătura e prea fină.","en":"If no drops appear after ~10 pumps, the grind is too fine."},{"ro":"Prăjirile medii spre închise iartă mai ușor pierderea de căldură.","en":"Medium to dark roasts forgive the heat loss better."}],"recipeIds":["picopresso"],"sources":["https://kaffeemacher.de/en/blogs/kaffeewissen/wacaco-picopresso","https://www.homecoffeeexpert.com/wacaco-picopresso-review/"]},{"id":"capsule-machines","name":{"ro":"Aparate cu capsule: cum scoți maximul","en":"Pod and capsule machines: getting the best out"},"category":"gear","difficulty":1,"gear":{"ro":"Aparat Nespresso Original (sau compatibil), capsule de specialitate sau reumplibile, cântar, cană preîncălzită.","en":"Nespresso Original (or compatible) machine, specialty or refillable capsules, scale, preheated cup."},"history":{"ro":"Nestlé a patentat sistemul Nespresso în 1976 și l-a lansat comercial la mijlocul anilor '80; brevetele au expirat în 2012, deschizând piața capsulelor compatibile.","en":"Nestlé patented the Nespresso system in 1976 and launched it in the mid-1980s; the patents expired in 2012, opening the market to compatible capsules."},"howItWorks":{"ro":"O capsulă conține 5–6 g de cafea, mult mai puțin decât un espresso clasic, iar aparatul împinge apă prin ea cu o membrană care se rupe sub presiune. Butoanele presetate (40 ml, 110 ml) sunt prea lungi pentru multe capsule: oprirea manuală pe cântar și un aparat cald fac cea mai mare diferență. Vertuo folosește centrifugare și coduri de bare, deci volumul nu se poate regla la fel.","en":"A capsule holds 5–6 g of coffee, far less than a classic espresso, and the machine pushes water through a foil that tears under pressure. The preset buttons (40 ml, 110 ml) run too long for many capsules: stopping manually on a scale and a hot machine make the biggest difference. Vertuo uses spinning and barcodes, so volume can't be tuned the same way."},"profile":{"ro":"Mai ușor și mai subțire decât un espresso de 18 g, dar curat și constant; capsulele de la prăjitori de specialitate pot surprinde plăcut.","en":"Lighter and thinner than an 18 g espresso, but clean and consistent; capsules from specialty roasters can be a pleasant surprise."},"grindKey":"espresso","mistakes":[{"ro":"Folosești butonul lungo pentru o cană mare: iese amar și apos.","en":"Using the lungo button for a big mug: bitter and watery."},{"ro":"Nu decalcifiezi; calcarul scade temperatura și debitul.","en":"Never descaling; scale drops temperature and flow."},{"ro":"Pornești capsula imediat după ce aparatul s-a aprins.","en":"Brewing straight after switching the machine on."}],"tips":[{"ro":"Rulează o dată doar apă, fără capsulă, ca să încălzești circuitul și ceașca.","en":"Run one blank shot with no capsule to heat the circuit and the cup."},{"ro":"Pentru o cafea lungă, fă un shot scurt și adaugă apă fierbinte după (ca un Americano).","en":"For a long coffee, pull a short shot and add hot water after (Americano-style)."},{"ro":"Folosește apă filtrată, moale; capsulele sigilate din aluminiu păstrează mai bine prospețimea.","en":"Use soft, filtered water; sealed aluminium capsules hold freshness best."}],"recipeIds":["capsule-tweak"],"sources":["https://recapio.com/digest/the-secrets-of-nespresso-pods-by-james-hoffmann","https://www.beanpoet.com/nespresso-tips-and-tricks/"]},{"id":"super-automatics","name":{"ro":"Espressoare automate (super-automate)","en":"Super-automatic machines"},"category":"gear","difficulty":1,"gear":{"ro":"Espressor automat cu râșniță integrată (De'Longhi, Jura, Philips, Sage Oracle ca semi-automat asistat), apă filtrată.","en":"Bean-to-cup machine with built-in grinder (De'Longhi, Jura, Philips; Sage Oracle as an assisted semi-auto), filtered water."},"howItWorks":{"ro":"Aparatul macină, dozează, tasează, extrage și aruncă turta singur, de obicei cu o unitate de infuzare mai mică decât un portafiltru (7–12 g). Ai control asupra măcinăturii, intensității (doza), volumului și temperaturii, dar în trepte grosiere. Laptele e spumat automat, cu un sistem Venturi care trage aer.","en":"The machine grinds, doses, tamps, extracts and dumps the puck by itself, usually with a smaller brew unit than a portafilter (7–12 g). You control grind, strength (dose), volume and temperature, but in coarse steps. Milk is foamed automatically by a Venturi system that draws in air."},"profile":{"ro":"Comod și constant; de obicei mai puțin corp și dulceață decât un espresso făcut manual, iar spuma de lapte e mai aerată.","en":"Convenient and consistent; usually less body and sweetness than a manual shot, and the milk foam is airier."},"grindKey":"espresso","mistakes":[{"ro":"Folosești boabe uleioase, foarte închise: lipesc râșnița.","en":"Using oily, very dark beans: they gum up the grinder."},{"ro":"Lași volumul pe 120 ml pentru „espresso”.","en":"Leaving volume at 120 ml for “espresso”."},{"ro":"Nu cureți unitatea de infuzare și circuitul de lapte.","en":"Skipping cleaning of the brew unit and milk circuit."}],"tips":[{"ro":"Măcinătura cea mai fină + intensitate maximă + volum 35–40 ml = cel mai apropiat de un espresso.","en":"Finest grind + max strength + 35–40 ml volume = closest to espresso."},{"ro":"Schimbă măcinătura doar cu râșnița pornită și verifică după 2–3 shot-uri.","en":"Change grind only while the grinder runs and judge after 2–3 shots."},{"ro":"Pentru băuturi lungi, folosește funcția „2 shot-uri” în loc de un singur shot lung.","en":"For long drinks, use the “2 shots” function instead of one long shot."}],"recipeIds":["espresso"],"sources":["https://www.hachette.com.au/james-hoffmann/how-to-make-the-best-coffee","https://home.lamarzoccousa.com/brew-ratios-around-world/"]},{"id":"milk-steaming","name":{"ro":"Spumarea laptelui cu lancea de abur","en":"Steaming milk with a steam wand"},"category":"milk","difficulty":2,"gear":{"ro":"Lance de abur, carafă din inox de 350–600 ml, lapte rece, termometru (opțional), cârpă umedă.","en":"Steam wand, 350–600 ml stainless pitcher, cold milk, thermometer (optional), damp cloth."},"howItWorks":{"ro":"Aburul face două lucruri: introduce aer (faza de „întindere”, cu vârful lancei chiar la suprafață, cu un sâsâit ușor) și apoi creează un vârtej care sparge bulele mari în microspumă (vârful puțin mai jos). Proteinele din lapte stabilizează bulele, iar grăsimea dă cremozitate. Te oprești la 55–65 °C, când laptele e cel mai dulce.","en":"Steam does two things: it introduces air (the “stretching” phase, wand tip right at the surface with a gentle hiss) and then creates a whirlpool that breaks big bubbles into microfoam (tip slightly lower). Milk proteins stabilise the bubbles and fat adds creaminess. Stop at 55–65 °C, when milk tastes sweetest."},"profile":{"ro":"Microspumă lucioasă, ca vopseaua udă, fără bule vizibile; dulceața laptelui crește până pe la 60 °C.","en":"Glossy microfoam like wet paint, no visible bubbles; milk sweetness rises up to about 60 °C."},"grindKey":null,"mistakes":[{"ro":"Lancea prea adâncă de la început: lapte fierbinte fără spumă.","en":"Wand too deep from the start: hot milk, no foam."},{"ro":"Aer prea mult sau prea târziu: spumă uscată, cu bule mari.","en":"Too much air or air added too late: dry, bubbly foam."},{"ro":"Încălzești peste 70 °C: gust de fiert și spuma se prăbușește.","en":"Heating above 70 °C: cooked taste and the foam collapses."}],"tips":[{"ro":"Aer doar până ce carafa devine călduță (~37 °C), apoi doar vârtej.","en":"Add air only until the pitcher feels lukewarm (~37 °C), then just whirlpool."},{"ro":"Purjează lancea înainte și după; șterge-o imediat cu cârpa umedă.","en":"Purge the wand before and after; wipe it immediately with the damp cloth."},{"ro":"Exersează cu apă și o picătură de detergent: face spumă ca laptele, fără risipă.","en":"Practise with water and a drop of dish soap: it foams like milk, no waste."}],"recipeIds":["cappuccino","flat-white","latte"],"sources":["https://au.lamarzoccohome.com/blog/how-to-steam-milk-with-a-home-espresso-machine/","https://au.lamarzoccohome.com/blog/how-to-steam-milk-like-a-pro-barista/","https://perfectdailygrind.com/2022/12/how-do-you-pour-great-latte-art-at-home/"]},{"id":"milk-no-wand","name":{"ro":"Lapte spumat fără lance: Nanofoamer, French press, spumantor","en":"Milk without a wand: NanoFoamer, French press, frother"},"category":"milk","difficulty":1,"gear":{"ro":"Subminimal NanoFoamer (sau spumantor de mână), French press, oală mică sau cuptor cu microunde, termometru.","en":"Subminimal NanoFoamer (or handheld frother), French press, small pan or microwave, thermometer."},"howItWorks":{"ro":"Mai întâi încălzești laptele separat la 55–65 °C, apoi îl aerezi mecanic. NanoFoamer are o sită fină care sparge bulele direct în microspumă, bună chiar și pentru latte art. Cu French press-ul pompezi pistonul de 10–20 de ori, apoi lovești ușor vasul și rotești laptele ca să-l omogenizezi.","en":"First heat the milk separately to 55–65 °C, then aerate it mechanically. The NanoFoamer has a fine screen that breaks bubbles straight into microfoam, good enough even for latte art. With a French press you pump the plunger 10–20 times, then tap and swirl to homogenise."},"profile":{"ro":"Spumă surprinzător de fină cu NanoFoamer; French press-ul dă o spumă mai groasă, bună pentru cappuccino.","en":"Surprisingly fine foam from the NanoFoamer; the French press gives thicker foam, good for cappuccino."},"grindKey":null,"mistakes":[{"ro":"Spumezi lapte fierbinte, peste 70 °C: spuma nu se mai leagă.","en":"Frothing milk above 70 °C: the foam won't hold."},{"ro":"Ții spumantorul la suprafață tot timpul: bule mari.","en":"Keeping the frother at the surface the whole time: big bubbles."},{"ro":"Umpli French press-ul peste jumătate: laptele dă pe dinafară.","en":"Filling the French press past half: milk overflows."}],"tips":[{"ro":"NanoFoamer: 5 s chiar sub suprafață, apoi coboară-l și ține 10–15 s pentru textură.","en":"NanoFoamer: 5 s just under the surface, then lower it for 10–15 s of texturing."},{"ro":"La French press, folosește doar o treime din vas cu lapte.","en":"With a French press, fill only a third with milk."},{"ro":"Lovește vasul de masă și rotește 10 s: bulele mari dispar.","en":"Tap the jug on the counter and swirl for 10 s: big bubbles vanish."}],"recipeIds":["cold-foam","cappuccino"],"sources":["https://alternativebrewing.com.au/blogs/news/subminimal-nanofoamer-guide","https://baristamagazine.com/test-drive-the-nanofoamer-v2-flowtip-jug-by-subminimal","https://perfectdailygrind.com/2022/12/how-do-you-pour-great-latte-art-at-home/"]},{"id":"plant-milks","name":{"ro":"Lapte vegetal: variantele barista","en":"Plant milks: barista versions"},"category":"milk","difficulty":1,"gear":{"ro":"Lapte vegetal „barista” (ovăz, soia, migdale), carafă rece, termometru.","en":"Barista-edition plant milk (oat, soy, almond), cold pitcher, thermometer."},"howItWorks":{"ro":"Laptele vegetal obișnuit are prea puține proteine și grăsimi ca să țină spuma. Variantele barista adaugă ulei, proteine și regulatori de aciditate (fosfați de potasiu) care stabilizează bulele și împiedică „tăierea” în cafeaua acidă. Se încălzesc mai repede și suportă mai puțină temperatură decât laptele de vacă.","en":"Regular plant milk has too little protein and fat to hold foam. Barista versions add oil, protein and acidity regulators (potassium phosphates) that stabilise bubbles and stop curdling in acidic coffee. They heat faster and tolerate less heat than dairy."},"profile":{"ro":"Ovăzul e cel mai neutru și dulce; soia face cea mai stabilă spumă, dar cu gust propriu; migdalele și cocosul sunt mai subțiri și aromate.","en":"Oat is the most neutral and sweet; soy foams most stably but has its own flavour; almond and coconut are thinner and more aromatic."},"grindKey":null,"mistakes":[{"ro":"Folosești laptele vegetal obișnuit, nu varianta barista.","en":"Using regular plant milk instead of the barista edition."},{"ro":"Îl încălzești la 65 °C+: spuma se rupe și gustul devine de cereale fierte.","en":"Heating it past 65 °C: foam breaks and it tastes of boiled cereal."},{"ro":"Torni espresso foarte acid peste soia rece: se taie.","en":"Pouring a very acidic espresso onto cold soy: it curdles."}],"tips":[{"ro":"Oprește-te la 55–60 °C; laptele vegetal se întinde mai repede, deci aerează mai puțin.","en":"Stop at 55–60 °C; plant milk stretches faster, so add less air."},{"ro":"Agită bine cutia înainte: grăsimea se separă.","en":"Shake the carton well first: the fat separates."},{"ro":"Pentru latte art, toarnă ceva mai repede decât cu lapte de vacă, pentru că spuma e mai rigidă.","en":"For latte art, pour a little faster than with dairy, because the foam is stiffer."}],"recipeIds":["latte","iced-latte"],"sources":["https://perfectdailygrind.com/2023/07/best-milks-latte-art/","https://completehomebarista.com/faqs/milk-latte-art/alternative-milk-guide/","https://clivecoffee.com/blogs/learn/does-the-type-of-milk-you-use-matter/"]},{"id":"latte-art","name":{"ro":"Latte art: inimă, lalea, rozetă","en":"Latte art basics: heart, tulip, rosetta"},"category":"milk","difficulty":3,"gear":{"ro":"Carafă cu cioc ascuțit (350 ml pentru o ceașcă), ceașcă largă, rotundă, de 150–250 ml, microspumă proaspătă.","en":"Sharp-spouted pitcher (350 ml for one cup), wide round 150–250 ml cup, fresh microfoam."},"howItWorks":{"ro":"Desenul apare din contrastul dintre cremă și spuma albă. Mai întâi torni de sus, subțire, ca laptele să intre sub cremă și să „umple” baza; apoi cobori ciocul aproape de suprafață și mărești debitul, iar spuma rămâne deasupra și desenează. Mișcarea de la final, prin mijloc, închide forma.","en":"The design comes from contrast between crema and white foam. First pour high and thin so milk dives under the crema and builds the base; then bring the spout close to the surface and increase flow, so the foam floats and draws. A final cut through the middle closes the shape."},"profile":{"ro":"Nu schimbă gustul, dar e cel mai bun test al calității microspumei.","en":"It doesn't change the taste, but it's the best test of your microfoam quality."},"grindKey":null,"mistakes":[{"ro":"Spumă prea groasă (de cappuccino) pentru latte art: iese o pată albă.","en":"Foam too thick (cappuccino-style): you get a white blob."},{"ro":"Aștepți prea mult după spumare: laptele se separă.","en":"Waiting too long after steaming: the milk separates."},{"ro":"Torni de prea sus în faza de desen: spuma se scufundă.","en":"Pouring too high in the drawing phase: the foam sinks."}],"tips":[{"ro":"Rotește laptele în carafă până când arată ca vopseaua lucioasă, chiar înainte de turnare.","en":"Swirl until the milk looks like glossy paint, right before pouring."},{"ro":"Înclină ceașca spre carafă la început și îndreapt-o pe măsură ce se umple.","en":"Tilt the cup toward the pitcher at first and level it as it fills."},{"ro":"Învață întâi inima, apoi laleaua (inimi stivuite), abia apoi rozeta.","en":"Learn the heart first, then the tulip (stacked hearts), then the rosetta."}],"recipeIds":["flat-white","latte","cortado"],"sources":["https://perfectdailygrind.com/2022/12/how-do-you-pour-great-latte-art-at-home/","https://perfectdailygrind.com/2023/07/best-milks-latte-art/","https://au.lamarzoccohome.com/blog/how-to-steam-milk-like-a-pro-barista/"]},{"id":"classic-milk-drinks","name":{"ro":"Băuturi clasice cu lapte","en":"Classic milk drinks"},"category":"drinks","difficulty":1,"gear":{"ro":"Espressor, lance de abur sau NanoFoamer, cești de 60–300 ml.","en":"Espresso machine, steam wand or NanoFoamer, 60–300 ml cups."},"history":{"ro":"Cappuccino-ul modern s-a definit în Italia anilor '50, odată cu lancea de abur; flat white-ul a apărut în anii '80 în Australia și Noua Zeelandă.","en":"The modern cappuccino took shape in 1950s Italy with the steam wand; the flat white emerged in the 1980s in Australia and New Zealand."},"howItWorks":{"ro":"Diferența dintre ele e doar proporția espresso:lapte și grosimea spumei. Macchiato (o lingură de spumă), cortado (~1:1, spumă puțină), piccolo (ristretto în paharul mic), flat white (spumă subțire, gust de cafea puternic), cappuccino (~1 cm de spumă, 150–180 ml) și latte (200–300 ml, mult lapte).","en":"The only differences are the espresso:milk ratio and foam thickness. Macchiato (a spoon of foam), cortado (~1:1, little foam), piccolo (ristretto in a small glass), flat white (thin foam, strong coffee flavour), cappuccino (~1 cm foam, 150–180 ml) and latte (200–300 ml, lots of milk)."},"profile":{"ro":"Cu cât e mai puțin lapte, cu atât cafeaua domină; cu cât e mai multă spumă, cu atât e mai aerat și mai ușor.","en":"The less milk, the more the coffee dominates; the more foam, the lighter and airier the drink."},"grindKey":"espresso","mistakes":[{"ro":"Același lapte spumat pentru toate băuturile: flat white-ul iese cappuccino.","en":"Using the same foam for every drink: your flat white becomes a cappuccino."},{"ro":"Ceașcă prea mare: băutura se răcește și se diluează.","en":"Cup too big: the drink cools and dilutes."},{"ro":"Espresso-ul stă un minut înainte să torni laptele; crema se strică.","en":"Letting the espresso sit a minute before adding milk; the crema dies."}],"tips":[{"ro":"Spumează laptele cât timp curge shot-ul dacă aparatul permite (dual boiler/HX).","en":"Steam while the shot runs if your machine allows it (dual boiler/HX)."},{"ro":"Prăjirile medii-închise taie mai bine prin lapte; cele deschise dau note de fructe și lapte cu ciocolată.","en":"Medium-dark roasts cut through milk better; light roasts give fruity, chocolate-milk notes."},{"ro":"Folosește cântarul și pentru lapte: aceleași grame, aceeași băutură.","en":"Weigh the milk too: same grams, same drink."}],"recipeIds":["macchiato","cortado","piccolo","flat-white","cappuccino","latte"],"sources":["https://outin.com/blogs/news/cortado-vs-flat-white-what-is-the-difference","https://www.tastingtable.com/1663389/difference-piccolo-vs-cortado/","https://www.sageappliances.com/uk/en/blog/coffee-and-espresso/cortado-vs-flat-white.html","https://thecoffeelocator.com/guide/flat-white-vs-cappuccino-vs-cortado/","https://au.lamarzoccohome.com/blog/how-to-steam-milk-with-a-home-espresso-machine/"]},{"id":"black-espresso-drinks","name":{"ro":"Americano, long black și affogato","en":"Americano, long black and affogato"},"category":"drinks","difficulty":1,"gear":{"ro":"Espressor, apă fierbinte (fierbător sau robinetul aparatului), înghețată de vanilie pentru affogato.","en":"Espresso machine, hot water (kettle or machine tap), vanilla ice cream for affogato."},"history":{"ro":"Legenda spune că numele „Americano” vine de la soldații americani din Italia celui de-Al Doilea Război Mondial, care diluau espresso-ul ca să semene cu cafeaua de acasă.","en":"Legend has it the name “Americano” comes from US soldiers in WWII Italy diluting espresso to resemble coffee from home."},"howItWorks":{"ro":"Americano înseamnă espresso diluat cu apă fierbinte; long black e aceeași idee, dar espresso-ul se toarnă peste apă, ca să păstreze crema. Affogato înseamnă „înecat”: un shot fierbinte turnat peste o bilă de înghețată.","en":"An Americano is espresso diluted with hot water; a long black is the same idea, but the espresso goes on top of the water to keep the crema. Affogato means “drowned”: a hot shot poured over a scoop of ice cream."},"profile":{"ro":"Americano e mai rotund și uniform; long black e mai aromat și mai intens la prima sorbitură. Affogato e cald, rece, amar și dulce în același timp.","en":"An Americano is rounder and more uniform; a long black is more aromatic and intense on the first sip. Affogato is hot, cold, bitter and sweet all at once."},"grindKey":"espresso","mistakes":[{"ro":"Apă clocotită peste espresso: amăreală și gust de ars.","en":"Boiling water onto espresso: bitter, burnt notes."},{"ro":"Faci un shot de 90 s în loc să adaugi apă: supraextracție.","en":"Pulling a 90 s shot instead of adding water: over-extraction."},{"ro":"Înghețată moale, scoasă de mult din congelator, pentru affogato.","en":"Soft, half-melted ice cream for affogato."}],"tips":[{"ro":"Apă la 80–90 °C, nu direct de la fierbere.","en":"Water at 80–90 °C, not straight off the boil."},{"ro":"Raport bun de pornire: 1 parte espresso la 3–5 părți apă.","en":"A good starting ratio: 1 part espresso to 3–5 parts water."},{"ro":"Răcește paharul de affogato în congelator 10 minute.","en":"Chill the affogato glass in the freezer for 10 minutes."}],"recipeIds":["americano","long-black","affogato"],"sources":["https://home.lamarzoccousa.com/brew-ratios-around-world/","https://www.hachette.com.au/james-hoffmann/how-to-make-the-best-coffee"]},{"id":"iced-espresso","name":{"ro":"Espresso rece: freddo, shakerato, iced latte, cold foam","en":"Iced espresso: freddo, shakerato, iced latte, cold foam"},"category":"drinks","difficulty":2,"gear":{"ro":"Espressor, shaker sau spumantor de mână/blender pentru frappé, gheață din apă filtrată, pahare înalte.","en":"Espresso machine, shaker or handheld frother/frappé mixer, ice from filtered water, tall glasses."},"history":{"ro":"Freddo espresso a apărut în Grecia anilor '90 ca urmaș al frappé-ului cu cafea instant inventat la Salonic în 1957.","en":"Freddo espresso appeared in 1990s Greece as the successor to the instant-coffee frappé invented in Thessaloniki in 1957."},"howItWorks":{"ro":"Espresso-ul fierbinte e răcit brusc pe gheață și aerat: bulele mici creează o spumă densă care ține ore întregi. Freddo espresso (Grecia, anii '90) se bate cu 2–3 cuburi de gheață, freddo cappuccino primește deasupra „afrogala”, spumă de lapte rece degresat. Shakerato-ul italian se agită în shaker și se strecoară, iar cold foam-ul e lapte rece spumat pus peste orice băutură rece.","en":"Hot espresso is shock-chilled on ice and aerated: tiny bubbles form a dense foam that lasts for hours. Freddo espresso (Greece, 1990s) is whipped with 2–3 ice cubes; freddo cappuccino gets “afrogala”, cold skimmed-milk foam, on top. Italian shakerato is shaken and strained, and cold foam is frothed cold milk spooned over any iced drink."},"profile":{"ro":"Rece, catifelat, cu spumă cremoasă; zahărul adăugat la cald se dizolvă și dă corp.","en":"Cold, velvety, with creamy foam; sugar added while hot dissolves and adds body."},"grindKey":"espresso","mistakes":[{"ro":"Torni espresso fierbinte direct în paharul de servire cu gheață puțină: se diluează.","en":"Pouring hot espresso straight into the serving glass with little ice: it gets watery."},{"ro":"Adaugi zahăr după răcire: nu se mai dizolvă.","en":"Adding sugar after chilling: it won't dissolve."},{"ro":"Faci cold foam cu lapte integral cald: spuma nu ține.","en":"Making cold foam with warm whole milk: it won't hold."}],"tips":[{"ro":"Gheață din apă filtrată; gheața din congelator absoarbe mirosuri.","en":"Use ice from filtered water; freezer ice picks up odours."},{"ro":"Laptele degresat face cea mai stabilă spumă rece.","en":"Skimmed milk makes the most stable cold foam."},{"ro":"Un espresso ceva mai lung (1:2,2) compensează diluția de la gheață.","en":"A slightly longer espresso (1:2.2) offsets the dilution from ice."}],"recipeIds":["freddo-espresso","freddo-cappuccino","shakerato","iced-latte","cold-foam","tonic","proffee-iced","dirty-matcha","yuzu-espresso-fizz","flash-sweet-cream"],"sources":["https://europeancoffeetrip.com/freddo-espresso-freddo-cappuccino/","https://www.coffeeness.de/en/what-is-freddo-espresso/","https://houseofcoffee.smeg.com/recipes/caffe-shakerato","https://methodicalcoffee.com/blogs/coffee-culture/shaken-espresso-what-it-is-and-how-to-make-one"]},{"id":"sweet-and-spirited","name":{"ro":"Dulci și cu alcool: mocha, bombón, Spanish latte, cà phê sữa đá, espresso martini","en":"Sweet and spirited: mocha, bombón, Spanish latte, cà phê sữa đá, espresso martini"},"category":"drinks","difficulty":2,"gear":{"ro":"Espressor, lapte condensat îndulcit, ciocolată neagră, shaker, gheață; pentru cà phê sữa đá autentic, un filtru phin.","en":"Espresso machine, sweetened condensed milk, dark chocolate, shaker, ice; a phin filter for authentic cà phê sữa đá."},"history":{"ro":"Espresso martini a fost creat de Dick Bradsell la Londra, la sfârșitul anilor '80; café bombón vine din Valencia, iar cà phê sữa đá s-a născut din lipsa laptelui proaspăt în Vietnamul colonial.","en":"The espresso martini was created by Dick Bradsell in London in the late 1980s; café bombón comes from Valencia, and cà phê sữa đá grew out of the scarcity of fresh milk in colonial Vietnam."},"howItWorks":{"ro":"Laptele condensat și ciocolata adaugă dulceață și corp care echilibrează amăreala cafelei. Café bombón (Valencia) și Spanish latte folosesc lapte condensat; cà phê sữa đá vietnamez se face tradițional cu phin-ul, lent, peste lapte condensat și gheață. Espresso martini agită espresso proaspăt cu vodcă și lichior de cafea; uleiurile cafelei fac spuma.","en":"Condensed milk and chocolate add sweetness and body that balance coffee's bitterness. Café bombón (Valencia) and Spanish latte use condensed milk; Vietnamese cà phê sữa đá is traditionally brewed slowly through a phin over condensed milk and ice. An espresso martini shakes fresh espresso with vodka and coffee liqueur; the coffee's oils make the foam."},"profile":{"ro":"Desert în ceașcă: dens, dulce, caramelizat sau ciocolatos. Martini-ul e sec, amar și cu spumă fină.","en":"Dessert in a cup: dense, sweet, caramel or chocolatey. The martini is dry, bitter and finely foamed."},"grindKey":"espresso","mistakes":[{"ro":"Folosești lapte condensat neîndulcit (evaporat): nu are dulceața și densitatea necesară.","en":"Using unsweetened evaporated milk: it lacks the sweetness and density."},{"ro":"Pudră de cacao direct în lapte: rămân cocoloașe.","en":"Stirring cocoa powder straight into milk: lumps."},{"ro":"Espresso vechi sau rece pentru martini: fără spumă.","en":"Old or cold espresso in a martini: no foam."}],"tips":[{"ro":"Topește ciocolata în espresso-ul fierbinte, apoi adaugă laptele.","en":"Melt the chocolate into the hot espresso, then add the milk."},{"ro":"Pentru straturi, toarnă espresso-ul încet, peste dosul unei lingurițe.","en":"For layers, pour the espresso slowly over the back of a spoon."},{"ro":"Shaker plin cu gheață și 15 s de agitat energic pentru o spumă densă la martini.","en":"A shaker packed with ice and 15 s of hard shaking give a dense martini foam."}],"recipeIds":["mocha","cafe-bombon","spanish-latte","ca-phe-sua-da","espresso-martini"],"sources":["https://coffeegeek.com/guides/howtos/how-to-make-vietnamese-iced-coffee/","https://capheproject.squarespace.com/brew-guides/phin","https://www.hachette.com.au/james-hoffmann/how-to-make-the-best-coffee"]}],"trends":[{"id":"protein-coffee","title":{"ro":"Cafea cu proteine („proffee”)","en":"Protein coffee (\"proffee\")"},"category":"drink","summary":{"ro":"Lapte îmbogățit cu proteine și spumă rece proteică au intrat în meniul principal: Starbucks a lansat gama Protein în septembrie 2025, cu 15 g de proteine doar din spumă și până la 36 g într-un latte. Acasă, varianta simplă este un shot de espresso sau cold brew peste un shake proteic.","en":"Protein-boosted milk and protein cold foam went mainstream: Starbucks launched its Protein line in September 2025, with 15 g of protein from the foam alone and up to 36 g in a latte. At home, the simple version is a shot of espresso or cold brew over a protein shake."},"whyNow":{"ro":"Trendul fitness s-a întâlnit cu ritualul de dimineață, iar lanțurile mari îl împing agresiv.","en":"Fitness culture met the morning ritual, and the big chains are pushing it hard."},"tryAtHome":{"ro":"Pune 200 ml de lapte proteic rece (sau shake de vanilie) peste gheață și toarnă deasupra un espresso dublu. Nu încălzi shake-urile din pudră peste 60 °C, pentru că se brânzesc.","en":"Pour 200 ml of cold protein milk (or a vanilla shake) over ice and top with a double espresso. Don't heat powder-based shakes above 60 °C, or they curdle."},"recipeHint":"proffee-iced","hype":3,"longevity":"rising","relevanceRO":2,"sources":["https://about.starbucks.com/press/2026/protein-power-hour-starbucks-says-friday-at-8-a-m-is-the-busiest-time-for-protein-drinks/","https://fortune.com/well/2025/06/11/starbucks-tests-protein-latte","https://www.tastingtable.com/2237336/biggest-coffee-trends-2026/"],"recipeId":"proffee-iced"},{"id":"cold-foam","title":{"ro":"Spumă rece și sweet cream","en":"Cold foam & sweet cream"},"category":"drink","summary":{"ro":"Spuma rece din smântână, lapte și sirop de vanilie s-a mutat din cafenele în frigiderul de acasă. Interesul în SUA a crescut cu 73% de la un an la altul, cu 105% pe TikTok, iar în magazine au apărut conserve de spumă rece. Starbucks raportează creșteri de două cifre la cold foam în 2025–2026.","en":"Cold foam made from cream, milk and vanilla syrup moved from cafés to the home fridge. US interest grew 73% year over year (105% on TikTok), and canned cold foam has reached supermarket shelves. Starbucks reports double-digit cold foam growth across 2025–2026."},"whyNow":{"ro":"Personalizarea băuturilor reci e principalul limbaj al Gen Z, iar spuma e cel mai ușor upgrade vizibil.","en":"Customising iced drinks is Gen Z's main coffee language, and foam is the easiest visible upgrade."},"tryAtHome":{"ro":"Spumează 40 ml smântână de frișcă, 30 ml lapte și 10 ml sirop de vanilie cu un spumator de mână timp de 20–30 s, până se îngroașă, și pune-o peste cold brew sau flash brew.","en":"Froth 40 ml whipping cream, 30 ml milk and 10 ml vanilla syrup with a handheld frother for 20–30 s until thick, then spoon it over cold brew or flash brew."},"recipeHint":"flash-sweet-cream","hype":3,"longevity":"established","relevanceRO":2,"sources":["https://www.spate.nyc/blog/cold-foam-from-cafe-to-grocery-shelf","https://about.starbucks.com/press/2026/protein-power-hour-starbucks-says-friday-at-8-a-m-is-the-busiest-time-for-protein-drinks/","https://perfectdailygrind.com/2026/01/coffee-shop-trends-in-2026/"],"recipeId":"flash-sweet-cream"},{"id":"matcha-espresso","title":{"ro":"Matcha + espresso („dirty matcha”)","en":"Matcha + espresso (\"dirty matcha\")"},"category":"drink","summary":{"ro":"Matcha a trecut de la alternativă la produs de bază în meniu: Caffè Nero și Black Sheep au raportat vânzări de matcha care uneori le-au depășit pe cele de cafea, iar 5 to Go a deschis în România un concept dedicat. Combinația stratificată de matcha cu un shot de espresso este cea mai fotogenică băutură hibrid a momentului.","en":"Matcha moved from alternative to core menu item: Caffè Nero and Black Sheep reported matcha sales at times overtaking coffee, and 5 to Go opened a dedicated matcha concept in Romania. A layered matcha latte with an espresso shot is the most photogenic hybrid drink right now."},"whyNow":{"ro":"Căutările „matcha vs coffee” au explodat în 2026, iar oamenii își cumpără tel și bol pentru matcha acasă.","en":"Searches for \"matcha vs coffee\" hit breakout status in 2026, and people are buying matcha whisks and bowls for home."},"tryAtHome":{"ro":"Bate 2 g de matcha cu 40 ml de apă la 80 °C, toarnă peste 150 ml lapte rece cu gheață și termină cu un espresso simplu turnat încet deasupra, ca să rămână în straturi.","en":"Whisk 2 g matcha with 40 ml water at 80 °C, pour over 150 ml cold milk and ice, then float a single espresso on top slowly so it stays layered."},"recipeHint":"dirty-matcha","hype":3,"longevity":"rising","relevanceRO":3,"sources":["https://perfectdailygrind.com/2026/01/coffee-shop-trends-in-2026/","https://perfectdailygrind.com/2026/06/why-romania-specialty-coffee-is-growing/","https://www.businesstoday.in/technology/news/story/is-matcha-replacing-your-daily-coffee-google-search-trends-point-to-a-major-shift-554953-2026-09-12","https://freshcup.com/the-matcha-boom-is-reshaping-cafes-how-long-before-it-hits-a-wall/"],"recipeId":"dirty-matcha"},{"id":"espresso-tonic","title":{"ro":"Espresso tonic și băuturi spumante","en":"Espresso tonic & sparkling coffee"},"category":"drink","summary":{"ro":"Băutura creată la Koppi (Helsingborg, Suedia) în 2007 a devenit un clasic modern, iar cafenelele adaugă acum cascara soda, matcha spumantă și tonice aromate. Morgan Eckroth o pune printre rețetele de bază din noua ei carte pentru acasă (octombrie 2026).","en":"Born at Koppi (Helsingborg, Sweden) in 2007, it has become a modern classic, and cafés now add cascara sodas, sparkling matcha and flavoured tonics. Morgan Eckroth lists it among the basics in her new home-coffee book (October 2026)."},"whyNow":{"ro":"Cafeaua rece pe tot parcursul anului e acum fundația meniurilor, nu un extra de vară.","en":"Year-round iced coffee is now the foundation of café menus, not a summer extra."},"tryAtHome":{"ro":"Umple paharul până sus cu gheață, toarnă 100 ml tonic rece și apoi, încet, un espresso fructat (Etiopia, Kenya). Multă gheață și tonic bine răcit înseamnă mai puțină spumă care dă pe dinafară.","en":"Fill the glass to the brim with ice, add 100 ml cold tonic, then slowly pour a fruity espresso (Ethiopia, Kenya). Plenty of ice and well-chilled tonic mean less foam overflow."},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":2,"sources":["https://europeancoffeetrip.com/espressoandtonic-story/","https://www.beanscenemag.com.au/specialty-coffee-trends-to-look-for-in-2026/","https://www.penguinrandomhouse.com/books/811028/coffee-for-here-by-morgan-eckroth/9798217035366"]},{"id":"dirty-soda","title":{"ro":"Dirty soda și espresso soda","en":"Dirty soda & espresso soda"},"category":"drink","summary":{"ro":"Sucurile „murdare”, adică suc carbogazos cu sirop, smântână și lime, au pornit din Utah și s-au răspândit prin TikTok. Variantele cu espresso, de tip espresso + cola + smântână sau espresso + apă minerală + sirop de fructe, apar tot mai des în cafenelele de specialitate.","en":"\"Dirty\" sodas, meaning soda with syrup, cream and lime, started in Utah and spread through TikTok. Espresso versions, such as espresso + cola + cream or espresso + sparkling water + fruit syrup, increasingly appear in specialty cafés."},"whyNow":{"ro":"E o băutură ieftină, personalizabilă și foarte vizuală, construită pentru social media.","en":"It's cheap, customisable and highly visual, built for social media."},"tryAtHome":{"ro":"Pune gheață, 150 ml apă minerală, 15 ml sirop de cireșe sau caramel, un espresso și 20 ml smântână deasupra. Gustă înainte să adaugi mai mult sirop.","en":"Add ice, 150 ml sparkling water, 15 ml cherry or caramel syrup, an espresso and 20 ml cream on top. Taste before adding more syrup."},"recipeHint":"","hype":2,"longevity":"fad","relevanceRO":1,"sources":["https://www.innovamarketinsights.com/trends/dirty-soda-trends-global-market-overview/","https://torontolife.com/food/sam-james-coffee-bar-dirty-soda/","https://www.washingtontimes.com/news/2025/apr/16/dirty-sodas-sweet-creamy-phenomenon-taking-america/"]},{"id":"asian-flavours","title":{"ro":"Arome asiatice: yuzu, ube, pandan, hojicha","en":"Asian flavours: yuzu, ube, pandan, hojicha"},"category":"drink","summary":{"ro":"Asia dictează acum aromele din cafenele: yuzu, ube, pandan, miso, susan negru și hojicha apar în lattes și în cafele cu fructe. Căutările pentru ube au atins un maxim istoric în august 2026, iar Nespresso a lansat Yuzu Vanilla Over Ice.","en":"Asia now sets café flavour trends: yuzu, ube, pandan, miso, black sesame and hojicha show up in lattes and fruit-forward coffees. Ube searches hit an all-time high in August 2026, and Nespresso launched Yuzu Vanilla Over Ice."},"whyNow":{"ro":"Meniurile cu ediții limitate cer arome noi, iar citricele asiatice se potrivesc natural cu espresso-urile luminoase.","en":"Limited-time menus need novelty, and Asian citrus pairs naturally with bright espresso."},"tryAtHome":{"ro":"Amestecă 15 ml suc de yuzu (sau lămâie + portocală 1:1) cu 10 ml miere și 120 ml apă minerală peste gheață, apoi adaugă un espresso dublu.","en":"Mix 15 ml yuzu juice (or lemon + orange 1:1) with 10 ml honey and 120 ml sparkling water over ice, then add a double espresso."},"recipeHint":"yuzu-espresso-fizz","hype":2,"longevity":"rising","relevanceRO":2,"sources":["https://perfectdailygrind.com/2026/01/coffee-shop-trends-in-2026/","https://www.tastingtable.com/2237336/biggest-coffee-trends-2026/","https://www.trendhunter.com/trends/yuzu-vanilla-over-ice","https://www.businesstoday.in/technology/news/story/is-matcha-replacing-your-daily-coffee-google-search-trends-point-to-a-major-shift-554953-2026-09-12"],"recipeId":"yuzu-espresso-fizz"},{"id":"freddo","title":{"ro":"Freddo espresso și freddo cappuccino","en":"Freddo espresso & freddo cappuccino"},"category":"drink","summary":{"ro":"Espresso-ul grecesc agitat cu gheață reprezintă 70–80% din cafelele reci consumate în Grecia și se răspândește în Balcani și în restul Europei pe fondul verilor tot mai calde. Agitarea răcește instant cafeaua și creează o spumă cremoasă, iar varianta cappuccino adaugă lapte rece spumat.","en":"The Greek espresso shaken with ice makes up 70–80% of cold coffee drunk in Greece, and it is spreading through the Balkans and Europe as summers get hotter. Shaking chills the coffee instantly and builds a creamy foam, and the cappuccino version adds cold frothed milk."},"whyNow":{"ro":"Românii petrec vacanțele în Grecia și se întorc cu obiceiul freddo, iar verile de 35 °C îl fac practic.","en":"Romanians holiday in Greece and bring the freddo habit home, and 35 °C summers make it practical."},"tryAtHome":{"ro":"Agită un espresso dublu cu 4–5 cuburi de gheață într-un shaker sau borcan timp de 15 s, apoi strecoară-l peste gheață proaspătă. Zahărul se pune înainte de agitare.","en":"Shake a double espresso with 4–5 ice cubes in a shaker or jar for 15 s, then strain over fresh ice. Add any sugar before shaking."},"recipeHint":"freddo-espresso","hype":2,"longevity":"established","relevanceRO":3,"sources":["https://www.tovima.com/culture/the-freddo-espresso-a-modern-greek-cultural-phenomenon/","https://europeancoffeetrip.com/greek-superb-cold-coffees-freddo-espresso-freddo-cappuccino/","https://www.milletnews.com/economy/greek-freddo-conquers-overheating-planet"],"recipeId":"freddo-espresso"},{"id":"flash-brew","title":{"ro":"Flash brew (cafea japoneză cu gheață)","en":"Flash brew (Japanese iced coffee)"},"category":"drink","summary":{"ro":"Cafeaua preparată fierbinte direct peste gheață păstrează aromele florale și acidulate pe care cold brew-ul le pierde, și e gata în 3 minute, nu în 16 ore. Lanțuri și prăjitorii o promovează drept alternativa rapidă la cold brew.","en":"Coffee brewed hot straight onto ice keeps the floral, acidic aromatics that cold brew loses, and it's ready in 3 minutes rather than 16 hours. Chains and roasters promote it as the fast alternative to cold brew."},"whyNow":{"ro":"Cafeaua rece e acum consumată tot anul, iar cafelele luminoase de specialitate ies mai bine așa decât în cold brew.","en":"Iced coffee is now a year-round habit, and light specialty roasts taste better this way than as cold brew."},"tryAtHome":{"ro":"Folosește 20 g cafea, 200 g apă la 96 °C și 100 g gheață în carafă, cu o măcinare puțin mai fină decât de obicei. Agită la final până se topește gheața.","en":"Use 20 g coffee, 200 g water at 96 °C and 100 g ice in the server, with a slightly finer grind than usual. Swirl at the end until the ice melts."},"recipeHint":"flash-sweet-cream","hype":2,"longevity":"established","relevanceRO":2,"sources":["https://www.tastingtable.com/2237336/biggest-coffee-trends-2026/","https://partnerscoffee.com/blogs/education/flash-brew-japanese-iced-coffee","https://www.beanscenemag.com.au/specialty-coffee-trends-to-look-for-in-2026/"],"recipeId":"flash-sweet-cream"},{"id":"nitro","title":{"ro":"Cafea nitro","en":"Nitro coffee"},"category":"drink","summary":{"ro":"Infuzia cu azot a trecut de la robinetele de cold brew la băuturi pe bază de espresso și la doze. Textura catifelată pare dulce fără zahăr adăugat. Acasă există sifoane și dispozitive pentru nitro, dar sunt încă de nișă.","en":"Nitrogen infusion has moved from cold brew taps into espresso drinks and cans. The velvety texture tastes sweet without added sugar. Home nitro siphons and devices exist but remain niche."},"whyNow":{"ro":"Segmentul RTD crește rapid, iar nitro diferențiază produsul pe raft.","en":"RTD is growing fast, and nitro differentiates products on the shelf."},"tryAtHome":{"ro":"Fără echipament nitro, imită textura agitând cold brew-ul cu gheață într-un shaker 20 s sau folosind un sifon de frișcă cu cartușe N₂O, numai după instrucțiunile producătorului.","en":"Without nitro gear, fake the texture by shaking cold brew with ice for 20 s, or use a cream whipper with N₂O cartridges, following the manufacturer's instructions."},"recipeHint":"","hype":1,"longevity":"established","relevanceRO":1,"sources":["https://www.tastingtable.com/2237336/biggest-coffee-trends-2026/","https://www.foodnavigator.com/Article/2026/01/28/top-coffee-trends-functional-coffee-rtd-specialty-coffee-cold-brew/"]},{"id":"specialty-instant","title":{"ro":"Cafea instant de specialitate (liofilizată)","en":"Specialty instant coffee (freeze-dried)"},"category":"drink","summary":{"ro":"Vânzările de cafea instant în SUA au crescut cu 24% în doi ani, iar Gen Z și-a dublat cheltuielile pe instant între 2022 și 2024. Prăjitorii de top, precum Intelligentsia, Partners și Verve, vând acum cafea liofilizată de specialitate, produsă de firme precum Swift Coffee.","en":"US instant coffee sales rose 24% in two years, and Gen Z more than doubled its instant spending from 2022 to 2024. Top roasters such as Intelligentsia, Partners and Verve now sell freeze-dried specialty coffee made by firms like Swift Coffee."},"whyNow":{"ro":"Prețurile mari și călătoriile fac din instantul de calitate o soluție de buget și de drum.","en":"High prices and travel make quality instant a budget and on-the-go solution."},"tryAtHome":{"ro":"Dizolvă un plic de instant de specialitate în 180 ml apă la 85–90 °C, nu în apă clocotită, sau în apă rece cu gheață pentru o cafea instant rece. Compară-l pe gustul tău cu o cafea la filtru.","en":"Dissolve a specialty instant sachet in 180 ml of 85–90 °C water, not boiling, or in cold water over ice. Compare it side by side with a filter brew."},"recipeHint":"","hype":2,"longevity":"rising","relevanceRO":2,"sources":["https://dallasnews.com/business/retail/2025/03/22/budget-minded-gen-z-consumers-fuel-instant-coffee-boom","https://urnex.com/blog/specialty-coffee-meet-instant-coffee"]},{"id":"functional-coffee","title":{"ro":"Cafea funcțională: ciuperci, colagen, L-teanină","en":"Functional coffee: mushrooms, collagen, L-theanine"},"category":"drink","summary":{"ro":"Cafelele cu adaptogeni (lion's mane, reishi), colagen sau L-teanină au ieșit din magazinele de wellness și au intrat în cafenele, de exemplu la Black Sheep Coffee. RTD-urile funcționale au devenit mainstream. Dovezile științifice pentru multe dintre beneficii sunt încă slabe.","en":"Coffees with adaptogens (lion's mane, reishi), collagen or L-theanine have left wellness stores for cafés, for example Black Sheep Coffee. Functional RTDs went mainstream. Scientific evidence for many of the claimed benefits is still thin."},"whyNow":{"ro":"Consumatorii vor să reducă nervozitatea dată de cofeină fără să renunțe la ritual.","en":"Consumers want to cut caffeine jitters without giving up the ritual."},"tryAtHome":{"ro":"","en":""},"recipeHint":"","hype":2,"longevity":"rising","relevanceRO":1,"sources":["https://www.tastingtable.com/2237336/biggest-coffee-trends-2026/","https://www.beanscenemag.com.au/specialty-coffee-trends-to-look-for-in-2026/","https://www.foodnavigator.com/Article/2026/01/28/top-coffee-trends-functional-coffee-rtd-specialty-coffee-cold-brew/"]},{"id":"swavory","title":{"ro":"Dulce-sărat („swavory”): sare, miso, ulei de măsline","en":"Sweet-savory (\"swavory\"): salt, miso, olive oil"},"category":"drink","summary":{"ro":"Ingredientele sărate intră în băuturile dulci: latte cu caramel și miso, fistic sărat, tahini, ulei de măsline și spumă de brânză. Un vârf de sare în cafea, un truc vechi, e redescoperit pentru că taie amăreala.","en":"Savory ingredients are entering sweet drinks: miso-caramel and salted pistachio lattes, tahini, olive oil and cheese foam. A pinch of salt in coffee, an old trick, is back because it tames bitterness."},"whyNow":{"ro":"Bucătăria fusion și TikTok împing contrastele de gust.","en":"Fusion cooking and TikTok are pushing taste contrasts."},"tryAtHome":{"ro":"Adaugă 1 linguriță de pastă de fistic și un praf de sare în laptele pentru latte înainte de spumare. Sau încearcă 5 ml ulei de măsline extravirgin spumat cu laptele.","en":"Blend 1 tsp pistachio paste and a pinch of salt into the latte milk before frothing, or try 5 ml extra-virgin olive oil frothed with the milk."},"recipeHint":"","hype":2,"longevity":"rising","relevanceRO":2,"sources":["https://www.tastingtable.com/2237336/biggest-coffee-trends-2026/","https://perfectdailygrind.com/2026/01/coffee-shop-trends-in-2026/"]},{"id":"hybrid-brewers","title":{"ro":"Dripere hibride: Hario Switch, Pulsar, April","en":"Hybrid brewers: Hario Switch, Pulsar, April"},"category":"method","summary":{"ro":"Driperele care combină imersia cu percolarea au revenit puternic: 4 din primii 9 concurenți la World Brewers Cup 2025 au folosit drippere hibride, 3 finaliști fiind pe Hario Switch. Pulsar de la NextLevel adaugă un capac de dispersie și un robinet pentru „bloom” în imersie.","en":"Brewers that combine immersion and percolation are back in force: 4 of the top 9 competitors at the 2025 World Brewers Cup used hybrid brewers, 3 finalists on the Hario Switch. NextLevel's Pulsar adds a dispersion cap and a valve for steeped blooming."},"whyNow":{"ro":"Oferă claritatea unui pour-over cu iertarea unei imersii, adică rezultate repetabile pentru începători.","en":"They give pour-over clarity with immersion's forgiveness, so beginners get repeatable results."},"tryAtHome":{"ro":"Pe un Switch închis, toarnă 250 g apă la 95 °C peste 15 g cafea, amestecă la 2:00 și deschide valva la 2:15 (rețeta lui Hoffmann).","en":"On a closed Switch, pour 250 g water at 95 °C over 15 g coffee, stir at 2:00 and open the valve at 2:15 (Hoffmann's recipe)."},"recipeHint":"switch-hybrid","hype":2,"longevity":"rising","relevanceRO":2,"sources":["https://perfectdailygrind.com/2026/03/hybrid-coffee-brewers-making-comeback/","https://dailycoffeenews.com/2023/06/28/pulsar-is-the-new-star-of-the-nextlevel-brewer-line/","https://kurasu.kyoto/blogs/kurasu-journal/switch"],"recipeId":"switch-hybrid"},{"id":"low-agitation-temp","title":{"ro":"Agitare redusă și temperaturi duble","en":"Low agitation & split temperatures"},"category":"method","summary":{"ro":"Campionul World Brewers Cup 2025, George Jinyang Peng, a turnat prima parte la 96 °C și ultima la 80 °C, cu un Melodrip care reduce agitarea, pentru mai puțină amăreală. Mulți prăjitori recomandă acum ape mai reci și turnări blânde la cafelele foarte procesate.","en":"2025 World Brewers Cup champion George Jinyang Peng poured the first part at 96 °C and the last at 80 °C through a Melodrip to cut agitation and bitterness. Many roasters now recommend cooler water and gentle pours for heavily processed coffees."},"whyNow":{"ro":"Cafelele fermentate și foarte solubile din ultimii ani se suprăextrag ușor la apă clocotită.","en":"The fermented, highly soluble coffees of recent years over-extract easily with boiling water."},"tryAtHome":{"ro":"Fă bloom-ul și prima turnare la 96 °C, apoi lasă fierbătorul deschis sau adaugă apă rece până la 80 °C pentru ultima turnare, turnând aproape de pat, fără swirl.","en":"Bloom and do the first pour at 96 °C, then let the kettle cool (or add cold water) to 80 °C for the last pour, pouring close to the bed without swirling."},"recipeHint":"peng-two-temp","hype":2,"longevity":"rising","relevanceRO":2,"sources":["https://honestcoffeeguide.com/brew-recipes/george-jinyang-peng-2025-wbc/","https://wonderstate.com/blogs/wonderstate/why-i-brew-with-lower-water-temperatures-and-you-should-too"],"recipeId":"peng-two-temp"},{"id":"blooming-espresso","title":{"ro":"Blooming espresso","en":"Blooming espresso"},"category":"method","summary":{"ro":"Profilul popularizat de Scott Rao începe cu o preinfuzie până la 4–5 bari, apoi oprește apa circa 30 s pentru ca pucul să „înflorească”, ca la V60, și încheie la ~9 bari. E gândit pentru prăjiri luminoase și extracții lungi, cu gust apropiat de filtru.","en":"The profile popularised by Scott Rao pre-infuses to 4–5 bar, then stops the water for about 30 s so the puck \"blooms\" like a V60, and finishes at ~9 bar. It suits light roasts and long extractions with a filter-like taste."},"whyNow":{"ro":"Aparatele de acasă cu control de flux (Decent, Meticulous, Gaggiuino, Flair) îl fac accesibil.","en":"Home machines with flow control (Decent, Meticulous, Gaggiuino, Flair) make it accessible."},"tryAtHome":{"ro":"Pe un aparat obișnuit, pornește pompa până apar primele picături, oprește-o 20–30 s, apoi repornește-o și oprește la 1:2,5. Pentru prăjiri închise nu îl folosi.","en":"On a regular machine, run the pump until the first drops appear, stop it for 20–30 s, then restart and stop at 1:2.5. Skip it for dark roasts."},"recipeHint":"blooming-espresso","hype":2,"longevity":"rising","relevanceRO":1,"sources":["https://decentespresso.com/docs/all_about_blooming_espresso","https://clivecoffee.com/blogs/learn/best-espresso-machine-for-pressure-profiling-buyers-guide-clive"],"recipeId":"blooming-espresso"},{"id":"turbo-shots","title":{"ro":"Turbo shots și espresso mai lung","en":"Turbo shots & longer-ratio espresso"},"category":"method","summary":{"ro":"Studiul publicat în Matter (Cameron et al., 2020) arată că o măcinare puțin mai grosieră, doze mai mici și shoturi de sub 15 s dau extracții mai uniforme și mai repetabile. Raporturile 1:2,5–1:3 au devenit normale pentru cafelele luminoase.","en":"The study published in Matter (Cameron et al., 2020) showed that a slightly coarser grind, smaller doses and sub-15-second shots give more even, repeatable extractions. Ratios of 1:2.5–1:3 are now normal for light roasts."},"whyNow":{"ro":"Prețul boabelor face atractive tehnicile care obțin mai mult gust din mai puțină cafea.","en":"Bean prices make techniques that get more flavour from less coffee attractive."},"tryAtHome":{"ro":"Macină cu 2–3 trepte mai grosier decât de obicei și scoate 54 g din 18 g în 15–20 s. Dacă e prea acru, revino la o treaptă mai fină.","en":"Grind 2–3 steps coarser than usual and pull 54 g from 18 g in 15–20 s. If sour, go one step finer."},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":2,"sources":["https://www.discovermagazine.com/the-sciences/mathematicians-say-theyve-figured-out-how-to-brew-a-better-espresso-shot","https://www.popsci.com/story/science/coffee-brewing-science/"]},{"id":"puck-prep","title":{"ro":"Puck screen, WDT și pregătirea pucului","en":"Puck screens, WDT & puck prep"},"category":"method","summary":{"ro":"Sita de pe puc (puck screen) distribuie apa mai uniform, reduce canalizarea și păstrează dușul curat. Împreună cu WDT (amestecarea cu ace) și tamperele calibrate, e acum un standard în setup-urile de acasă, deși entuziaștii încă dezbat cât contează.","en":"A puck screen spreads water more evenly, reduces channelling and keeps the shower screen clean. Together with WDT (needle distribution) and calibrated tampers, it's now standard in home setups, though enthusiasts still debate how much it matters."},"whyNow":{"ro":"Sunt upgrade-uri ieftine pentru un aparat de buget.","en":"They're cheap upgrades for a budget machine."},"tryAtHome":{"ro":"Amestecă cafeaua din portafiltru cu o unealtă WDT (sau o agrafă desfăcută), tampează drept și pune o sită de 1,7 mm deasupra. Compară 3 shoturi cu și 3 fără.","en":"Stir the grounds in the portafilter with a WDT tool (or an unfolded paperclip), tamp level and place a 1.7 mm screen on top. Compare 3 shots with and 3 without."},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":2,"sources":["https://clivecoffee.com/blogs/learn/are-puck-screens-worth-it","https://www.home-barista.com/tips/downsides-puck-screens-t104513.html"]},{"id":"single-dose-freezing","title":{"ro":"Single dosing și boabe congelate","en":"Single dosing & frozen beans"},"category":"method","summary":{"ro":"Cântărești fiecare doză separat în loc să ții boabele în buncăr, iar mulți entuziaști congelează porții individuale în tuburi etanșe. Boabele congelate se macină mai uniform și rămân proaspete săptămâni, iar așa poți avea mai multe cafele deschise simultan.","en":"Each dose is weighed separately instead of keeping beans in a hopper, and many enthusiasts freeze individual portions in airtight tubes. Frozen beans grind more evenly and stay fresh for weeks, so you can keep several coffees open at once."},"whyNow":{"ro":"Cafeaua scumpă nu mai trebuie să se învechească în pungă.","en":"Expensive coffee shouldn't go stale in the bag."},"tryAtHome":{"ro":"Împarte o pungă proaspătă în doze de 15–18 g în recipiente etanșe, pune-le la congelator și macină-le direct înghețate, fără să le dezgheți.","en":"Split a fresh bag into 15–18 g doses in airtight containers, freeze them and grind straight from frozen without thawing."},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":2,"sources":["https://kaffeemacher.de/en/blogs/kaffeewissen/freeze-coffee","https://thebasicbarista.com/pages/single-dose-coffee","https://chowhound.com/1533997/freeze-coffee-beans-storage-right-way"]},{"id":"rdt","title":{"ro":"RDT (o picătură de apă pe boabe)","en":"RDT (a drop of water on the beans)"},"category":"method","summary":{"ro":"Ross Droplet Technique înseamnă să pulverizezi sau să pui o picătură de apă pe boabe înainte de măcinare. Elimină electricitatea statică, deci zațul nu se mai lipește și nu mai zboară. E standard în rutinele de single dosing.","en":"The Ross Droplet Technique means spraying or adding a drop of water to the beans before grinding. It kills static so grounds don't cling or scatter. It's standard in single-dosing routines."},"whyNow":{"ro":"Râșnițele cu retenție mică și stațiile de single dosing fac static-ul vizibil și enervant.","en":"Low-retention grinders and single-dosing setups make static visible and annoying."},"tryAtHome":{"ro":"Udă coada unei lingurițe, amestecă boabele cu ea (sau dă 1 pufăit dintr-un pulverizator) și macină. Nu exagera: apa în exces poate rugini râșnița.","en":"Wet the handle of a teaspoon, stir the beans with it (or give one spritz from a sprayer) and grind. Don't overdo it, as excess water can rust the burrs."},"recipeHint":"","hype":1,"longevity":"established","relevanceRO":2,"sources":["https://www.greenplantation.com/a/rdt-technique-why-is-coffee-sprayed-with-water-before-grinding"]},{"id":"water-recipes","title":{"ro":"Rețete de apă și plicuri cu minerale","en":"Water recipes & mineral packets"},"category":"method","summary":{"ro":"Apa are peste 98% din ceașcă, așa că entuziaștii își fac apa din apă distilată plus minerale: plicuri Third Wave Water, picături Lotus sau rețete DIY cu sare amară și bicarbonat. Diferența de gust e ușor de observat.","en":"Water is over 98% of the cup, so enthusiasts build their own from distilled water plus minerals: Third Wave Water packets, Lotus drops, or DIY recipes with Epsom salt and baking soda. The taste difference is easy to notice."},"whyNow":{"ro":"Apa dură a multor orașe strică cafelele luminoase și aparatele.","en":"Many cities' hard water ruins light roasts and machines."},"tryAtHome":{"ro":"Fă un test orb: aceeași cafea cu apă de la robinet filtrată, cu apă îmbuteliată slab mineralizată (sub 150 mg/l reziduu sec) și cu apă distilată plus un plic de minerale.","en":"Do a blind test: the same coffee with filtered tap water, a low-mineral bottled water (under 150 mg/L dry residue), and distilled water plus a mineral packet."},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":3,"sources":["https://dailycoffeenews.com/2022/05/24/the-lotus-water-minerals-kit-helps-coffee-water-blossom","https://gearpatrol.com/2018/04/24/review-third-wave-water-coffee-water-mineral-supplement/"]},{"id":"co-ferments","title":{"ro":"Co-fermentări și cafele „infuzate”: controversa","en":"Co-ferments & \"infused\" coffees: the controversy"},"category":"bean","summary":{"ro":"Cafelele fermentate cu fructe, drojdii sau alte ingrediente dau note de „bomboane acre” sau „budincă de banane”, dar sunt acuzate de lipsă de transparență și chiar de arome artificiale. Best of Panama a interzis cafelele infuzate, iar SCA a lansat cercetarea „What's in my coffee?”.","en":"Coffees fermented with fruit, yeasts or other ingredients give \"sour candy\" or \"banana pudding\" notes, but face accusations of poor transparency and even artificial flavourings. Best of Panama banned infused coffees, and the SCA launched its \"What's in my coffee?\" research."},"whyNow":{"ro":"Piețele noi (China, Arabia Saudită) le cer, iar fermierii le folosesc pentru prețuri mai bune.","en":"New markets (China, Saudi Arabia) want them, and farmers use them to earn better prices."},"tryAtHome":{"ro":"Gustă orb o cafea co-fermentată lângă una spălată din aceeași țară și întreabă prăjitorul ce s-a adăugat exact în fermentare.","en":"Taste a co-fermented coffee blind next to a washed coffee from the same country, and ask the roaster exactly what was added during fermentation."},"recipeHint":"","hype":2,"longevity":"rising","relevanceRO":2,"sources":["https://perfectdailygrind.com/2026/05/issues-with-co-ferment-coffees/","https://perfectdailygrind.com/2025/07/specialty-coffee-opinions-on-infused-coffees/","https://sca.coffee/research-tabs/whats-in-my-coffee-results-and-outcomes-of-reco-spotlight-2025","https://dailycoffeenews.com/2024/06/28/best-of-panama-organizers-take-hard-stance-against-infused-coffees"]},{"id":"experimental-processing","title":{"ro":"Procesări experimentale: anaerob, thermal shock, macerare","en":"Experimental processing: anaerobic, thermal shock, maceration"},"category":"bean","summary":{"ro":"Fermentarea anaerobă, macerarea carbonică și „thermal shock” (cireșe scufundate alternativ în apă fierbinte și rece) sunt acum peste tot. Cafeaua cu care Jack Simpson a câștigat World Barista Championship 2025 a fost un Geisha natural macerat în argon și finisat spălat.","en":"Anaerobic fermentation, carbonic maceration and \"thermal shock\" (cherries dipped alternately in hot and cold water) are everywhere now. The coffee that won Jack Simpson the 2025 World Barista Championship was an argon-macerated natural Geisha with a washed finish."},"whyNow":{"ro":"Fermierii caută diferențiere și prețuri mai mari într-o piață volatilă.","en":"Farmers want differentiation and higher prices in a volatile market."},"tryAtHome":{"ro":"Prepară-le cu apă mai rece (88–92 °C) și măcinare puțin mai grosieră, pentru că se extrag foarte ușor.","en":"Brew them with cooler water (88–92 °C) and a slightly coarser grind, since they extract very easily."},"recipeHint":"","hype":2,"longevity":"rising","relevanceRO":2,"sources":["https://www.beanscenemag.com.au/behind-jack-simpsons-wbc-triumph/","https://www.klatchcoffee.com/blogs/processes/what-is-thermo-shock-coffee-processing","https://royalcoffee.com/co-fermented-coffee-processing-trends-and-controversy/"]},{"id":"beyond-geisha","title":{"ro":"Dincolo de Geisha: soiuri rare","en":"Beyond Geisha: rare varieties"},"category":"bean","summary":{"ro":"Geisha încă domină competițiile, dar pierde teren: la Global Coffee Awards 2025 doar 6 din primele 25 de cafele au fost Geisha, iar un Parainema din Honduras a luat cel mai mare scor. Sidra, Bourbon rosado, Ombligón, Wush Wush și Eugenioides apar tot mai des, iar campionii amestecă Geisha cu alte soiuri.","en":"Geisha still dominates competitions but is losing ground: at the 2025 Global Coffee Awards only 6 of the top 25 coffees were Geisha, and a Honduran Parainema scored highest. Sidra, Bourbon rosado, Ombligón, Wush Wush and Eugenioides appear more and more, and champions blend Geisha with other varieties."},"whyNow":{"ro":"Cererea de unicitate și prețurile record la Geisha împing spre alternative.","en":"Demand for uniqueness and record Geisha prices are pushing alternatives."},"tryAtHome":{"ro":"Caută la prăjitoriile românești o cafea Sidra sau Eugenioides și compar-o cu un Caturra clasic. Eugenioides e natural dulce, cu puțină cofeină.","en":"Look for a Sidra or Eugenioides at a Romanian roaster and compare it with a classic Caturra. Eugenioides is naturally sweet and low in caffeine."},"recipeHint":"","hype":2,"longevity":"rising","relevanceRO":1,"sources":["https://perfectdailygrind.com/es/2026/10/05/geisha-perdiendo-terreno-competencias-cafe/","https://www.baristamagazine.com/eugenioides-coffee-soars-to-competition-success/"]},{"id":"liberica-excelsa","title":{"ro":"Liberica și Excelsa","en":"Liberica & Excelsa"},"category":"bean","summary":{"ro":"Specii tolerante la căldură și secetă, până acum folosite în instant, sunt repoziționate ca premium prin fermentări anaerobe și procesări honey în Malaezia, Indonezia, Filipine și India. Global Coffee Awards are acum categorie de Liberica, iar la WBC 2025 un finalist a combinat Geisha cu Liberica din Malaezia.","en":"Heat- and drought-tolerant species once used for instant are being repositioned as premium through anaerobic and honey processing in Malaysia, Indonesia, the Philippines and India. The Global Coffee Awards now have a Liberica category, and a 2025 WBC competitor blended Geisha with Malaysian Liberica."},"whyNow":{"ro":"Schimbările climatice cer specii alternative la arabica.","en":"Climate change demands alternatives to arabica."},"tryAtHome":{"ro":"","en":""},"recipeHint":"","hype":1,"longevity":"rising","relevanceRO":1,"sources":["https://perfectdailygrind.com/2026/08/coffee-processing-liberica/","https://perfectdailygrind.com/es/2026/10/05/geisha-perdiendo-terreno-competencias-cafe/"]},{"id":"fine-robusta","title":{"ro":"Robusta de specialitate („fine robusta”)","en":"Specialty robusta (\"fine robusta\")"},"category":"bean","summary":{"ro":"Robusta a urcat de la 28% din producția mondială la începutul anilor '90 la 44% în 2023, iar Brazilia ar putea depăși Vietnamul ca prim producător. Fermierii investesc în recoltare selectivă și fermentare, iar prăjitorii de specialitate lansează robusta „fine” pentru espresso cu corp și crema bogată.","en":"Robusta rose from 28% of world production in the early 1990s to 44% in 2023, and Brazil may overtake Vietnam as the top producer. Farmers are investing in selective picking and fermentation, and specialty roasters are launching \"fine\" robusta for full-bodied espresso with rich crema."},"whyNow":{"ro":"Prețurile record la arabica și climatul fac robusta de calitate o alegere logică.","en":"Record arabica prices and the climate make quality robusta a logical choice."},"tryAtHome":{"ro":"Fă un espresso 80% arabica + 20% fine robusta. Robusta e mai concentrată, deci încearcă un raport de 1:2,5 și o temperatură de 90 °C.","en":"Pull an espresso of 80% arabica + 20% fine robusta. Robusta is more intense, so try a 1:2.5 ratio at 90 °C."},"recipeHint":"","hype":2,"longevity":"rising","relevanceRO":3,"sources":["https://worldcoffeeresearch.org/resources/a-robust-future-why-brazils-bitter-coffee-is-thriving-as-the-climate-crisis-hits-global-crops","https://perfectdailygrind.com/2025/05/robusta-revival-in-specialty-coffee/","https://qahwaworld.com/news/brazil-robusta-coffee-production-growth-2025"]},{"id":"decaf-renaissance","title":{"ro":"Renașterea decafului","en":"The decaf renaissance"},"category":"bean","summary":{"ro":"Decaful a câștigat titluri la US Brewers Cup și are categorii proprii în concursurile de prăjire. În SUA, ponderea decafului a urcat de la 9% la 12% din consum în 2025, iar 46% dintre consumatori spun că vor să reducă cofeina. Procesele EA (din trestie de zahăr), Swiss Water și CO₂ dau acum decafuri cu adevărat bune.","en":"Decaf has won US Brewers Cup titles and has its own roasting-competition categories. In the US its share rose from 9% to 12% of consumption in 2025, and 46% of consumers say they want to cut caffeine. EA (sugarcane), Swiss Water and CO₂ processes now yield genuinely good decafs."},"whyNow":{"ro":"Somnul, anxietatea și cafeaua de seară îi fac pe mulți să caute decaf bun, nu doar „acceptabil”.","en":"Sleep, anxiety and evening coffee have many people looking for good decaf, not merely acceptable decaf."},"tryAtHome":{"ro":"Prepară decaful cu o măcinare puțin mai grosieră și apă la 90 °C, pentru că se extrage mai repede, și cumpără pungi mici, fiindcă se învechește mai repede.","en":"Brew decaf a bit coarser with 90 °C water, since it extracts faster, and buy small bags because it stales faster."},"recipeHint":"decaf-v60-gentle","hype":2,"longevity":"rising","relevanceRO":2,"sources":["https://perfectdailygrind.com/2026/05/does-decaf-deserve-better/","https://www.coffeereview.com/finally-some-real-coffee-action-decaf-coffees-2026/","https://freshcup.com/decaf-coffee-but-make-it-specialty/"],"recipeId":"decaf-v60-gentle"},{"id":"flat-burr-home","title":{"ro":"Râșnițe flat-burr single-dose acasă","en":"Flat-burr single-dose grinders at home"},"category":"gear","summary":{"ro":"Râșnițe cu discuri plate și retenție aproape zero, precum
