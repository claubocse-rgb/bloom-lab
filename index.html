 DF64/DF54, Fellow Ode Gen 2 sau Timemore Sculptor, au adus claritatea de cafenea în bucătărie la prețuri de câteva sute de euro. Sunt construite pentru single dosing, cu suflătoare și RDT.","en":"Flat-burr, near-zero-retention grinders such as the DF64/DF54, Fellow Ode Gen 2 or Timemore Sculptor brought café-level clarity to the kitchen for a few hundred euros. They're built for single dosing, with bellows and RDT."},"whyNow":{"ro":"Râșnița e recunoscută ca cel mai important upgrade, mai important decât aparatul.","en":"The grinder is now accepted as the most important upgrade, more than the machine."},"tryAtHome":{"ro":"Dacă ai buget limitat, o râșniță manuală bună (de exemplu Timemore C3, 1Zpresso) dă mai mult gust decât un espressor scump cu râșniță proastă.","en":"On a tight budget, a good hand grinder (e.g. Timemore C3, 1Zpresso) gives more flavour than an expensive espresso machine with a poor grinder."},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":2,"sources":["https://www.qikacoffee.com/news/df64-or-df54-how-to-choose-your-first-single-dose-coffee-grinder-1/","https://coffeechronicler.com/fellow-ode-grinder-review/"]},{"id":"automated-pourover","title":{"ro":"Pour-over automat: xBloom și rețete scanabile","en":"Automated pour-over: xBloom & scannable recipes"},"category":"gear","summary":{"ro":"Aparatele precum xBloom Studio combină râșnița, cântarul și turnarea automată, iar în modul Autopilot scanezi un card de rețetă de la prăjitor ca să obții profilul gândit de el. Categoria leagă cafeaua de specialitate de comoditatea capsulelor.","en":"Machines like the xBloom Studio combine grinder, scale and automated pouring, and in Autopilot mode you scan a roaster's recipe card to get their intended profile. The category bridges specialty coffee and capsule-style convenience."},"whyNow":{"ro":"Oamenii vor pour-over de calitate fără tehnică și fără timp.","en":"People want quality pour-over without technique or time."},"tryAtHome":{"ro":"","en":""},"recipeHint":"","hype":1,"longevity":"rising","relevanceRO":1,"sources":["https://www.beanscenemag.com.au/everything-you-need-to-know-about-the-xbloom-studio/","https://nysun.com/article/review-xbloom-studio-coffee-machine"]},{"id":"smart-scales","title":{"ro":"Cântare inteligente și preparare conectată","en":"Smart scales & connected brewing"},"category":"gear","summary":{"ro":"Cântarele Bluetooth (Acaia, Timemore, Varia) înregistrează curba de flux și se leagă de aplicații de rețete, iar comunitățile își împart profilurile. Datele de preparare devin parte din hobby, ca jurnalele de antrenament.","en":"Bluetooth scales (Acaia, Timemore, Varia) log flow curves and link to recipe apps, and communities share profiles. Brew data is becoming part of the hobby, like training logs."},"whyNow":{"ro":"Prețul cântarelor cu timer a scăzut sub 30 €, iar aplicațiile de rețete s-au înmulțit.","en":"Timer scales now cost under €30, and recipe apps have multiplied."},"tryAtHome":{"ro":"Chiar și cu un cântar de bucătărie de 0,1 g, notează doza, apa, timpul și gustul la fiecare preparare, ca să poți repeta ce a ieșit bine.","en":"Even with a 0.1 g kitchen scale, log dose, water, time and taste for every brew so you can repeat what worked."},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":3,"sources":["https://help.acaia.co/hc/en-us/articles/360034325551-Acaia-Coffee-App-Guide","https://baristalife.co/blogs/blog/best-bluetooth-scale-2025"]},{"id":"portable-espresso","title":{"ro":"Espresso portabil și cafea de drum","en":"Portable espresso & travel coffee"},"category":"gear","summary":{"ro":"Aparatele de espresso portabile care își încălzesc singure apa (Outin Nano) și presele manuale (Picopresso), alături de AeroPress Go și driperele pliabile, fac din cafeaua bună un accesoriu de călătorie și camping.","en":"Self-heating portable espresso makers (Outin Nano) and manual presses (Picopresso), plus the AeroPress Go and foldable drippers, make good coffee a travel and camping accessory."},"whyNow":{"ro":"Munca hibridă, drumețiile și călătoriile cu avionul cer cafea bună oriunde.","en":"Hybrid work, hiking and flying call for good coffee anywhere."},"tryAtHome":{"ro":"Ia la drum o AeroPress, o râșniță manuală și doze cântărite în pungi mici. E cea mai robustă combinație pentru munte.","en":"Travel with an AeroPress, a hand grinder and pre-weighed doses in small bags. It's the most robust combo for the mountains."},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":2,"sources":["https://www.tastingtable.com/2237336/biggest-coffee-trends-2026/","https://coffeechronicler.com/gear/espresso-machines/best-portable/","https://www.coffeereview.com/equipment-review-outin-nano-portable-espresso-maker/"]},{"id":"flow-profiling-home","title":{"ro":"Profilare de presiune și flux acasă","en":"Pressure & flow profiling at home"},"category":"gear","summary":{"ro":"Aparate precum Meticulous și Decent, sau modificări open-source ca Gaggiuino pentru Gaggia Classic, permit acasă profiluri de presiune și flux care altădată erau doar în competiții. Tehnicile de tip blooming espresso sau turbo devin astfel reproductibile.","en":"Machines like the Meticulous and Decent, or open-source mods like Gaggiuino for the Gaggia Classic, bring competition-grade pressure and flow profiles home. Techniques like blooming or turbo espresso become reproducible."},"whyNow":{"ro":"Entuziaștii de espresso au trecut de la „ce aparat” la „ce profil”.","en":"Espresso enthusiasts have moved from \"which machine\" to \"which profile\"."},"tryAtHome":{"ro":"","en":""},"recipeHint":"","hype":1,"longevity":"rising","relevanceRO":1,"sources":["https://clivecoffee.com/blogs/learn/best-espresso-machine-for-pressure-profiling-buyers-guide-clive","https://www.papelespresso.com/comparing-gaggiuino-pressure-profiling-to-traditional-dimmer-mods"]},{"id":"bean-to-cup-ro","title":{"ro":"Espressoarele automate domină în România","en":"Bean-to-cup machines dominate in Romania"},"category":"gear","summary":{"ro":"Topurile de Black Friday 2025 de la eMAG sunt dominate de espressoare automate De'Longhi, Philips (LatteGo), Krups și Siemens. Modele precum Philips 3300 LatteGo sunt considerate bune cumpărături la circa 1.000–1.200 lei. Pentru mulți români, primul pas spre cafea mai bună e un automat plus boabe mai bune.","en":"eMAG's Black Friday 2025 tops are dominated by De'Longhi, Philips (LatteGo), Krups and Siemens bean-to-cup machines, with models like the Philips 3300 LatteGo seen as good buys around 1,000–1,200 lei. For many Romanians, the first step to better coffee is an automatic machine plus better beans."},"whyNow":{"ro":"Black Friday-ul eMAG a bătut recorduri în 2025, iar cafeaua acasă e mai ieftină decât la cafenea.","en":"eMAG's Black Friday broke records in 2025, and home coffee is cheaper than café coffee."},"tryAtHome":{"ro":"Pe un automat, setează râșnița mai fin, cu o treaptă pe rând și numai în timp ce macină, folosește boabe de specialitate prăjite mediu și curăță grupul săptămânal.","en":"On a bean-to-cup machine, set the grinder finer one step at a time (only while grinding), use medium-roast specialty beans, and clean the brew group weekly."},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":3,"sources":["https://gadget.ro/top-10-cele-mai-bune-espressoare-automate-pe-care-sa-le-urmaresti-de-black-friday-2025-la-emag/","https://www.g4media.ro/black-friday-2025-la-emag-peste-314-milioane-de-produse-vandute-in-primele-12-ore-cu-o-valoare-record-de-896-milioane-lei.html"]},{"id":"home-cafe","title":{"ro":"Cafeneaua de acasă („home café”)","en":"The home café"},"category":"culture","summary":{"ro":"Gen Z își transformă bucătăria în cafenea: colțuri de cafea estetice, băuturi de cafenea refăcute după TikTok și meniuri pentru prieteni. Un latte acasă costă sub o liră față de 4–5 lire la cafenea în Marea Britanie, iar Morgan Eckroth a lansat pe 27 octombrie 2026 un manual dedicat.","en":"Gen Z is turning kitchens into cafés: aesthetic coffee corners, café drinks recreated from TikTok, and menus for friends. In the UK a home latte costs under £1 against £4–5 in a café, and Morgan Eckroth released a dedicated handbook on 27 October 2026."},"whyNow":{"ro":"Prețurile din cafenele și #CoffeeTok fac din barista de acasă un hobby social.","en":"Café prices and #CoffeeTok make home barista a social hobby."},"tryAtHome":{"ro":"Fă un mini-meniu de 3 băuturi pentru weekend (una caldă, una rece, una decaf) și cronometrează-te. E cel mai rapid mod de a-ți rafina rețetele.","en":"Make a 3-drink weekend menu (one hot, one iced, one decaf) and time yourself. It's the fastest way to refine your recipes."},"recipeHint":"","hype":3,"longevity":"established","relevanceRO":3,"sources":["https://www.livingetc.com/ideas/home-cafe-tiktok-trend","https://www.lawyer-monthly.com/2025/12/why-uk-cant-get-enough-at-home-coffee/","https://www.penguinrandomhouse.com/books/811028/coffee-for-here-by-morgan-eckroth/9798217035366"]},{"id":"subscriptions","title":{"ro":"Abonamente la cafea personalizate","en":"Personalised coffee subscriptions"},"category":"culture","summary":{"ro":"Serviciile care livrează periodic boabe proaspete potrivite gustului tău cresc, iar multe prăjitorii românești au abonamente lunare. Ele leagă direct ferma de bucătărie și reduc decizia de cumpărare.","en":"Services that regularly deliver fresh beans matched to your taste are growing, and many Romanian roasters offer monthly subscriptions. They connect farm to kitchen directly and remove the buying decision."},"whyNow":{"ro":"Prospețimea și descoperirea, adică o cafea nouă în fiecare lună, contează mai mult decât prețul pe kg.","en":"Freshness and discovery (a new coffee every month) matter more than price per kg."},"tryAtHome":{"ro":"Notează în aplicație fiecare cafea primită și ce rețetă a mers, ca să-i poți spune prăjitorului ce profiluri preferi.","en":"Log every coffee you receive and which recipe worked, so you can tell the roaster which profiles you prefer."},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":2,"sources":["https://www.tastingtable.com/2237336/biggest-coffee-trends-2026/","https://perfectdailygrind.com/2026/06/why-romania-specialty-coffee-is-growing/"]},{"id":"ai-coffee","title":{"ro":"AI în cafea: antrenori și rețete personalizate","en":"AI in coffee: coaches & personalised recipes"},"category":"culture","summary":{"ro":"Magazinele de aplicații s-au umplut în 2025–2026 de „antrenori AI” pentru cafea care sugerează ajustări de măcinare și rețete pe baza gustului, iar cafenelele folosesc AI pentru meniuri și stocuri. Calitatea variază mult, iar sfaturile generice sunt frecvente.","en":"App stores filled up in 2025–2026 with \"AI coffee coaches\" that suggest grind and recipe tweaks based on taste, and cafés use AI for menus and stock. Quality varies widely, and generic advice is common."},"whyNow":{"ro":"Modelele lingvistice au făcut ieftină crearea unui asistent conversațional.","en":"Language models made conversational assistants cheap to build."},"tryAtHome":{"ro":"Descrie gustul precis (acru, amar, apos, astringent) și schimbă un singur parametru odată. E logica pe care orice asistent bun ar trebui să o urmeze.","en":"Describe taste precisely (sour, bitter, watery, astringent) and change one variable at a time. It's the logic any good assistant should follow."},"recipeHint":"","hype":2,"longevity":"rising","relevanceRO":2,"sources":["https://apps.apple.com/us/app/id6748040853","https://perfectdailygrind.com/2026/01/coffee-shop-trends-in-2026/"]},{"id":"traceability","title":{"ro":"Trasabilitate, agricultură regenerativă și transparență","en":"Traceability, regenerative farming & transparency"},"category":"culture","summary":{"ro":"Consumatorii vor să știe ferma, procesarea și cât primește fermierul. Nespresso certifică cafele regenerative cu Rainforest Alliance, ofi și Melitta oferă cafea complet trasabilă, iar festivalurile românești au sesiuni „Voices of Origin” despre cine plătește reziliența.","en":"Consumers want to know the farm, the processing and how much the farmer earns. Nespresso is certifying regenerative coffees with the Rainforest Alliance, ofi and Melitta offer fully traceable coffee, and Romanian festivals host \"Voices of Origin\" sessions on who pays for resilience."},"whyNow":{"ro":"EUDR și criza prețurilor au pus lanțul de aprovizionare în centrul atenției.","en":"EUDR and the price crisis have put the supply chain in the spotlight."},"tryAtHome":{"ro":"Când cumperi, verifică pe pungă ferma sau stația de spălare, altitudinea, soiul și data prăjirii. Lipsa lor e un semnal.","en":"When buying, check the bag for farm or washing station, altitude, variety and roast date. Missing info is a signal."},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":2,"sources":["https://www.tastingtable.com/2237336/biggest-coffee-trends-2026/","https://ofi.com/news-and-events/press-release/ofi-and-Melitta-partner-to-offer-consumers-differentiated-and-fully-traceable-coffee.html","https://www.worldcoffeeportal.com/news/romanias-specialty-coffee-market-comes-of-age-as-slow-coffee-festival-marks-10-years/"]},{"id":"romania-specialty-boom","title":{"ro":"Boom-ul cafelei de specialitate în România","en":"Romania's specialty coffee boom"},"category":"culture","summary":{"ro":"România are aproape 300 de cafenele de specialitate și peste 80 de prăjitorii artizanale, iar Bucureștiul are o cafenea de specialitate la 52.000 de locuitori, mai mult decât Berlinul. Festivalurile cresc: COFFeEAST (30.000+ vizitatori în 2025), Bucharest Coffee Festival (aprilie 2026) și Slow Coffee Festival, la a 10-a ediție (septembrie 2026). Cristi Oltean (Meron) a reprezentat România la WBC 2026 din Panama.","en":"Romania has nearly 300 specialty cafés and 80+ artisanal roasters, and Bucharest has one specialty café per 52,000 people, denser than Berlin. Festivals are growing: COFFeEAST (30,000+ visitors in 2025), Bucharest Coffee Festival (April 2026) and the 10th Slow Coffee Festival (September 2026). Cristi Oltean (Meron) represented Romania at WBC 2026 in Panama."},"whyNow":{"ro":"Consumatorii români trec de la cafeaua prăjită închis cu lapte și zahăr la interes pentru origine și metode.","en":"Romanian consumers are moving from dark roast with milk and sugar to interest in origin and methods."},"tryAtHome":{"ro":"Vizitează o prăjitorie locală (Cluj, București, Brașov, Timișoara, Oradea) și cere o recomandare pentru metoda ta. Majoritatea îți dau și rețeta.","en":"Visit a local roaster (Cluj, Bucharest, Brașov, Timișoara, Oradea) and ask for a recommendation for your method. Most will give you a recipe too."},"recipeHint":"","hype":2,"longevity":"rising","relevanceRO":3,"sources":["https://perfectdailygrind.com/2026/06/why-romania-specialty-coffee-is-growing/","https://pressone.ro/romanii-si-cafeaua-de-la-un-obicei-functional-la-experienta-culturala-fondatorul-coffeeast-unde-nu-avem-traditie-am-compensat-prin-deschidere","https://zilesinopti.ro/2026/04/23/bucharest-coffee-festival-aprilie-2026/","https://sprudge.com/the-2026-world-barista-championship-starts-today-heres-everyone-competing-1497734.html"]},{"id":"competition-2026","title":{"ro":"Campionii 2026: ce aduc spre acasă","en":"2026 champions: what trickles down to home"},"category":"culture","summary":{"ro":"Nas Jaafar (Malaezia) a câștigat World Brewers Cup 2026 la Bruxelles, iar Pan Wei (China) World Barista Championship 2026 în Panama, pe 25 octombrie. Asia domină competițiile, iar tehnicile lor (dripere hibride, temperaturi duble, blenduri de soiuri) ajung rapid în rețetele de acasă.","en":"Nas Jaafar (Malaysia) won the 2026 World Brewers Cup in Brussels, and Pan Wei (China) won the 2026 World Barista Championship in Panama on 25 October. Asia dominates competitions, and its techniques (hybrid brewers, split temperatures, variety blends) quickly reach home recipes."},"whyNow":{"ro":"Rețetele campionilor sunt cel mai bun conținut viral pentru pasionați.","en":"Champion recipes are the best viral content for enthusiasts."},"tryAtHome":{"ro":"Încearcă rețeta campionului WBrC 2025 (George Peng): 15 g, 210 g, ultima turnare la 80 °C.","en":"Try the 2025 WBrC champion's recipe (George Peng): 15 g, 210 g, last pour at 80 °C."},"recipeHint":"peng-two-temp","hype":1,"longevity":"established","relevanceRO":2,"sources":["https://www.malaymail.com/news/eat-drink/2026/06/28/lord-of-the-beans-nas-jaafar-is-malaysias-first-ever-world-brewers-cup-champion/225537","https://www.prensa.com/economia/mundial-de-barismo-seis-paises-disputan-la-final-esta-es-la-agenda-del-world-of-coffee/","https://sprudge.com/three-new-world-coffee-champions-were-just-crowned-1101834.html"],"recipeId":"peng-two-temp"},{"id":"arabica-price-crisis","title":{"ro":"Criza prețului la arabica","en":"The arabica price crisis"},"category":"market","summary":{"ro":"Arabica a atins un maxim istoric de ~4,41 $/livră în februarie 2025, din cauza secetei și a înghețului din Brazilia și Vietnam. Pe 27 octombrie 2026 era la ~2,94 $/livră, cu 24% sub nivelul de acum un an, dar tot mult peste media istorică. Stocurile certificate sunt aproape de minimul ultimilor 27 de ani, iar El Niño aduce riscuri în 2027.","en":"Arabica hit an all-time high of ~$4.41/lb in February 2025 after drought and frost in Brazil and Vietnam. On 27 October 2026 it stood at ~$2.94/lb, 24% below a year earlier but still far above historical averages. Certified stocks are near 27-year lows, and El Niño brings risk into 2027."},"whyNow":{"ro":"Prețurile la raft se ajustează cu întârziere, deci cafeaua rămâne scumpă în 2026.","en":"Shelf prices lag futures, so coffee stays expensive through 2026."},"tryAtHome":{"ro":"Calculează în aplicație costul pe ceașcă (preț pungă ÷ grame × doză). O cafea de specialitate acasă costă de obicei 2–4 lei pe ceașcă.","en":"Calculate cost per cup in the app (bag price ÷ grams × dose). Home specialty coffee usually costs 2–4 lei per cup."},"recipeHint":"","hype":3,"longevity":"established","relevanceRO":3,"sources":["https://tradingeconomics.com/commodity/coffee","https://cropgpt.ai/coffee-futures-retreat-forecasts-see-sharp-2026-declines","https://fortune.com/europe/2025/01/21/expect-volatility-climate-change-speculation-trump-coffee-prices-2025"]},{"id":"romania-prices-vat","title":{"ro":"Prețuri și TVA la cafea în România","en":"Coffee prices & VAT in Romania"},"category":"market","summary":{"ro":"Cafeaua s-a scumpit cu ~20% în România, o cafea la cafenea costă în medie ~9 lei, iar prețurile sunt cu până la 30% peste Italia, la venituri mai mici. Din 1 august 2025 TVA standard a urcat la 21%, iar ANAF a confirmat că băuturile pe bază de cafea intră la cota standard. Totuși, 9 din 10 români beau cafea acasă, iar consumul (3,3 kg/an pe cap de locuitor, față de 5 kg media UE) continuă să crească.","en":"Coffee prices rose ~20% in Romania, an average café coffee costs ~9 lei, and prices run up to 30% above Italy despite lower incomes. From 1 August 2025 standard VAT rose to 21%, and ANAF confirmed coffee drinks fall under the standard rate. Still, 9 in 10 Romanians drink coffee at home, and consumption (3.3 kg per capita per year vs a 5 kg EU average) keeps growing."},"whyNow":{"ro":"Inflația record (8,6% în decembrie 2025, cea mai mare din UE) împinge consumul spre acasă.","en":"Record inflation (8.6% in December 2025, highest in the EU) is pushing consumption home."},"tryAtHome":{"ro":"Compară costul băuturii tale preferate de la cafenea cu varianta de acasă. Aplicația poate arăta economia lunară.","en":"Compare the cost of your favourite café drink with the home version. The app can show monthly savings."},"recipeHint":"","hype":3,"longevity":"established","relevanceRO":3,"sources":["https://www.euronews.ro/articole/cafeaua-se-scumpeste-dar-romanii-nu-renunta-la-consum-piata-continua-sa-creasca","https://startupcafe.ro/radu-savopol-5-to-go-vreau-ca-cei-care-astazi-vand-cafea-cu-11-sa-se-conformeze-si-sa-treaca-pe-tva-21-cred-ca-este-normal-sa-jucam-cu-aceeasi-minge-si-dupa-aceleasi-reguli-92501","https://www.antena3.ro/economic/criza-cafelei-se-anunta-noi-scumpiri-de-cel-putin-20-740164.html","https://perfectdailygrind.com/2026/06/why-romania-specialty-coffee-is-growing/"]},{"id":"eudr","title":{"ro":"EUDR: regulamentul UE privind defrișările","en":"EUDR: the EU deforestation regulation"},"category":"market","summary":{"ro":"Regulamentul care interzice cafeaua legată de defrișări a fost amânat a doua oară: se aplică de la 30 decembrie 2026 pentru operatorii mari și de la 30 iunie 2027 pentru cei mici. Declarația de diligență cade acum pe cine pune primul produsul pe piața UE. Cafeaua instant a fost exceptată, ceea ce poate favoriza robusta.","en":"The regulation banning deforestation-linked coffee was delayed a second time: it applies from 30 December 2026 for large operators and 30 June 2027 for small ones. The due-diligence obligation now falls on whoever first places the product on the EU market. Instant coffee was exempted, which may favour robusta."},"whyNow":{"ro":"Termenul de aplicare vine peste două luni, iar importatorii și prăjitorii se pregătesc.","en":"The application date is two months away, and importers and roasters are preparing."},"tryAtHome":{"ro":"","en":""},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":2,"sources":["https://www.gcrmag.com/eudr-delayed-until-the-end-of-2026","https://news.mongabay.com/short-article/2026/01/eudr-antideforestation-law-officially-delayed-for-second-year-in-a-row/","https://www.worldcoffeeportal.com/interview/how-eudr-got-lost-in-the-woods/"]},{"id":"climate-supply","title":{"ro":"Clima, recoltele și viitorul cafelei","en":"Climate, harvests & the future of coffee"},"category":"market","summary":{"ro":"Seceta, înghețul și valurile de căldură din Brazilia și Vietnam au declanșat criza prețurilor, iar zonele potrivite pentru arabica se micșorează. Industria răspunde cu robusta irigată, specii noi (Liberica, Excelsa, hibridul Libex) și agricultură regenerativă.","en":"Drought, frost and heatwaves in Brazil and Vietnam triggered the price crisis, and land suitable for arabica is shrinking. The industry is responding with irrigated robusta, new species (Liberica, Excelsa, the Libex hybrid) and regenerative farming."},"whyNow":{"ro":"Volatilitatea prețurilor face clima un subiect de bucătărie, nu doar de raport.","en":"Price volatility makes climate a kitchen topic, not just a report topic."},"tryAtHome":{"ro":"","en":""},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":2,"sources":["https://www.beveragedaily.com/Article/2026/03/24/future-of-coffee-growing-regions-and-consumer-accessibility/","https://worldcoffeeresearch.org/resources/a-robust-future-why-brazils-bitter-coffee-is-thriving-as-the-climate-crisis-hits-global-crops","https://perfectdailygrind.com/2026/08/coffee-processing-liberica/"]},{"id":"matcha-shortage","title":{"ro":"Penuria de matcha și alternativele","en":"Matcha shortage & alternatives"},"category":"market","summary":{"ro":"Cererea globală a dus la penurie: prețurile la matcha pentru cafenele au crescut cu 14%, cele bio cu 21%, iar unii furnizori au scumpit cu 150%. Cafenelele trec la hojicha, genmaicha și hibrizi cafea-ceai, iar căutările „hojicha vs matcha” au explodat în 2026.","en":"Global demand caused shortages: foodservice matcha prices rose 14%, organic 21%, and some suppliers raised prices by 150%. Cafés are switching to hojicha, genmaicha and coffee-tea hybrids, and \"hojicha vs matcha\" searches broke out in 2026."},"whyNow":{"ro":"Recoltele japoneze nu țin pasul cu cererea.","en":"Japanese harvests can't keep up with demand."},"tryAtHome":{"ro":"Înlocuiește matcha cu 3 g de pudră de hojicha în rețeta de dirty matcha. Are mai puțină cofeină și note prăjite care se potrivesc cu espresso.","en":"Swap matcha for 3 g of hojicha powder in the dirty matcha recipe. It has less caffeine and roasty notes that suit espresso."},"recipeHint":"dirty-matcha","hype":2,"longevity":"rising","relevanceRO":1,"sources":["https://freshcup.com/the-matcha-boom-is-reshaping-cafes-how-long-before-it-hits-a-wall/","https://www.beanscenemag.com.au/specialty-coffee-trends-to-look-for-in-2026/","https://www.businesstoday.in/technology/news/story/is-matcha-replacing-your-daily-coffee-google-search-trends-point-to-a-major-shift-554953-2026-09-12"],"recipeId":"dirty-matcha"},{"id":"rtd-coffee","title":{"ro":"Cafea la doză (RTD)","en":"Ready-to-drink (RTD) coffee"},"category":"market","summary":{"ro":"Cafeaua la doză și la sticlă, inclusiv cold brew, latte-uri și variante funcționale, e unul dintre segmentele cu cea mai rapidă creștere, cu o piață estimată la 64,6 miliarde $ până în 2035. Cafenelele încep programe proprii de latte la doză.","en":"Canned and bottled coffee, including cold brew, lattes and functional versions, is one of the fastest-growing segments, with a market projected at $64.6 billion by 2035. Cafés are starting their own canned latte programmes."},"whyNow":{"ro":"Comoditatea și consumul pe drum au crescut.","en":"Convenience and on-the-go consumption have grown."},"tryAtHome":{"ro":"Fă-ți propriul „RTD”: un litru de cold brew concentrat ține 10–14 zile la frigider și se diluează 1:1 cu apă sau lapte.","en":"Make your own \"RTD\": a litre of cold brew concentrate keeps 10–14 days in the fridge and dilutes 1:1 with water or milk."},"recipeHint":"","hype":2,"longevity":"established","relevanceRO":2,"sources":["https://www.tastingtable.com/2237336/biggest-coffee-trends-2026/","https://www.beanscenemag.com.au/specialty-coffee-trends-to-look-for-in-2026/","https://www.foodnavigator.com/Article/2026/01/28/top-coffee-trends-functional-coffee-rtd-specialty-coffee-cold-brew/"]}]};/*END:MANUAL*/

ing with hot water shortens time on the heat and avoids a stewed taste."},"safety":{"ro":"Mânerul și capacul se încing; nu lăsa percolatorul nesupravegheat și nu-l pune pe foc fără apă.","en":"The handle and lid get hot; never leave it unattended or heat it without water."},"steps":[{"t":0,"w":600,"ro":"Toarnă 600 g apă fierbinte în vas.","en":"Pour 600 g of hot water into the pot."},{"t":30,"w":null,"ro":"Pune cafeaua în coș, montează tubul și capacul.","en":"Add the coffee to the basket, fit the stem and lid."},{"t":60,"w":null,"ro":"Pune pe foc mediu până vezi primele bule în dom.","en":"Put on medium heat until the first bubbles show in the knob."},{"t":180,"w":null,"ro":"Redu focul: un clipocit rar, nu fierbere.","en":"Lower the heat: a slow perk, not a boil."},{"t":600,"w":null,"ro":"Ia de pe foc, scoate coșul și servește.","en":"Take it off, remove the basket and serve."}]},{"id":"cowboy-coffee","method":"immersion","gm":"french","name":{"ro":"Cowboy coffee","en":"Cowboy coffee"},"by":{"ro":"tradiție de tabără","en":"campfire tradition"},"dose":30,"water":530,"temp":95,"grind":"coarse","desc":{"ro":"Doar o oală, cafea și foc: zațul se lasă la fund cu un strop de apă rece.","en":"Just a pot, coffee and fire: a splash of cold water settles the grounds."},"safety":{"ro":"Oala și mânerul sunt fierbinți; toarnă încet, departe de copii.","en":"The pot and handle are hot; pour slowly, away from kids."},"steps":[{"t":0,"w":500,"ro":"Adu 500 g apă la fierbere, apoi ia oala de pe foc.","en":"Bring 500 g of water to a boil, then take the pot off the heat."},{"t":30,"w":null,"ro":"Presară cafeaua și amestecă bine.","en":"Sprinkle in the coffee and stir well."},{"t":150,"w":null,"ro":"Amestecă o dată crusta.","en":"Stir the crust once."},{"t":270,"w":530,"ro":"Toarnă 30 g apă rece ca să coboare zațul.","en":"Pour in 30 g of cold water to sink the grounds."},{"t":330,"w":null,"ro":"Toarnă încet în căni, lăsând zațul în oală.","en":"Pour slowly into mugs, leaving the ground ight roasts."},"steps":[{"t":0,"w":0,"ro":"Pornește pompa și cronometrul.","en":"Start the pump and the timer."},{"t":7,"w":3,"ro":"Apar primele picături.","en":"First drops appear."},{"t":25,"w":36,"ro":"La 36 g culoarea se deschide; continuă.","en":"At 36 g the colour lightens; keep going."},{"t":38,"w":60,"ro":"Oprește la 60 g.","en":"Stop at 60 g."}]},{"id":"allonge","method":"espresso","gm":"espresso","name":{"ro":"Allongé","en":"Allongé"},"by":{"ro":"după Scott Rao","en":"after Scott Rao"},"dose":18,"water":90,"temp":92,"grind":"fine","desc":{"ro":"Shot foarte lung (1:5), măcinat grosier, cu debit mare. Limpede, floral, între espresso și filtru. Doar pentru prăjiri foarte deschise.","en":"Very long shot (1:5), coarse grind, high flow. Clear, floral, between espresso and filter. Only for very light roasts."},"note":{"ro":"Macină mult mai grosier, până când presiunea maximă coboară la 8–9 bari și curge ~4 g/s. Fără preinfuzie lungă și fără bloom.","en":"Grind much coarser until peak pressure drops to 8–9 bar and it flows ~4 g/s. No long pre-infusion, no bloom."},"steps":[{"t":0,"w":0,"ro":"Pornește pompa.","en":"Start the pump."},{"t":5,"w":5,"ro":"Curge repede, aproape imediat.","en":"It flows fast, almost immediately."},{"t":18,"w":54,"ro":"Debit constant, ~4 g/s. Nu te speria de culoarea deschisă.","en":"Steady flow, ~4 g/s. Don't worry about the pale colour."},{"t":28,"w":90,"ro":"Oprește la 90 g (25–35 s).","en":"Stop at 90 g (25–35 s)."}]},{"id":"soup-shot","method":"espresso","gm":"espresso","name":{"ro":"Soup shot","en":"Soup shot"},"by":{"ro":"popularizat de Lance Hedrick","en":"popularised by Lance Hedrick"},"dose":20,"water":60,"temp":94,"grind":"fine","desc":{"ro":"Espresso la presiune foarte mică (sub 2 bari), raport 1:3, măcinat grosier. Foarte limpede și aromat; aproape fără cremă.","en":"Very low-pressure espresso (under 2 bar), 1:3 ratio, coarse grind. Very clear and aromatic; almost no crema."},"note":{"ro":"Ai nevoie de control al debitului sa e"},"dose":18,"water":40,"temp":93,"grind":"fine","desc":{"ro":"Shot manual 1:2,2 cu preinfuzie la 3 bari și presiune de 6–9 bari. Un punct de plecare bun pentru orice cafea.","en":"Manual 1:2.2 shot with 3 bar pre-infusion and 6–9 bar peak. A good starting point for any coffee."},"note":{"ro":"Setează încălzitorul pe MEDIUM (90 °C) pentru prăjiri medii sau HIGH (95 °C) pentru deschise și lasă 5 minute cu portafiltrul montat.","en":"Set the heater to MEDIUM (90 °C) for medium roasts or HIGH (95 °C) for light ones and wait 5 minutes with the portafilter locked in."},"steps":[{"t":0,"w":null,"ro":"Toarnă apa fierbinte în cilindru, pune pistonul și coboară pârghia ușor.","en":"Pour hot water into the cylinder, insert the piston and lower the lever gently."},{"t":3,"w":0,"ro":"Ține ~3 bari pentru preinfuzie.","en":"Hold ~3 bar for pre-infusion."},{"t":10,"w":2,"ro":"Apar picăturile. Urcă la 6–9 bari.","en":"Drops appear. Rise to 6–9 bar."},{"t":22,"w":25,"ro":"Lasă presiunea să scadă ușor spre 5–6 bari.","en":"Let pressure ease toward 5–6 bar."},{"t":30,"w":40,"ro":"Oprește la 40 g ridicând pârghia.","en":"Stop at 40 g by lifting the lever."}]},{"id":"cafelat-robot","method":"espresso","gm":"espresso","name":{"ro":"Cafelat Robot: presiune declinantă","en":"Cafelat Robot declining pressure"},"by":{"ro":"după Kaldi's Coffee","en":"after Kaldi's Coffee"},"dose":17,"water":38,"temp":null,"tempLabel":{"ro":"apă care tocmai a fiert","en":"just off the boil"},"grind":"fine","desc":{"ro":"Preinfuzie lungă la ~2 bari, vârf de 8–9 bari, apoi coborâre la 3 bari. Dulce și catifelat.","en":"Long ~2 bar pre-infusion, 8–9 bar peak, then down to 3 bar. Sweet and velvety."},"note":{"ro":"Macină puțin mai fin decât pentru un aparat cu pompă. Preîncălzește coșul cu apă fierbinte.","en":"Grind slightly finer than for a pump machine. Preheat the basket with hot water."},"steps":[{"t":0,"w":null,"ro":"Toarnă ~90 g de apă fierbinte în coș, pune pistonul și apasă ușor, ~2 bari.","en":"Pour ~90 function parseBeanText(txt){ // local, no AI: keyword rules
 const s=' '+txt.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')+' ';
 const has=(...k)=>k.some(w=>s.includes(w));
 const first=txt.trim().split(/[,;\n]/)[0].trim();
 const p={source:'text',name:(first.length>42?first.slice(0,40)+'…':first)};
 for(const [k,o] of Object.entries(ORIGINS)) if(o.kw.some(w=>s.includes(' '+w.normalize('NFD').replace(/[̀-ͯ]/g,'')))){p.origin=k;break}
 if(has('decaf','decofeinizat','fara cofeina','decaffeinated')) p.decaf=true;
 if(has('anaerob','carbonic','ferment','co-ferment','thermal shock')) p.process='anaerobic';
 else if(has('honey','miere','pulped natural')) p.process='honey';
 else if(has('natural','uscat la soare','dry process','sun dried','sun-dried')) p.process='natural';
 else if(has('washed','spalat','lavat','wet process','fully washed')) p.process='washed';
 if(has('light','deschis','blond','nordic','filter roast','omni','pentru filtru','cinnamon')) p.roast='light';
 else if(has('dark','inchis','intens','italian','french roast','espresso roast','pentru espresso','full city+','vienna')) p.roast='dark';
 else if(has('medium','mediu','medie','city roast','full city')) p.roast='medium';
 if(has('robusta')) {p.robusta=true; if(!p.roast) p.roast='dark'}
 if(has('blend','amestec','house')) p.blend=true;
 let m=s.match(/(\d{3,4})\s*(?:-\s*\d{3,4}\s*)?(?:m\b|masl|m\.a\.s\.l|metri)/); if(m) p.altitude=+m[1];
 m=s.match(/(\d{1,3})\s*(?:zile|zi|days|day)\b/); if(m) p.days=+m[1];
 m=s.match(/(\d{1,3})\s*(?:saptamani|săptămâni|weeks|week)\b/); if(m&&p.days==null) p.days=+m[1]*7;
 m=s.match(/\b(\d{1,2})[./-](\d{1,2})[./-](20\d{2})\b/); if(m&&p.days==null){const d=new Date(+m[3],+m[2]-1,+m[1]);const n=Math.round((Date.now()-d)/864e5);if(n>=0&&n<400)p.days=n}
 m=s.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/); if(m&&p.days==null){const n=Math.round((Date.now()-new Date(+m[1],+m[2]-1,+m[3]))/864e5);if(n>=0&&n<400)p.days=n}
 const assumed=[]; if(!p.roast) assumed.push('roast'); if(!p.process&&!p.blend) assumed.push('process'); if(p.days==null) assumed.push('days');
 p.assumed=assumed; p.confidence=p.origin&&p.roast?'medium':'low';
 return p;
}

/* freshness window by method and roast (days since roast) */
function freshness(mk,roast,d){
 if(d==null) return null;
 const esp=mk==='espresso', light=roast==='light', dark=roast==='dark';
 const [lo,hi]=esp?(light?[8,45]:dark?[4,30]:[6,35]):(light?[5,45]:[3,35]);
 return {state:d<lo?'fresh':d>hi?'stale':'ok',lo,hi};
}
function buildRecipe(p,mk,hist){
 const meta=RM.find(x=>x.k===mk)||RM[0], base=findRecipe(meta.base), r=JSON.parse(JSON.stringify(base));
 const why=[], tips=[], W=(ro,en)=>({ro,en});
 const roast=p.roast||'medium', proc=p.process||'', o=ORIGINS[p.origin]||null;
 const filter=mk==='v60'||mk==='chemex', imm=mk==='aeropress'||mk==='french', esp=mk==='espresso', hot=filter||imm||esp;
 let temp=base.temp, ratio=base.water/base.dose, g=0, bloom=0;
 if(filter){temp={light:98,medium:93,dark:89}[roast];ratio={light:16.5,medium:16,dark:15.5}[roast]}
 if(mk==='french'){temp={light:99,medium:95,dark:90}[roast];ratio={light:16.5,medium:16,dark:15.5}[roast]}
 if(mk==='aeropress'){temp={light:99,medium:93,dark:88}[roast];ratio={light:18,medium:17,dark:16}[roast]}
 if(esp){temp={light:95,medium:92,dark:90}[roast];ratio={light:2.3,medium:2,dark:1.7}[roast]}
 if(roast==='light'){g-=1; if(hot) why.push(esp?W("Prăjire deschisă: raport mai lung (1:2,3), 95 °C și măcinare fină. Țintă: 28–32 s.","Light roast: longer ratio (1:2.3), 95 °C and a fine grind. Aim for 28–32 s."):W("Prăjire deschisă: apă foarte fierbinte și măcinare cu o treaptă mai fină, ca să scoți dulceața.","Light roast: very hot water and a grind one step finer, to pull out the sweetness."))}
 if(roast==='dark'){g+=1; if(hot) why.push(esp?W("Prăjire închisă: raport scurt (1:1,7) și 90 °C, ca să rămână dulce, nu amar.","Dark roast: short ratio (1:1.7) and 90 °C, to keep it sweet, not bitter."):W("Prăjire închisă: apă mai rece, măcinare mai grosieră și raport mai strâns, ca să eviți amăreala.","Dark roast: cooler water, coarser grind and a tighter ratio, to avoid bitterness."))}
 if(roast==='medium'&&hot) why.push(esp?W("Prăjire medie: espresso clasic 1:2 la 92 °C, țintă 25–30 s.","Medium roast: classic 1:2 espresso at 92 °C, aim for 25–30 s."):W("Prăjire medie: pornim de la valorile clasice, 1:16.","Medium roast: we start from the classic values, 1:16."));
 if(hot){
  if(proc==='honey'){temp-=1;why.push(W("Procesare honey: dulce și siropoasă; cu 1 °C mai rece.","Honey process: sweet and syrupy; 1 °C cooler."))}
  if(proc==='natural'){temp-=1.5;g+=.5;why.push(W("Procesare naturală: extrage ușor și face mai mult praf fin, deci mai rece și turnare blândă.","Natural process: extracts easily and makes more fines, so cooler and a gentle pour."))}
  if(proc==='anaerobic'){temp-=3;g+=1;if(!esp)ratio+=.5;why.push(W("Fermentare anaerobă: arome intense care devin repede aspre; −3 °C, mai grosier, raport puțin mai larg.","Anaerobic: intense flavors that turn harsh fast; −3 °C, coarser, slightly wider ratio."))}
  if(proc==='washed'&&roast!=='dark') why.push(W("Spălată: suportă bine apă fierbinte și o extracție completă.","Washed: handles hot water and a full extraction well."));
  if(((o&&o.dense)||(p.altitude&&p.altitude>=1800))&&!(p.altitude&&p.altitude<1200)){temp+=1;g-=.5;why.push(W("Boabe crescute la altitudine, dense: +1 °C și puțin mai fin.","High-grown, dense beans: +1 °C and slightly finer."))}
  else if((o&&o.low)||(p.altitude&&p.altitude<=1200)||p.robusta){temp-=1;g+=.5;why.push(W("Boabe de altitudine mică sau robusta: −1 °C ca să nu iasă amar.","Lower-grown beans or robusta: −1 °C so it doesn't turn bitter."))}
  if(p.decaf){temp-=3;g+=1;why.push(W("Decofeinizată: extrage mai repede, deci mai rece și mai grosier.","Decaf: extracts faster, so cooler and coarser."))}
 } else {
  if(proc==='natural'||proc==='anaerobic') g+=.5;
  if(mk==='moka'){ if(roast==='light') tips.push(W("La moka, prăjirile deschise pot ieși acre: pornește cu apă chiar de la fierbere.","Light roasts can turn sour in a moka: start with water right off the boil."));
   if(roast==='dark') tips.push(W("Prăjire închisă: foc cât mai mic și ia de pe foc devreme, altfel iese amar.","Dark roast: lowest heat and pull it early, or it turns bitter.")); }
  if(mk==='ibrik'&&roast==='light') tips.push(W("La ibric merg mai bine prăjirile medii-închise. Cu prăjire deschisă, lasă spuma să urce încet.","Ibrik suits medium-dark roasts. With a light roast, let the foam rise slowly."));
  if(mk==='cold'){ if(roast==='light') why.push(W("Prăjire deschisă la rece: extracția e lentă, lasă 16–18 ore.","Light roast cold: extraction is slow, steep 16–18 hours."));
   else if(roast==='dark') why.push(W("Prăjire închisă: 12 ore ajung; mai mult scoate gust de lemn.","Dark roast: 12 hours is enough; longer gets woody.")); }
 }
 const f=freshness(mk,roast,p.days);
 if(f&&f.state==='fresh'){ if(filter) bloom=15;
  tips.push(esp?W(`Prăjită acum ${p.days} zile: prea proaspătă pentru espresso, face canale. Ideal aștepți până la ziua ${f.lo}.`,`Roasted ${p.days} days ago: too fresh for espresso, it channels. Ideally wait until day ${f.lo}.`)
   :W(`Prăjită acum ${p.days} zile: e foarte proaspătă și are mult CO₂. Bloom de 60 s, cu apă cât de 3 ori doza. Dă cel mai bine după ziua ${f.lo}.`,`Roasted ${p.days} days ago: very fresh, lots of CO₂. Bloom 60 s with 3× the dose in water. Best from day ${f.lo}.`)) }
 if(f&&f.state==='stale'){g-=1;if(hot)temp+=1;ratio-=esp?.1:.5;
  tips.push(W(`Prăjită acum ${p.days} zile: aromele s-au estompat. Am mers mai fin, mai fierbinte și mai concentrat. Data viitoare, pungi mai mici.`,`Roasted ${p.days} days ago: aromas have faded. Finer, hotter and stronger. Next time, smaller bags.`)) }
 if(f&&f.state==='ok') tips.push(W(`${p.days} zile de la prăjire: e în fereastra bună (${f.lo}–${f.hi} zile).`,`${p.days} days since roast: in the sweet spot (${f.lo}–${f.hi} days).`));
 if(!f) tips.push(W("Caută data prăjirii pe pungă: pentru filtru e ideal între 1 și 5 săptămâni.","Look for the roast date on the bag: for filter, 1 to 5 weeks is ideal."));
 if(hist&&hist.n>=2){
  if(hist.sour>=2){g-=1;why.push(W(`Ultimele tale ${hist.n} cafele din punga asta au ieșit acre: încă o treaptă mai fin.`,`Your last ${hist.n} cups of this bag were sour: one more step finer.`))}
  else if(hist.bitter>=2){g+=1;why.push(W(`Ultimele tale ${hist.n} cafele din punga asta au ieșit amare: o treaptă mai grosier.`,`Your last ${hist.n} cups of this bag were bitter: one step coarser.`))}
 }
 if(p.blend||p.robusta) tips.push(W("Blend sau robusta: merge foarte bine la espresso, moka și cu lapte.","Blend or robusta: great for espresso, moka and with milk."));
 tips.push(W("Apa contează: plată, slab mineralizată sau filtrată (în jur de 150 mg/L reziduu fix).","Water matters: still, low-mineral or filtered (around 150 mg/L TDS)."));
 temp=Math.round(Math.min(100,Math.max(80,temp)));
 g=Math.max(-2,Math.min(2,Math.round(g)));
 const water=Math.round(r.dose*ratio*(esp?1:1));
 const fct=water/base.water;
 r.steps=r.steps.map((s,i)=>({...s,w:s.w==null?null:Math.round(s.w*fct),t:i>0?s.t+bloom:s.t,ro:i>0?s.ro:s.ro,en:s.en}));
 if(bloom){r.steps[0]={...r.steps[0],ro:r.steps[0].ro+" Lasă 60 s.",en:r.steps[0].en+" Wait 60 s."}}
 // step texts carry gram values for the base recipe: rescale them
 r.steps=r.steps.map(s=>({...s,ro:scaleGramsIn(s.ro,fct),en:scaleGramsIn(s.en,fct)}));
 if(r.extras) r.extras=r.extras.map(x=>({...x,g:Math.round(x.g*fct)}));
 r.water=water; if(hot) r.temp=temp; r.grindAdj=g;
 r.id='gen-'+mk; r.generated=true; delete r.note;
 const bn=p.name||(o?L(o.name):'');
 r.name={ro:`${meta.ro} pentru ${bn||'cafeaua ta'}`,en:`${meta.en} for ${bn||'your coffee'}`};
 r.by={ro:'recomandare pentru boabele tale',en:'tailored to your beans'};
 if(g) why.push(W(`Măcinare: cu ${Math.abs(g)} ${Math.abs(g)===1?'treaptă':'trepte'} mai ${g<0?'fină':'grosieră'} decât rețeta de bază.`,`Grind: ${Math.abs(g)} step${Math.abs(g)===1?'':'s'} ${g<0?'finer':'coarser'} than the base recipe.`));
 if(!why.length) why.push(W("Pornim de la rețeta de bază; după prima cafea ajustezi cu Diagnosticul.","Starting from the base recipe; after the first cup, adjust with Diagnose."));
 const exp=[]; if(p.notes&&p.notes.length) exp.push(p.notes.join(', '));
 else if(o) exp.push(L(o));
 if(proc&&PROC_TXT[proc]) exp.push(L(PROC_TXT[proc]));

function scaleGramsIn(txt,f){

}

const Store = {
 kinds:['brews','recipes','exps','beans'], data:{brews:[],recipes:[],exps:[],beans:[]}, db:null, uid:null, cloud:false,
 lsGet(k){try{return JSON.parse(localStorage.getItem('bloom.'+k)||'[]')}catch(e){return []}},
 lsSet(k){try{localStorage.setItem('bloom.'+k,JSON.stringify(this.data[k]))}catch(e){}},
 col(){return this.db.collection('data/users/'+this.uid)},
 loadLocal(){for(const k of this.kinds) this.data[k]=this.lsGet(k)},
 async connect(){
  try{
   if(!window.claude||!window.claude.use) return;
   const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
   if(!db||!user) return;
   const id=await user.id(); if(!id) return;
   this.db=db; this.uid=id;
   const snap=await this.col().get();
   const remote={}; this.kinds.forEach(k=>remote[k]=new Map());
   snap.docs.forEach(d=>{const v=d.data(); if(v&&remote[v._k]) remote[v._k].set(v.id,JSON.parse(JSON.stringify(v)))});
   this.cloud=true;
   for(const k of this.kinds){
    for(const it of this.data[k]) if(!remote[k].has(it.id)){ remote[k].set(it.id,{...it,_k:k}); this.col().doc(k[0]+'-'+it.id).set({...it,_k:k}).catch(()=>{this.cloud=false}); }
    this.data[k]=[...remote[k].values()].sort((a,b)=>(b.ts||0)-(a.ts||0)); this.lsSet(k);
   }
   if($('#sheet').hidden) render();
  }catch(e){ this.cloud=false }
 },
 put(k,item){
  item.ts=item.ts||Date.now();
  const i=this.data[k].findIndex(x=>x.id===item.id);
  if(i>=0) this.data[k][i]=item; else this.data[k].unshift(item);
  this.lsSet(k);
  if(this.db&&this.cloud) this.col().doc(k[0]+'-'+item.id).set({...item,_k:k}).catch(()=>{this.cloud=false;toast(t('sync_fail'))});
 },
 del(k,id){
  this.data[k]=this.data[k].filter(x=>x.id!==id); this.lsSet(k);
  if(this.db&&this.cloud) this.col().doc(k[0]+'-'+id).delete().catch(()=>{});
 }
};

let sheetPushed=false;
function openSheet(){ const sh=$('#sheet'); const was=sh.hidden; sh.hidden=false; document.body.style.overflow='hidden'; sh.scrollTop=0;
 if(was&&!sheetPushed){try{history.pushState({sheet:1},'');sheetPushed=true}catch(e){}} }
function dropSheet(){ // close without asking; a running brew stays saved and can be resumed
 if(brew){stopLoop();brew=null} releaseWake(); $('#sheet').hidden=true; document.body.style.overflow=''; }
function closeSheet(force,nav){
 if(!force&&brew&&!brew.finished&&elapsedNow()>0){confirmBar('#brewConfirm',t('leave_q'),t('leave_yes'),()=>closeSheet(true));return}
 if(brew) lsSet('bloom.active',null);
 dropSheet();
 if(nav){ // go somewhere else: reuse the sheet's history entry instead of going back
  sheetPushed=false; try{history.replaceState(null,'',nav)}catch(e){location.hash=nav} readHash(); render(); window.scrollTo(0,0); return }
 if(sheetPushed){sheetPushed=false;try{if(history.state&&history.state.sheet)history.back()}catch(e){}}
 render();
}
window.addEventListener('popstate',()=>{ if(!$('#sheet').hidden){ sheetPushed=false; dropSheet(); render(); } });

/* ---------- brew guide ---------- */
let brew=null, audioCtx=null, wake=null;
const prefs={sound:lsGet('bloom.sound')!=='0',voice:lsGet('bloom.voice')==='1'};
function prepRecipe(base,ov){
 const r=JSON.parse(JSON.stringify(base));
 if(ov&&ov.temp!=null) r.temp=ov.temp;
 if(ov&&ov.ratio!=null&&r.dose){const nw=Math.round(r.dose*ov.ratio),f=nw/r.water;r.steps=r.steps.map(s=>({...s,w:s.w==null?null:Math.round(s.w*f),ro:scaleGramsIn(s.ro,f),en:scaleGramsIn(s.en,f)}));r.water=nw}
 return r;
}
function openRecipe(id,opts={}){
 const base=opts.recipe||findRecipe(id); if(!base) return;
 stopLoop();
 const r=prepRecipe(base,opts.override);
 brew={r,baseId:base.id,dose:opts.dose||r.dose,running:false,acc:opts.acc||0,startAt:0,startedAt:opts.startedAt||null,idx:-2,lastCount:null,finished:false,
  exp:opts.exp||null,variant:opts.variant||null,override:opts.override||null,bean:opts.bean||null,change:opts.change||null};
 openSheet(); renderBrew(); requestWake();
 if(opts.running) startLoop();
}
function scale(){return brew.r.dose?brew.dose/brew.r.dose:1}

function ensureAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume()}catch(e){}}
function tone(freq,dur,vol){
 if(!prefs.sound||!audioCtx) return;
 try{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime;o.frequency.value=freq;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol||.25,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(n+dur+.05)}catch(e){}
}
function speak(txt){ if(!prefs.voice) return; try{const u=new SpeechSynthesisUtterance(txt);u.lang=lang==='ro'?'ro-RO':'en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){} }
function requestWake(){try{if(navigator.wakeLock&&!wake)navigator.wakeLock.request('screen').then(w=>{wake=w;const a=$('#awake');if(a)a.hidden=false;w.addEventListener&&w.addEventListener('release',()=>{wake=null;const a2=$('#awake');if(a2)a2.hidden=true})}).catch(()=>{})}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
function toggleBrew(){
 if(!brew) return;
 ensureAudio();
 if(brew.running){brew.acc=elapsedNow();brew.running=false;stopLoop();$('#go').textContent=t('resume');saveActive();return}
 if(!brew.startedAt) brew.startedAt=Date.now();
 brew.running=true;brew.startAt=Date.now();$('#go').textContent=t('pause');requestWake();saveActive();startLoop();
}
function startLoop(){ if(!brew) return; brew.running=true; if(!brew.startAt) brew.startAt=Date.now(); stopLoop(); brew.timer=setInterval(()=>tick(),200); tick(); }
function stopLoop(){ if(brew&&brew.timer){clearInterval(brew.timer);brew.timer=null} }
function tick(force){
 if(!brew||!$('#clock')) return;
 const r=brew.r, S_=r.steps, tt=totalTime(r)||1;
 let el=elapsedNow();
 if(el>=tt&&brew.running){ brew.acc=tt; brew.running=false; stopLoop(); brew.finished=true; el=tt; lsSet('bloom.active',null);
  tone(660,.7,.3); speak(t('done')); $('#go').textContent=t('log_it'); }
 const i=curIdx(el), started=el>0||brew.running, nx=S_[i+1];
 $('#clock').textContent=mmss(Math.floor(el));
 // ring = progress inside the current step
 let prog=0; if(started){ if(nx&&i>=0) prog=(el-S_[i].t)/Math.max(1,nx.t-S_[i].t); else if(!nx) prog=1; }
 $('#ringArc').setAttribute('stroke-dashoffset',(326.7*(1-Math.min(1,Math.max(0,prog)))).toFixed(1));
 // countdown + 3-2-1 ticks
 const cd=$('#cd');
 if(brew.finished){cd.innerHTML='';}
 else if(started&&nx){const rem=Math.ceil(nx.t-el);
  cd.innerHTML=`<span>${t('next_in')}</span> <b>${rem>=3600?mmss(rem):rem>=60?mmss(rem):rem+' s'}</b>${stepW(nx)!=null&&stepW(nx)>0?` <span>→ ${fmtG(stepW(nx))} g</span>`:''}`;
  if(brew.running&&rem<=3&&rem>=1&&brew.lastCount!==rem){brew.lastCount=rem;tone(1040,.12,.18)} }
 else if(!started&&S_[1]) cd.innerHTML=`<span>${t('first_at')}</span> <b>${mmss(S_[1].t)}</b>`;
 else cd.innerHTML='';
 if(i!==brew.idx||force){
  if(i!==brew.idx&&!force&&brew.idx!==-2&&i>=0&&brew.running){ tone(880,.3,.28); speak(stepTxt(S_[i])); }
  brew.idx=i;
  document.querySelectorAll('#stepList li').forEach((li,k)=>{li.classList.toggle('done',started&&(k<i||brew.finished));li.classList.toggle('cur',started&&!brew.finished&&k===i)});
  let w=null; const from=started?Math.max(0,i):0;
  for(let k=from;k>=0;k--){const v=stepW(S_[k]);if(v!=null&&v>0){w=v;break}}
  if(w==null){const fwd=S_.find(x=>x.w!=null&&x.w>0);if(fwd&&!started)w=stepW(fwd)}
  $('#tgt').innerHTML=w!=null?`${fmtG(w)}<small>g</small>`:'–';
  $('#now').textContent=brew.finished?t('done'):started?stepTxt(S_[Math.max(0,i)]):t('ready');
 }
}
function resetBrew(){ if(!brew)return; stopLoop(); brew.running=false; brew.acc=0; brew.startAt=0; brew.startedAt=null; brew.finished=false; brew.idx=-2; brew.lastCount=null; lsSet('bloom.active',null); $('#go').textContent=t('start'); tick(true); }

/* ---------- calculator ---------- */
function calcValues(){
 const c=st.calc, p=CALC_PRESETS[c.method], isE=c.method==='espresso';
 let dose,water;
 if(c.mode==='coffee'){dose=c.amount;water=dose*c.ratio}
 else if(isE){water=c.amount;dose=water/c.ratio}
 else{dose=c.amount/(c.ratio-p.ret);water=dose*c.ratio}
 return {dose,water,bev:isE?water:Math.max(0,water-dose*p.ret),p,isE};
}
function calcOutHTML(){

  <div><div class="k">${t('bev')}</div><div class="v">${fmtG(bev)}<small>${isE?'g':'ml'}</small></div><div class="s">${isE?'':t('absorbed')}</div></div>
  <div><div class="k">${t('temp')}</div><div class="v" style="font-size:17px">${esc(L(p.temp))}</div></div>
  <div class="wide"><div class="k">${t('grind')}</div><div class="s" style="color:var(--ink);font-size:15px;margin-top:2px">${esc(L(g))} <span class="mono" style="color:var(--muted);font-size:11px">${g.um}</span></div><div class="s grline">${grinderLine(GM_BY_CALC[st.calc.method],0)}</div></div>`;

function controlChart(isE,tds,eyv,ratio){
 const W=320,H=220,pl=38,pr=10,pt=14,pb=30;
 const turbo=isE&&ratio>=2.6;
 const x0=14,x1=26, y0=isE?4:.9, y1=isE?14:1.7, iy0=isE?(turbo?6:8):1.15, iy1=isE?(turbo?9:12):1.45;
 const X=v=>pl+(v-x0)/(x1-x0)*(W-pl-pr), Y=v=>H-pb-(v-y0)/(y1-y0)*(H-pt-pb);
 let g='';
 for(let v=x0;v<=x1;v+=2){g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-width=".6"/><text x="${X(v)}" y="${H-pb+13}" text-anchor="middle">${v}%</text>`}
 const ys=isE?[4,6,8,10,12,14]:[.9,1.1,1.3,1.5,1.7];
 ys.forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width=".6"/><text x="${pl-5}" y="${Y(v)+3}" text-anchor="end">${String(v).replace('.',lang==='ro'?',':'.')}</text>`});
 g+=`<rect x="${X(18)}" y="${Y(iy1)}" width="${X(22)-X(18)}" height="${Y(iy0)-Y(iy1)}" fill="var(--good)" fill-opacity=".16" stroke="var(--good)" stroke-width="1" stroke-dasharray="3 2"/>`;
 g+=`<text x="${(X(18)+X(22))/2}" y="${Y(iy1)-4}" text-anchor="middle" style="fill:var(--good)">${t('ideal')}</text>`;
 g+=`<text x="${W-pr}" y="${H-3}" text-anchor="end">${t('ey')} →</text>`;
 let msg='';
 if(tds!=null&&eyv!=null){
  const bad=eyv<8||eyv>30;
  const cx=X(Math.min(x1,Math.max(x0,eyv))), cy=Y(Math.min(y1,Math.max(y0,tds)));
  if(!bad) g+=`<circle cx="${cx}" cy="${cy}" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  msg=`<div class="readouts" style="margin-top:10px"><div><div class="k">${t('ey')}</div><div class="v">${fmtG(eyv)}<small>%</small></div></div><div><div class="k">TDS</div><div class="v">${fmtG(tds)}<small>%</small></div></div>
  <div class="wide s" style="color:var(--ink);font-size:14px">${bad?t('ey_bad'):eyv<18?t('ey_low'):eyv>22?t('ey_high'):t('ey_ok')}</div></div>`;
 }
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('ey_title')}">${g}</svg><p class="note" style="margin:4px 0 0">${isE?(turbo?t('zone_turbo'):t('zone_esp')):t('zone_filter')}</p>${msg}`;
}

function parseSteps(txt){
 const out=[];
 txt.split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{
  const p=line.split('|').map(s=>s.trim()); if(p.length<2) return;
  const tt=parseTime(p[0]); if(tt==null) return;
  const w=p.length>=3&&p[1]!==''?num(p[1]):null;
  const text=p.length>=3?p.slice(2).join(' | '):p[1];
  out.push({t:tt,w,ro:text,en:text});
 });
 return out.sort((a,b)=>a.t-b.t);
}
function saveCustom(o){
 const id='c-'+uid();
 const r={id,custom:true,method:METHODS.includes(o.method)?o.method:'lab',name:{ro:o.name,en:o.name},by:o.by||{ro:'rețeta mea',en:'my recipe'},
  dose:+o.dose||15,water:+o.water||250,temp:o.temp??null,grind:GRIND[o.grind]?o.grind:'medium',steps:o.steps,
  ingredients:o.ingredients&&o.ingredients.length?o.ingredients.map(x=>({ro:x,en:x})):undefined,note:o.note?{ro:o.note,en:o.note}:undefined};
 Store.put('recipes',r);toast(t('recipe_saved'));sheetPushed&&(sheetPushed=sheetPushed);openRecipe(id);
}
async function importWithClaude(){
 const txt=$('#imp_txt').value.trim(), msg=$('#imp_msg'), btn=$('#imp_go');
 if(!txt){$('#imp_txt').focus();msg.textContent=t('imp_need');return}
 if(!AI.sample){msg.textContent=t('ai_off');$('#mf_name').focus();return}
 btn.disabled=true;msg.textContent=t('converting');
 const langName=lang==='ro'?'Romanian':'English';
 const prompt=`You convert a coffee recipe found online into structured JSON for a brewing timer app. Reply with JSON only.
Schema: {"name": string, "by": string (author or source if mentioned, else ""), "method": one of "pour","immersion","espresso","moka","ibrik","cold","lab" ("immersion" covers AeroPress, French press, Clever; "lab" for unusual drinks), "dose": grams of coffee (number), "water": total grams of water, or espresso yield in grams (number), "temp": water temperature in °C (number or null), "grind": one of "xfine","fine","mfine","medium","mcoarse","coarse", "ingredients": array of strings for anything besides coffee and water (may be empty), "note": short tip string or "", "steps": array of {"t": seconds from start when this step begins (number), "w": cumulative total water on the scale in grams at the end of this step, or null if no water is added, "text": one short imperative instruction}}.
Rules: convert ounces/ml/cups to grams (1 ml water = 1 g). If a quantity is missing, choose a sensible standard value. The last step's "t" is when the brew is finished. Write "name", "note", "ingredients" and step "text" in ${langName}.
Recipe text:
"""${txt.slice(0,6000)}"""`;
 try{
  const r=await AI.sample.json(prompt,{modelTier:'default'});
  if(!r||!Array.isArray(r.steps)||!r.steps.length) throw {code:'shape'};
  const steps=r.steps.filter(s=>s&&typeof s.t==='number'&&s.text).map(s=>({t:Math.max(0,Math.round(s.t)),w:typeof s.w==='number'?s.w:null,ro:String(s.text),en:String(s.text)})).sort((a,b)=>a.t-b.t);
  if(!steps.length) throw {code:'shape'};
  msg.textContent='';
  saveCustom({name:String(r.name||t('imported')),by:String(r.by||''),method:r.method,dose:r.dose,water:r.water,temp:typeof r.temp==='number'?r.temp:null,grind:r.grind,ingredients:Array.isArray(r.ingredients)?r.ingredients.map(String):[],note:r.note?String(r.note):'',steps});
 }catch(e){
  if(e&&e.code==='not_granted'){AI.sample=null;msg.textContent=t('ai_off')}
  else msg.textContent=e&&e.code==='rate_limited'?t('rg_rate'):t('imp_fail');
 }finally{btn.disabled=false}
}

 const g=myGrinder(); if(!g||!gm) return null;
 const ov=(myOverrides()[g.id]||{})[gm];
 if(ov) return {g,own:String(ov),unit:L(g.settingsUnit)||''};

  const dd=Math.round(d/step)*step; if(dd){lo=+(lo+dd).toFixed(dec?1:0);hi=+(hi+dd).toFixed(dec?1:0);shifted=true}}

  body.innerHTML=`<div class="chips">${['all',...cats].map(c=>`<button class="chip" data-mc="${c}" aria-pressed="${M.cat===c}">${c==='all'?t('all'):esc(L(CAT_LABEL[c]||{ro:c}))}</button>`).join('')}</div>

   <span class="by">${esc(L(CAT_LABEL[c.category]||{ro:c.category}))} · <span class="mono" title="${t('difficulty')}">${dots(c.difficulty||1)}</span></span><span class="chdesc">${esc(L(c.profile).length>110?L(c.profile).slice(0,108)+'…':L(c.profile))}</span></button>`).join('')}</div>`:`<div class="empty">${t('man_empty')}</div>`}`;
  body.querySelectorAll('[data-mc]').forEach(b=>b.onclick=()=>{M.cat=b.dataset.mc;render()});
  body.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>openChapter(b.dataset.ch));
 } else if(M.seg==='trends'){
  const tr=(MANUAL.trends||[]).slice().sort((a,b)=>(b.hype||0)-(a.hype||0)||(b.relevanceRO||0)-(a.relevanceRO||0));
  const cats=[...new Set(tr.map(x=>x.category))];
  const list=tr.filter(x=>M.tcat==='all'||x.category===M.tcat);
  body.innerHTML=`${MANUAL.updated?`<p class="note" style="margin:0 0 8px">${t('tr_updated')} ${esc(MANUAL.updated)}</p>`:''}
  <div class="chips">${['all',...cats].map(c=>`<button class="chip" data-tc="${c}" aria-pressed="${M.tcat===c}">${c==='all'?t('all'):esc(L(TCAT_LABEL[c]||{ro:c}))}</button>`).join('')}</div>
  ${list.length?list.map(x=>{const rid=x.recipeId&&findRecipe(x.recipeId)?x.recipeId:null;
   return `<article class="trend"><div class="trhead"><h4>${esc(L(x.title))}</h4><span class="hype" title="${t('tr_hype')}">${'▲'.repeat(x.hype||1)}</span></div>
   <div class="trmeta">${esc(L(TCAT_LABEL[x.category]||{ro:x.category}))} · ${t('tr_'+(x.longevity||'rising'))}${x.relevanceRO>=3?' · '+t('tr_ro'):''}</div>
   <p>${esc(L(x.summary))}</p>${L(x.whyNow)?`<p class="note"><b>${t('tr_why')}:</b> ${esc(L(x.whyNow))}</p>`:''}
   ${L(x.tryAtHome)?`<p class="note"><b>${t('tr_try')}:</b> ${esc(L(x.tryAtHome))}</p>`:''}
   <div class="trfoot">${rid?`<button class="btn" data-open="${esc(rid)}">${t('tr_recipe')}</button>`:''}${(x.sources||[]).slice(0,2).map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${t('source')} ${i+1}</a>`).join('')}</div></article>`}).join(''):`<div class="empty">${t('man_empty')}</div>`}`;
  body.querySelectorAll('[data-tc]').forEach(b=>b.onclick=()=>{M.tcat=b.dataset.tc;render()});
 } else {
  grinderBrowser(body,`<p class="note" style="margin:0">${t('gr_market')}</p>`);
 }
}
function openChapter(id){
 const c=(MANUAL.chapters||[]).find(x=>x.id===id); if(!c) return;
 stopBrew(); brew=null;
 const recs=(c.recipeIds||[]).map(findRecipe).filter(Boolean);
 const gl=c.grindKey?grinderLine(c.grindKey,0):'';
 $('#sheetInner').innerHTML=`
 <div class="sheethead"><span class="tag" style="margin:0">${esc(L(CAT_LABEL[c.category]||{ro:c.category}))} · ${t('difficulty')} ${dots(c.difficulty||1)}</span><button class="x" id="closeC" aria-label="${t('aria_close')}">✕</button></div>
 <div class="brewname">${esc(L(c.name))}</div>
 ${L(c.history)?`<p class="note" style="margin:6px 0 0">${esc(L(c.history))}</p>`:''}
 <h3 class="sec">${t('ch_how')}</h3><p style="margin:0">${esc(L(c.howItWorks))}</p>
 ${L(c.profile)?`<h3 class="sec">${t('ch_profile')}</h3><p style="margin:0">${esc(L(c.profile))}</p>`:''}
 ${L(c.gear)?`<h3 class="sec">${t('ch_gear')}</h3><p style="margin:0">${esc(L(c.gear))}</p>`:''}
 ${c.grindKey?`<h3 class="sec">${t('grind')}</h3><div class="lastlog" style="margin-top:0">${esc(L(GM_LABEL[c.grindKey]))} · ${gl}</div>`:''}
 ${recs.length?`<h3 class="sec">${t('ch_recipes')}</h3><div class="list" style="margin-top:0">${recs.map(recipeRow).join('')}</div>`:''}
 ${(c.mistakes||[]).length?`<h3 class="sec">${t('ch_mistakes')}</h3><ol class="advice">${c.mistakes.map(m=>`<li>${esc(L(m))}</li>`).join('')}</ol>`:''}
 ${(c.tips||[]).length?`<h3 class="sec">${t('ch_tips')}</h3><ol class="advice plain">${c.tips.map(m=>`<li>${esc(L(m))}</li>`).join('')}</ol>`:''}
 ${(c.sources||[]).length?`<p class="note" style="margin-top:16px">${t('ch_sources')}: ${c.sources.slice(0,4).map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${i+1}</a>`).join(' · ')}</p>`:''}`;
 openSheet(); $('#closeC').onclick=()=>closeSheet(true);
}

/* ---------- tools: my grinder, calculator, A/B tests ---------- */
st.tool=st.tool||'grinder';
function viewTools(v){
 v.innerHTML=`<h2 class="view-title">${t('tools_title')}</h2>
 <div class="seg" role="tablist">${['grinder','calc','lab'].map(k=>`<button role="tab" aria-selected="${st.tool===k}" data-tool="${k}">${t('tool_'+k)}</button>`).join('')}</div>
 <div id="toolBody" style="margin-top:6px"></div>`;
 v.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{st.tool=b.dataset.tool;render()});
 const body=$('#toolBody');
 if(st.tool==='calc') viewCalc(body);
 else if(st.tool==='lab') viewLab(body);
 else grinderBrowser(body,`<p class="lede" style="margin-top:8px">${t('gr_lede')}</p>`);
 body.querySelectorAll('h2.view-title').forEach(h=>h.remove());
}

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
 const o=e.target.closest('[data-open]'); if(o){openRecipe(o.dataset.open);return}
 const f=e.target.closest('[data-filter]'); if(f){st.filter=f.dataset.filter;render();return}
 const lb=e.target.closest('[data-lang]'); if(lb){lang=lb.dataset.lang;lsSet('bloom.lang',lang);render()}
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#sheet').hidden&&!$('#ef')&&!$('#mf')) closeSheet(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&brew){ requestWake(); tick(true); } });

readHash(); Store.loadLocal(); render(); Store.connect(); initAI();
if(activeBrew()&&location.hash==='') {/* banner on Recipes offers to resume */}

<style>.installbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.12);font-size:14px}.installbar span{flex:1}.installbar .x.sm{position:static;flex:none}</style>
<script>
/* PWA: service worker + install prompt (GitHub Pages build only) */
(function(){
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
  const ro=()=> (document.documentElement.lang||'ro')==='ro';
  const bar=document.getElementById('installbar'), txt=document.getElementById('install_txt'), go=document.getElementById('install_go');
  const dismissed=()=>{try{return localStorage.getItem('bloom.installDismissed')==='1'}catch(e){return false}};
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  let deferred=null;
  function show(mode){ if(standalone||dismissed()) return;
    txt.textContent = mode==='ios' ? (ro()?'Instalează aplicația: Partajează → Adaugă pe ecranul principal.':'Install the app: Share → Add to Home Screen.') : (ro()?'Instalează Bloom Lab pe telefon. Merge și fără internet.':'Install Bloom Lab on your phone. Works offline too.');
    go.hidden = mode==='ios'; go.textContent = ro()?'Instalează':'Install'; bar.hidden=false; }
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;setTimeout(()=>show('prompt'),4000)});
  go.onclick=async()=>{ if(!deferred) return; bar.hidden=true; deferred.prompt(); try{await deferred.userChoice}catch(e){} deferred=null; };
  document.getElementById('install_x').onclick=()=>{bar.hidden=true;try{localStorage.setItem('bloom.installDismissed','1')}catch(e){}};
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!/crios|fxios/i.test(navigator.userAgent);
  if(ios) setTimeout(()=>show('ios'),6000);
  window.addEventListener('appinstalled',()=>{bar.hidden=true});
})();
</script>
