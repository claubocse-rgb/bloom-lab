<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Bloom Lab - cafea mai bună acasă: rețete cu timer, recunoașterea cafelei, calculator, diagnostic de gust, jurnal, manual de metode și setări pentru râșnița ta.">
<meta name="theme-color" content="#ECEEE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bloom Lab">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Bloom Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=Martian+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app; tabs at the bottom; the brew screen reads like a coffee scale display. */
:root{
  --bg:#ECEEE8; --surface:#F8F9F5; --sunk:#E2E5DD; --ink:#1B211D; --muted:#5B655D; --line:#D0D6CB;
  --accent:#A3263A; --accent-ink:#FFFFFF; --bean:#5F6F3F; --amber:#A8661F; --good:#3E7A4F;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111412; --surface:#1A1E1B; --sunk:#0C0E0D; --ink:#E6E8E1; --muted:#99A299; --line:#2C332E;
  --accent:#E8667A; --accent-ink:#1C0A0E; --bean:#A9BA7E; --amber:#E2A55E; --good:#7CC08F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111412; --surface:#1A1E1B; --sunk:#0C0E0D; --ink:#E6E8E1; --muted:#99A299; --line:#2C332E;
  --accent:#E8667A; --accent-ink:#1C0A0E; --bean:#A9BA7E; --amber:#E2A55E; --good:#7CC08F; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;flex-direction:column;gap:0;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

h2.view-title{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:8px 0 4px;text-wrap:balance}
p.lede{color:var(--muted);margin:0 0 16px;max-width:60ch}
h3.sec{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:24px 0 8px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips.wrap{flex-wrap:wrap;overflow:visible}

/* recipe list */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:12px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.row .name{font-weight:600;font-size:16px;min-width:0}
.row .by{color:var(--muted);font-size:13px}
.row .spec{grid-column:1/-1;font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.row .go{grid-row:1/3;grid-column:2;color:var(--accent);font-size:20px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);vertical-align:middle;margin-left:6px}
.tag.lab{background:color-mix(in srgb,var(--bean) 22%,transparent);color:var(--bean)}

/* buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.f textarea{min-height:110px;resize:vertical;font-family:var(--f-body)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.note{font-size:13px;color:var(--muted)}

/* readout (scale display) */
.readouts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.readouts>div{background:var(--surface);padding:12px 14px;min-width:0}
.readouts .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.readouts .v{font-family:var(--f-mono);font-size:22px;font-weight:500;letter-spacing:-.03em;margin-top:2px}
.readouts .v small{font-size:12px;color:var(--muted);margin-left:2px}
.readouts .s{font-size:12px;color:var(--muted)}
.readouts .wide{grid-column:1/-1}

/* stepper */
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stepper button{background:none;border:0;width:44px;height:44px;font-size:20px;color:var(--accent)}
.stepper input{border:0;background:none;text-align:center;width:100%;min-width:0;font-family:var(--f-mono);font-size:17px;padding:0}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent)}

/* sheets / overlays */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .inner{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 40px}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:6px}
.x{background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:999px;font-size:18px;flex:none}

/* brew screen */
.brewname{font-family:var(--f-display);font-size:24px;line-height:1.15;margin:4px 0 2px;text-wrap:balance}
.display{background:var(--sunk);border-radius:20px;padding:18px 18px 16px;margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-family:var(--f-mono);font-size:26px;font-weight:500;letter-spacing:-.04em}
.ring .t span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.target .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.target .big{font-family:var(--f-mono);font-size:clamp(40px,13vw,58px);line-height:1;font-weight:500;letter-spacing:-.05em;color:var(--accent)}
.target .big small{font-size:.38em;color:var(--muted);margin-left:2px;letter-spacing:0}
.target .nx{font-size:13px;color:var(--muted);margin-top:8px}
.nowstep{font-size:19px;font-weight:600;line-height:1.3;margin:16px 0 4px;min-height:2.6em;text-wrap:pretty}
.steps{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:52px 64px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.steps li .tm,.steps li .wg{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.steps li.done{opacity:.45}
.steps li.cur{color:var(--accent)}
.steps li.cur .tm,.steps li.cur .wg{color:var(--accent);font-weight:700}
.ctrls{display:flex;gap:8px;margin-top:16px}
.ctrls .btn{flex:1}
.ctrls .btn.primary{flex:2;font-size:17px;padding:14px}
.extras{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.extras div{font-size:14px}
.ing{margin:6px 0 0;padding-left:18px}
.ing li{margin:3px 0}

/* stars + taste */
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:30px;line-height:1;color:var(--line);padding:2px}
.stars button.on{color:var(--amber)}

/* journal */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:6px}
.stats div{background:var(--surface);padding:12px}
.stats b{display:block;font-family:var(--f-mono);font-size:20px;font-weight:500}
.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.entry{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:14px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.entry .d{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.entry .r{font-size:14px;color:var(--amber);letter-spacing:1px}
.entry .t1{font-weight:600}
.entry .t2{grid-column:1/-1;font-size:13px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);margin-top:16px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:20px;margin-bottom:6px}
.storage{font-size:12px;color:var(--muted);margin-top:14px;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)}

/* compass */
.compass{display:grid;grid-template-columns:22px minmax(0,1fr);grid-template-rows:auto 22px;gap:6px;margin-top:6px}
.compass .yax{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:center;font-weight:700}
.compass .xax{grid-column:2;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cgrid button{aspect-ratio:1.3;min-width:0;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:12.5px;font-weight:600;padding:6px;line-height:1.2;text-wrap:balance}
.cgrid button.mid{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.cgrid button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.advice{list-style:none;padding:0;margin:8px 0 0;counter-reset:a}
.advice li{padding:10px 0 10px 34px;position:relative;border-bottom:1px solid var(--line);counter-increment:a}
.advice li::before{content:counter(a);position:absolute;left:0;top:9px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:12px;display:flex;align-items:center;justify-content:center}
.advice.plain li::before{background:var(--sunk);color:var(--muted)}
.rule{font-size:13px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--amber) 14%,transparent);margin-top:14px}

/* chart */
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:9px}

/* lab */
.labcard{padding:14px 0;border-bottom:1px solid var(--line)}
.labcard h4{margin:0;font-size:16px}
.labcard .o{font-size:12px;color:var(--muted);font-family:var(--f-mono);margin-top:2px}
.labcard p{margin:6px 0 8px;font-size:14px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cmp div{background:var(--sunk);border-radius:10px;padding:10px}
.cmp b{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cmp .rr{color:var(--amber);font-size:15px}
.win{outline:2px solid var(--good)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
/* v2 additions */
.row .chdesc{grid-column:1/-1;font-size:13px;color:var(--muted);line-height:1.4}
.ownset{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:10px 6px;font-weight:600;font-size:14px;color:var(--muted);min-height:40px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grline{margin-top:6px;font-size:13px;color:var(--ink)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:13px;text-align:left}
.grlist{border-top:1px solid var(--line);margin-top:8px}
.grow{border-bottom:1px solid var(--line)}
.grow.mine{background:color-mix(in srgb,var(--bean) 8%,transparent)}
.grhead{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;background:none;border:0;text-align:left;padding:12px 2px}
.grhead .name{font-weight:600;font-size:15px}
.grhead .meta{font-size:12px;color:var(--muted)}
.grdet{padding:0 2px 14px;display:flex;flex-direction:column;gap:6px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:13px}.kv span{color:var(--muted)}.kv b{font-weight:500;min-width:0}
.tblwrap{overflow-x:auto}
.settbl{border-collapse:collapse;width:100%;font-size:13px;margin-top:4px}
.settbl th,.settbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.settbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.trend{padding:14px 0;border-bottom:1px solid var(--line)}
.trend p{margin:6px 0}
.trhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.trhead h4{margin:0;font-size:16px}
.hype{color:var(--accent);font-size:11px;letter-spacing:1px;flex:none}
.trmeta{font-size:12px;color:var(--muted);margin-top:2px}
.trfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px}
.trfoot .btn{padding:8px 12px}
a{color:var(--accent)}
.rgphoto.locked{position:relative;opacity:.9}
.rgphoto.locked svg{stroke:var(--muted)}
.pro{display:inline-block;font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--amber);color:var(--bg);padding:2px 6px;border-radius:4px}
.pro.big{font-size:12px;padding:4px 8px}
:root:not([data-theme="dark"]){--bean:#4E5D2F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bean:#A9BA7E}}
.chip{min-height:40px;padding:8px 14px}
.chip.static{cursor:default}
.lang button{padding:9px 13px;min-height:40px}
.stars button{color:var(--muted);opacity:.55}
.stars button.on{color:var(--amber);opacity:1}
details>summary{padding:10px 0;font-weight:600;cursor:pointer;min-height:40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.err{color:var(--accent);font-size:13px;font-weight:600;min-height:0}
.err:empty{display:none}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:24px}
.hrow .btn{padding:8px 14px}
.recog{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px}
.recog h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0}
.rgrow{display:flex;gap:10px;align-items:stretch}
.rgphoto{flex:none;width:96px;flex-direction:column;gap:6px;padding:8px;font-size:12px;text-align:center;line-height:1.2;cursor:pointer}
.rgphoto svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linejoin:round}
.rgphoto img{width:64px;height:48px;object-fit:cover;border-radius:6px}
.rgtext{flex:1}
.rgtext textarea{min-height:76px;height:100%}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--bean) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--bean) 35%,var(--line));border-radius:12px;padding:10px 12px;margin-top:10px}
.banner.warn{background:color-mix(in srgb,var(--amber) 14%,var(--surface));border-color:color-mix(in srgb,var(--amber) 40%,var(--line))}
.banner b{font-size:13px}
.conf{font-size:13px;font-weight:600;margin-top:8px;color:var(--good)}
.conf.medium{color:var(--amber)}.conf.low{color:var(--accent)}
label.f.guess select,label.f.guess input{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,var(--surface))}
.display{cursor:pointer;user-select:none;-webkit-user-select:none}
.ring .t b.long{font-size:17px}
.target .cd{margin-top:10px;font-size:13px;color:var(--muted)}
.target .cd b{font-family:var(--f-mono);font-size:22px;color:var(--ink);font-weight:500}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tg{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--muted);min-height:36px}
.tg[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.tg.static{border-style:dashed;display:inline-flex;align-items:center}
.lastlog{font-size:13px;color:var(--muted);margin-top:12px;padding:10px 12px;background:var(--sunk);border-radius:10px}
.lastlog b{color:var(--ink)}
.advcard{position:relative;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 46px 14px 14px;margin-bottom:12px}
.x.sm{position:absolute;top:8px;right:8px;width:36px;height:36px;font-size:14px}
.confirm span{flex:1 1 160px;font-weight:600;font-size:14px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px;padding:0;border:0;background:none}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/*DATA:MANUAL*/const MANUAL={"updated":"2026-10-28","chapters":[{"id":"hario-v60","name":{"ro":"Hario V60","en":"Hario V60"},"category":"pourover","difficulty":2,"gear":{"ro":"V60 (plastic, ceramică sau sticlă), filtre V60, ibric cu cioc de gâscă, cântar","en":"V60 (plastic, ceramic or glass), V60 filters, gooseneck kettle, scale"},"history":{"ro":"Lansat de Hario în 2004, numele vine de la unghiul conului de 60°. A devenit simbolul valului trei de cafea de specialitate.","en":"Launched by Hario in 2004, named after its 60° cone angle. It became the icon of third-wave specialty coffee."},"howItWorks":{"ro":"Conul are o singură gaură mare și nervuri spiralate, deci viteza de curgere depinde aproape în întregime de tine și de măcinare. Torni în etape, iar apa trece o singură dată prin cafea.","en":"The cone has one large hole and spiral ribs, so flow rate depends almost entirely on you and the grind. You pour in stages and water passes through the coffee once."},"profile":{"ro":"Limpede, aromat, aciditate vie; scoate în evidență notele florale și fructate ale prăjirilor deschise.","en":"Clean, aromatic, lively acidity; highlights the floral and fruity notes of light roasts."},"grindKey":"pourover","mistakes":[{"ro":"Torni prea repede pe margini și apa ocolește cafeaua.","en":"Pouring too fast on the edges so water bypasses the coffee."},{"ro":"Bloom prea scurt: cafeaua proaspătă are nevoie de 30–45 s ca să elibereze CO₂.","en":"Too short a bloom: fresh coffee needs 30–45 s to release CO₂."},{"ro":"Schimbi trei variabile deodată când gustul nu iese.","en":"Changing three variables at once when the cup is off."}],"tips":[{"ro":"Rotește ușor dripperul după ultima turnare ca patul de cafea să se niveleze.","en":"Swirl the dripper gently after the last pour to flatten the bed."},{"ro":"Clătește filtrul cu apă fierbinte ca să scapi de gustul de hârtie.","en":"Rinse the filter with hot water to remove paper taste."},{"ro":"Dacă durează peste 3:30, macină mai grosier; sub 2:30, mai fin.","en":"If it runs past 3:30, grind coarser; under 2:30, finer."}],"recipeIds":["v60-hoffmann","v60-46","v60-iced","april-pulse","peng-two-temp","decaf-v60-gentle"],"sources":["https://www.hario-europe.com/","https://www.jameshoffmann.co.uk/","https://honestcoffeeguide.com/brew-recipes"]},{"id":"kalita-wave","name":{"ro":"Kalita Wave","en":"Kalita Wave"},"category":"pourover","difficulty":1,"gear":{"ro":"Kalita Wave 155/185, filtre ondulate Wave, ibric, cântar","en":"Kalita Wave 155/185, Wave filters, kettle, scale"},"history":{"ro":"Kalita, firmă japoneză fondată în 1958, a lansat Wave în 2010. Fundul plat și filtrul cu 20 de pliuri au făcut-o favorita barurilor și a concursurilor.","en":"Kalita, a Japanese company founded in 1958, released the Wave in 2010. Its flat bottom and 20-fold filter made it a bar and competition favourite."},"howItWorks":{"ro":"Trei găuri mici și filtrul ondulat, care atinge pereții doar în câteva puncte, încetinesc și uniformizează curgerea. Patul plat de cafea se extrage mai egal decât într-un con.","en":"Three small holes and a wavy filter that touches the walls only at a few points slow and even out the flow. The flat coffee bed extracts more evenly than a cone."},"profile":{"ro":"Dulce, echilibrat, corp mediu; mai iertător și mai rotund decât V60.","en":"Sweet, balanced, medium body; more forgiving and rounder than a V60."},"grindKey":"pourover","mistakes":[{"ro":"Torni direct pe pliurile filtrului și le turtești.","en":"Pouring straight onto the filter folds and flattening them."},{"ro":"Clătești filtrul și îl lași să se lipească de pereți.","en":"Rinsing the filter and letting it stick to the walls."},{"ro":"Măcinare prea fină: fundul plat se înfundă ușor.","en":"Grinding too fine: the flat bed clogs easily."}],"tips":[{"ro":"Toarnă în cercuri mici, în interiorul unui cerc de 3–4 cm.","en":"Pour in small circles inside a 3–4 cm ring."},{"ro":"Turnările în pulsuri țin nivelul apei constant și extracția egală.","en":"Pulse pours keep the water level steady and extraction even."},{"ro":"Varianta din oțel păstrează mai bine căldura decât sticla.","en":"The steel version holds heat better than glass."}],"recipeIds":["kalita"],"sources":["https://www.kalita.co.jp/","https://cdn.shopify.com/s/files/1/0081/4854/9694/files/Brew_Guides_-_Kalita.pdf","https://honestcoffeeguide.com/brew-recipes"]},{"id":"chemex","name":{"ro":"Chemex","en":"Chemex"},"category":"pourover","difficulty":2,"gear":{"ro":"Chemex 6 sau 8 căni, filtre Chemex groase, ibric, cântar","en":"Chemex 6 or 8 cup, thick Chemex filters, kettle, scale"},"history":{"ro":"Inventat în 1941 de chimistul Peter Schlumbohm, Chemex se află în colecția permanentă MoMA. Forma de clepsidră e și dripper, și carafă.","en":"Invented in 1941 by chemist Peter Schlumbohm, the Chemex is in MoMA's permanent collection. The hourglass is both dripper and carafe."},"howItWorks":{"ro":"Filtrul de hârtie e cu 20–30% mai gros decât altele și reține uleiurile și particulele fine. Curgerea e lentă, așa că macini mai grosier decât la V60.","en":"The paper filter is 20–30% thicker than others and holds back oils and fines. Flow is slow, so you grind coarser than for a V60."},"profile":{"ro":"Foarte curat, corp ușor, aproape ca un ceai; ideal pentru cafele florale.","en":"Very clean, light body, almost tea-like; ideal for floral coffees."},"grindKey":"chemex","mistakes":[{"ro":"Pui partea simplă a filtrului spre cioc și blochezi ieșirea aerului.","en":"Placing the single-layer side toward the spout and blocking the air channel."},{"ro":"Măcinare de V60: curge prea încet și iese amar.","en":"Using a V60 grind: it drains too slowly and turns bitter."},{"ro":"Faci o singură cană în Chemex de 8: patul e prea subțire.","en":"Brewing a single cup in an 8-cup Chemex: the bed is too shallow."}],"tips":[{"ro":"Partea triplă a filtrului merge spre cioc.","en":"The triple-fold side of the filter goes on the spout."},{"ro":"Dacă scurgerea se blochează, ridică puțin filtrul ca să intre aer.","en":"If drawdown stalls, lift the filter slightly to let air in."},{"ro":"Folosește minim 30 g cafea în modelul de 6 căni.","en":"Use at least 30 g of coffee in the 6-cup model."}],"recipeIds":["chemex","chemex-iced"],"sources":["https://www.chemexcoffeemaker.com/","https://honestcoffeeguide.com/brew-recipes"]},{"id":"origami","name":{"ro":"Origami Dripper","en":"Origami Dripper"},"category":"pourover","difficulty":2,"gear":{"ro":"Origami S sau M, filtre conice (V60) sau Wave (Kalita), suport din lemn, ibric, cântar","en":"Origami S or M, cone (V60) or Wave (Kalita) filters, wooden holder, kettle, scale"},"history":{"ro":"Creat în Japonia, la Gifu, din porțelan Mino, și popularizat după ce campionul mondial Du Jianing l-a folosit în 2019.","en":"Made in Gifu, Japan, from Mino porcelain, and popularised after World Brewers Cup champion Du Jianing used it in 2019."},"howItWorks":{"ro":"Cele 20 de caneluri adânci lasă filtrul să stea departe de pereți, deci aerul circulă și apa curge repede. Același dripper se poartă ca un V60 cu filtru conic sau ca o Kalita cu filtru Wave.","en":"Twenty deep ribs keep the filter off the walls, so air flows and water drains fast. The same dripper behaves like a V60 with a cone filter or like a Kalita with a Wave filter."},"profile":{"ro":"Cu filtru conic: luminos și delicat. Cu Wave: mai dulce și mai rotund.","en":"With a cone filter: bright and delicate. With a Wave: sweeter and rounder."},"grindKey":"pourover","mistakes":[{"ro":"Nu adaptezi măcinarea la filtrul ales.","en":"Not adjusting the grind for the filter you chose."},{"ro":"Nu preîncălzești porțelanul, care absoarbe multă căldură.","en":"Not preheating the porcelain, which soaks up a lot of heat."},{"ro":"Torni prea mult deodată și apa se scurge pe lângă filtru.","en":"Pouring too much at once so water runs around the filter."}],"tips":[{"ro":"Începe cu filtrul Wave: e mai iertător.","en":"Start with the Wave filter: it's more forgiving."},{"ro":"Varianta din rășină AS păstrează căldura aproape la fel de bine și nu se sparge.","en":"The AS resin version holds heat nearly as well and won't break."},{"ro":"Ține suportul din lemn uscat după fiecare folosire.","en":"Dry the wooden holder after each use."}],"recipeIds":["origami-wave"],"sources":["https://kaffeemacher.de/en/blogs/kaffeewissen/origami-dripper-recipe-and-tips","https://field-guides.vercel.app/pour-over/official-brewer-recipes.html","https://fivesenses.com.au/blogs/news/origami-brewer-brew-guide"]},{"id":"orea","name":{"ro":"Orea","en":"Orea"},"category":"pourover","difficulty":2,"gear":{"ro":"Orea V3/V4 (sticlă sau porcelan), filtre Wave sau Sibarist, ibric, cântar","en":"Orea V3/V4 (glass or porcelain), Wave or Sibarist filters, kettle, scale"},"history":{"ro":"Proiectat în Marea Britanie de Ryan Wilbur și lansat prin crowdfunding în 2020. A devenit rapid un preferat al concurenților Brewers Cup.","en":"Designed in the UK by Ryan Wilbur and crowdfunded in 2020. It quickly became a Brewers Cup competitor favourite."},"howItWorks":{"ro":"Fund plat cu o singură gaură centrală mare și pereți care țin filtrul la distanță: curge foarte repede. Bazele interschimbabile (Open, Fast, Classic) schimbă viteza.","en":"A flat bottom with one big central hole and walls that hold the filter away: it drains very fast. Swappable bases (Open, Fast, Classic) change the speed."},"profile":{"ro":"Claritate mare și dulceață, extracție uniformă chiar la măcinare fină.","en":"High clarity and sweetness, even extraction even at finer grinds."},"grindKey":"pourover","mistakes":[{"ro":"Folosești măcinarea de V60: la Orea curge prea repede și iese apos.","en":"Using a V60 grind: the Orea drains too fast and tastes watery."},{"ro":"Torni puternic în centru și sapi un crater în cafea.","en":"Pouring hard in the centre and digging a crater."},{"ro":"Ignori ce bază ai montat.","en":"Forgetting which base you have fitted."}],"tips":[{"ro":"Macină cu 1–2 trepte mai fin decât la V60.","en":"Grind 1–2 steps finer than for a V60."},{"ro":"Turnări multe și mici țin temperatura și nivelul stabile.","en":"Many small pours keep temperature and level steady."},{"ro":"Filtrele Sibarist Fast scurtează timpul și cresc claritatea.","en":"Sibarist Fast filters shorten time and boost clarity."}],"recipeIds":["orea-fast"],"sources":["https://pullandpourcoffee.com/?p=10527","https://field-guides.vercel.app/pour-over/recipes-and-methods.html","https://europeancoffeetrip.com/?p=41654"]},{"id":"nextlevel-pulsar","name":{"ro":"NextLevel Pulsar","en":"NextLevel Pulsar"},"category":"pourover","difficulty":3,"gear":{"ro":"Pulsar, filtre plate Pulsar, ibric, cântar, opțional unealtă WDT","en":"Pulsar, flat Pulsar filters, kettle, scale, optional WDT tool"},"history":{"ro":"Creat de NextLevel Brewer Co. împreună cu Scott Rao și lansat în 2023, ca dripper „fără bypass”.","en":"Created by NextLevel Brewer Co. with Scott Rao and launched in 2023 as a 'no-bypass' dripper."},"howItWorks":{"ro":"Pereți drepți și un filtru plat lipit de ei fac ca toată apa să treacă prin cafea, fără să ocolească patul. Un robinet la bază îți permite bloom în infuzie și control al curgerii, iar dispersorul împrăștie apa ca la un aparat de batch.","en":"Straight walls and a flat filter sealed against them force all water through the coffee, none around it. A valve at the base allows an immersion bloom and flow control, and a dispersion screen spreads water like a batch brewer."},"profile":{"ro":"Dulce, cu corp și foarte curat; extracție ridicată fără astringență, mai ales la doze mari.","en":"Sweet, full and very clean; high extraction without astringency, especially at larger doses."},"grindKey":"chemex","mistakes":[{"ro":"Doze sub 20 g: patul e prea subțire și apare astringența.","en":"Doses under 20 g: the bed is too thin and astringency appears."},{"ro":"Lași robinetul deschis la bloom.","en":"Leaving the valve open during the bloom."},{"ro":"Măcinare fină de V60 care înfundă filtrul plat.","en":"A fine V60 grind that clogs the flat filter."}],"tips":[{"ro":"Folosește 25–30 g și măcinare între pour-over și batch brew.","en":"Use 25–30 g and a grind between pour-over and batch brew."},{"ro":"Ține apa la 1–2 cm deasupra cafelei pe toată durata.","en":"Keep water 1–2 cm above the coffee throughout."},{"ro":"Un bloom scurt aduce claritate, unul lung aduce corp.","en":"A short bloom brings clarity, a long one brings body."}],"recipeIds":["pulsar-rao"],"sources":["https://www.scottrao.com/blog/pulsar-recipe","https://coffeegeek.com/blog/new-products/theres-no-bypassing-the-nextlevel-brewers/","https://kaldiscoffee.com/blogs/recipes/nextlevel-pulsar-dripper-brew-recipe"]},{"id":"april-brewer","name":{"ro":"April Brewer","en":"April Brewer"},"category":"pourover","difficulty":2,"gear":{"ro":"Dripper April (plastic sau porțelan), filtre Wave/April, ibric, cântar","en":"April brewer (plastic or porcelain), Wave/April filters, kettle, scale"},"history":{"ro":"Proiectat de prăjitoria daneză April Coffee și de Patrik Rolf, finalist la Brewers Cup, lansat în 2019.","en":"Designed by Danish roaster April Coffee and Brewers Cup finalist Patrik Rolf, released in 2019."},"howItWorks":{"ro":"Fund plat cu trei găuri și pereți cu nervuri care țin filtrul ridicat; e gândit pentru turnări rapide, egale, de câte 50 g. Patul plat se extrage uniform fără să amesteci.","en":"A flat bottom with three holes and ribbed walls holding the filter up; it's built for fast, equal 50 g pours. The flat bed extracts evenly without stirring."},"profile":{"ro":"Fructat și transparent, cu corp delicat; pune în valoare prăjirile nordice foarte deschise.","en":"Fruity and transparent with a delicate body; flatters very light Nordic roasts."},"grindKey":"pourover","mistakes":[{"ro":"Amesteci sau rotești: rețeta April se bazează pe turnări, nu pe agitare.","en":"Stirring or swirling: the April method relies on pours, not agitation."},{"ro":"Torni următoarea porție înainte să se usuce suprafața.","en":"Pouring the next pulse before the surface drains."},{"ro":"Măcinare prea fină pentru prăjiri deschise dense.","en":"Grinding too fine for dense light roasts."}],"tips":[{"ro":"Toarnă rapid și „agresiv”, în cercuri concentrice.","en":"Pour quickly and 'aggressively' in concentric circles."},{"ro":"Ținta e 3:20–3:30 pentru 20 g.","en":"Aim for 3:20–3:30 for 20 g."},{"ro":"Rețeta merge și pe Kalita sau Orea.","en":"The recipe also works on a Kalita or Orea."}],"recipeIds":["april-pulse"],"sources":["https://www.aprilcoffeeroasters.com/pages/coffee-inf-recipes","https://honestcoffeeguide.com/brew-recipes/april-coffee-roasters/","https://klatchcoffee.com/brew-guides/april-brewer"]},{"id":"melitta","name":{"ro":"Melitta (con trapezoidal)","en":"Melitta cone"},"category":"pourover","difficulty":1,"gear":{"ro":"Suport Melitta 1x2 sau 1x4, filtre Melitta, ibric, cântar","en":"Melitta 1x2 or 1x4 holder, Melitta filters, kettle, scale"},"history":{"ro":"Melitta Bentz a inventat filtrul de cafea din hârtie în 1908, la Dresda, folosind hârtia din caietul fiului ei. Conul trapezoidal apare în anii '30.","en":"Melitta Bentz invented the paper coffee filter in Dresden in 1908 using her son's school blotting paper. The wedge cone came in the 1930s."},"howItWorks":{"ro":"Forma de pană și găurile mici (una sau trei) frânează scurgerea, deci rezultatul depinde mai puțin de tehnica de turnare. E un pour-over foarte iertător.","en":"The wedge shape and small holes (one or three) slow the drawdown, so the result depends less on pouring technique. It's a very forgiving pour-over."},"profile":{"ro":"Rotund, cu corp, dulce; mai „clasic” decât V60, bun pentru prăjiri medii.","en":"Round, full-bodied, sweet; more 'classic' than a V60, great for medium roasts."},"grindKey":"pourover","mistakes":[{"ro":"Măcinare fină de espresso: înfundă găurile mici.","en":"Espresso-fine grind: it clogs the small holes."},{"ro":"Nu îndoi cusăturile filtrului și hârtia se rupe.","en":"Not folding the filter seams so the paper tears."},{"ro":"Torni toată apa deodată.","en":"Pouring all the water at once."}],"tips":[{"ro":"Îndoaie marginea de jos și cea laterală în direcții opuse.","en":"Fold the bottom and side seams in opposite directions."},{"ro":"Filtrele Melitta se găsesc în orice supermarket din România.","en":"Melitta filters are sold in any Romanian supermarket."},{"ro":"Ideal pentru începători sau dimineți grăbite.","en":"Ideal for beginners or rushed mornings."}],"recipeIds":["melitta-classic"],"sources":["https://www.melitta.com/"]},{"id":"clever-dripper","name":{"ro":"Clever Dripper","en":"Clever Dripper"},"category":"hybrid","difficulty":1,"gear":{"ro":"Clever Dripper (mic sau mare), filtre conice 1x4 sau Clever, cântar","en":"Clever Dripper (small or large), 1x4 cone or Clever filters, scale"},"history":{"ro":"Inventat în Taiwan de Abid Corporation la începutul anilor 2000. Vreme de ani a fost secretul baristilor pentru o cafea bună fără tehnică.","en":"Invented in Taiwan by Abid Corporation in the early 2000s. For years it was baristas' secret for great coffee with no technique."},"howItWorks":{"ro":"O supapă la bază ține cafeaua în infuzie cât stă pe masă și se deschide când pui dripperul pe cană. Combini infuzia completă a presei cu filtrarea prin hârtie.","en":"A base valve holds the coffee in immersion while it sits on the counter and opens when you set it on a mug. You get press-style full immersion with paper filtration."},"profile":{"ro":"Dulce, cu corp, dar fără zaț; foarte consecvent de la o zi la alta.","en":"Sweet and full-bodied, but sediment-free; very consistent day to day."},"grindKey":"pourover","mistakes":[{"ro":"Pui cafeaua prima: se formează un strat care înfundă filtrul.","en":"Adding coffee first: it forms a layer that clogs the filter."},{"ro":"Măcinare prea fină: scurgerea durează minute.","en":"Grinding too fine: drawdown takes minutes."},{"ro":"Îl pui pe o cană prea îngustă și supapa nu se deschide.","en":"Setting it on a narrow mug so the valve doesn't open."}],"tips":[{"ro":"Toarnă apa întâi, apoi cafeaua.","en":"Water first, then the coffee."},{"ro":"Infuzie de 2–4 minute; mai lung pentru mai mult corp.","en":"Steep 2–4 minutes; longer for more body."},{"ro":"Cel mai bun dripper pentru începători.","en":"The best dripper for beginners."}],"recipeIds":["clever-classic"],"sources":["https://field-guides.vercel.app/pour-over/official-brewer-recipes.html","https://commonmancoffeeroasters.com/blogs/news-2/74430852-clever-coffee-dripper-brew-guide","https://honestcoffeeguide.com/brew-recipes"]},{"id":"hario-switch","name":{"ro":"Hario Switch","en":"Hario Switch"},"category":"hybrid","difficulty":2,"gear":{"ro":"Hario Switch 02 (sau 03), filtre V60, ibric cu reglaj de temperatură, cântar","en":"Hario Switch 02 (or 03), V60 filters, temperature-control kettle, scale"},"history":{"ro":"Lansat de Hario în 2019: un con V60 de sticlă pe o bază cu bilă de oțel. Tetsu Kasuya i-a dat faima cu rețeta sa hibridă.","en":"Released by Hario in 2019: a glass V60 cone on a base with a steel-ball valve. Tetsu Kasuya made it famous with his hybrid recipe."},"howItWorks":{"ro":"O pârghie închide sau deschide scurgerea oricând vrei. Poți face pour-over, infuzie completă sau orice combinație, în aceeași rețetă.","en":"A lever closes or opens the outlet whenever you want. You can do pour-over, full immersion or any combination within one recipe."},"profile":{"ro":"Între V60 și Clever: claritate cu mai multă dulceață și corp.","en":"Between a V60 and a Clever: clarity with more sweetness and body."},"grindKey":"pourover","mistakes":[{"ro":"Uiți Switch-ul deschis la începutul infuziei.","en":"Leaving the Switch open at the start of immersion."},{"ro":"Aceeași măcinare ca la V60 pentru infuzie lungă: iese supraextras.","en":"Same grind as V60 for a long steep: it over-extracts."},{"ro":"Nu preîncălzești sticla.","en":"Not preheating the glass."}],"tips":[{"ro":"Închide Switch-ul la clătire ca să încălzești tot vasul.","en":"Close the Switch while rinsing to heat the whole vessel."},{"ro":"Apa mai rece în faza de infuzie reduce amăreala.","en":"Cooler water in the immersion phase reduces bitterness."},{"ro":"Poți folosi conul V60 obișnuit pe baza Switch.","en":"Your regular V60 cone fits on the Switch base."}],"recipeIds":["switch-kasuya","switch-hybrid"],"sources":["https://honestcoffeeguide.com/brew-recipes/tetsu-kasuya-hybrid-method/","https://outpostcoffee.com/blogs/brew-at-home/tetsu-kasuyas-hario-switch-recipe-for-perfect-coffee","https://prima-coffee.com/blog/hario-switch-brewing-guide"]},{"id":"aeropress","name":{"ro":"AeroPress","en":"AeroPress"},"category":"hybrid","difficulty":1,"gear":{"ro":"AeroPress (Original, Go sau XL), filtre de hârtie sau metal, paletă, cântar","en":"AeroPress (Original, Go or XL), paper or metal filters, paddle, scale"},"history":{"ro":"Inventat în 2005 de Alan Adler, creatorul frisbee-ului Aerobie. Are propriul campionat mondial din 2008; în 2024 l-a câștigat românul George Stanica.","en":"Invented in 2005 by Alan Adler, creator of the Aerobie frisbee. It has had its own world championship since 2008; Romanian George Stanica won it in 2024."},"howItWorks":{"ro":"Cafeaua stă în infuzie în cilindru, apoi o presezi cu pistonul printr-un filtru. Presiunea ușoară și timpul scurt permit rețete foarte diferite: concentrate, diluate, inversate.","en":"Coffee steeps in the chamber, then you press it through a filter with the plunger. Light pressure and short contact time allow wildly different recipes: concentrated, diluted, inverted."},"profile":{"ro":"Curat, dulce, corp mediu; de la ceașcă delicată la concentrat aproape de espresso.","en":"Clean, sweet, medium body; from a delicate cup to a near-espresso concentrate."},"grindKey":"aeropress","mistakes":[{"ro":"Apeși cu forță: canalizezi apa și extragi amăreală.","en":"Pressing hard: you channel the water and extract bitterness."},{"ro":"Presezi până strivești zațul după șuierat.","en":"Pressing past the hiss and squeezing the puck."},{"ro":"Inversat pe o suprafață instabilă: se poate răsturna.","en":"Inverted on an unstable surface: it can tip over."}],"tips":[{"ro":"Pune pistonul puțin în cilindru ca să creeze vid și să nu picure.","en":"Seat the plunger slightly to create a vacuum and stop dripping."},{"ro":"Două filtre de hârtie dau o ceașcă și mai curată.","en":"Two paper filters give an even cleaner cup."},{"ro":"Rețetele de concurs se termină adesea cu diluare: gustă înainte să adaugi apă.","en":"Competition recipes often end with dilution: taste before adding water."}],"recipeIds":["aero-hoffmann","aero-inverted","aero-stanica-2024","aero-nemo-2025","aero-flash"],"sources":["https://aeropress.com/blogs/w-a-c-aeropress-recipes/1st-george-stanica-romania-2024","https://aeropress.com/blogs/w-a-c-aeropress-recipes/1st-nemo-pop-australia-2025","https://perfectdailygrind.com/2025/02/aeropress-revisited-coffee-brew-guide/"]},{"id":"french-press","name":{"ro":"Presa franceză","en":"French press"},"category":"immersion","difficulty":1,"gear":{"ro":"Presă franceză (sticlă sau inox), cântar, lingură, opțional termometru","en":"French press (glass or steel), scale, spoon, optional thermometer"},"history":{"ro":"Patentată în forma actuală de italianul Attilio Calimani în 1929 și popularizată în Franța de fabrica Melior. În România e adesea numită simplu „presă”.","en":"Patented in its modern form by Italian Attilio Calimani in 1929 and popularised in France by the Melior factory. Romanians often just call it 'presa'."},"howItWorks":{"ro":"Infuzie completă: cafeaua grosieră stă în apă câteva minute, apoi o sită metalică o separă. Sita lasă să treacă uleiurile și puține particule fine.","en":"Full immersion: coarse coffee steeps for a few minutes, then a metal mesh separates it. The mesh lets oils and some fines through."},"profile":{"ro":"Corp plin, textură uleioasă, dulceață și note de ciocolată; mai puțin limpede.","en":"Full body, oily texture, sweetness and chocolate notes; less clean."},"grindKey":"french","mistakes":[{"ro":"Apeși sita până la fund și răscolești zațul.","en":"Plunging to the bottom and stirring up the grounds."},{"ro":"Lași cafeaua în presă după infuzie: continuă să se extragă.","en":"Leaving coffee in the press after steeping: it keeps extracting."},{"ro":"Măcinare fină: ceașca e nămoloasă și amară.","en":"Fine grind: the cup is muddy and bitter."}],"tips":[{"ro":"Lasă zațul să se așeze 4–5 minute după ce spargi crusta.","en":"Let grounds settle 4–5 minutes after breaking the crust."},{"ro":"Coboară sita doar până la suprafață, ca filtru, nu ca piston.","en":"Lower the mesh only to the surface, as a strainer, not a plunger."},{"ro":"Lasă ultimii 20 g în presă, acolo e zațul.","en":"Leave the last 20 g in the press, that's where the silt is."}],"recipeIds":["french-hoffmann","french-press-big"],"sources":["https://www.jameshoffmann.co.uk/","https://sca.coffee/research/coffee-standards","https://honestcoffeeguide.com/brew-recipes"]},{"id":"siphon","name":{"ro":"Sifon (vacuum pot)","en":"Siphon (vacuum pot)"},"category":"immersion","difficulty":3,"gear":{"ro":"Sifon Hario Technica sau Yama, arzător cu butan/halogen sau spirt, filtru din pânză, paletă de bambus, cântar","en":"Hario Technica or Yama siphon, butane/halogen or spirit burner, cloth filter, bamboo paddle, scale"},"history":{"ro":"Inventat în anii 1830 în Germania (Loeff) și perfecționat în Franța de Madame Vassieux. Japonia l-a transformat într-o artă de bar.","en":"Invented in the 1830s in Germany (Loeff) and refined in France by Madame Vassieux. Japan turned it into a bar art form."},"howItWorks":{"ro":"Vaporii din balonul de jos împing apa în vasul de sus, unde se face infuzia. Când iei căldura, vidul format trage cafeaua înapoi prin filtru.","en":"Vapour in the lower bowl pushes water into the upper chamber, where it steeps. When you remove the heat, the vacuum pulls the coffee back down through the filter."},"profile":{"ro":"Foarte curat, aromat și fierbinte, cu corp mătăsos; ceva între pour-over și presă.","en":"Very clean, aromatic and hot, with a silky body; somewhere between pour-over and press."},"grindKey":"pourover","mistakes":[{"ro":"Fierbi cafeaua prea tare în vasul de sus: devine amară.","en":"Boiling the coffee hard in the upper chamber: it turns bitter."},{"ro":"Filtru de pânză nespălat și mirositor.","en":"An unwashed, smelly cloth filter."},{"ro":"Încălzești balonul de jos ud pe exterior: sticla poate crăpa.","en":"Heating a lower bowl wet on the outside: the glass can crack."}],"tips":[{"ro":"Păstrează filtrul de pânză în apă, la frigider.","en":"Store the cloth filter in water in the fridge."},{"ro":"Pornește cu apă fierbinte din ibric ca să scurtezi timpul.","en":"Start with hot kettle water to save time."},{"ro":"Ține flacăra mică după ce urcă apa, doar cât s-o menții sus.","en":"Keep the flame low once the water rises, just enough to hold it up."}],"recipeIds":["siphon-classic"],"sources":["https://www.hario-europe.com/collections/siphons/products/hario-coffee-siphon-technica","https://baristalife.co/blogs/blog/how-to-make-siphon","https://noblecoffeeroasting.squarespace.com/siphon"]},{"id":"vietnamese-phin","name":{"ro":"Phin vietnamez","en":"Vietnamese phin"},"category":"traditional","difficulty":1,"gear":{"ro":"Phin din inox sau aluminiu (cu presă și capac), lapte condensat îndulcit, gheață","en":"Steel or aluminium phin (with press and lid), sweetened condensed milk, ice"},"history":{"ro":"Adus de francezi în Vietnam în secolul al XIX-lea, phin-ul a devenit simbolul cafenelelor de pe stradă. Laptele condensat a înlocuit laptele proaspăt, greu de găsit.","en":"Brought to Vietnam by the French in the 19th century, the phin became the symbol of street cafés. Condensed milk replaced scarce fresh milk."},"howItWorks":{"ro":"O cupă mică cu găuri, cu o presă metalică așezată peste cafea, care stă pe pahar. Apa picură lent prin gravitație, 4–5 minute.","en":"A small perforated cup with a metal press on the coffee, sitting on the glass. Water drips slowly by gravity over 4–5 minutes."},"profile":{"ro":"Foarte tare, amărui, ciocolatos; cu lapte condensat devine dulce și cremos.","en":"Very strong, bitter-sweet, chocolatey; with condensed milk it turns sweet and creamy."},"grindKey":"moka","mistakes":[{"ro":"Măcinare prea fină: nu mai picură deloc.","en":"Grinding too fine: it stops dripping."},{"ro":"Strângi presa prea tare sau deloc.","en":"Screwing the press too tight or not at all."},{"ro":"Torni toată apa fără bloom: cafeaua se ridică și curge prea repede.","en":"Pouring all the water without a bloom: the coffee lifts and runs too fast."}],"tips":[{"ro":"Scutură phin-ul ca să nivelezi cafeaua înainte de presă.","en":"Shake the phin to level the coffee before the press."},{"ro":"Încearcă și robusta de specialitate (fine robusta).","en":"Try specialty-grade (fine) robusta too."},{"ro":"Varianta cà phê trứng adaugă gălbenuș bătut cu zahăr.","en":"The cà phê trứng variant adds yolk whipped with sugar."}],"recipeIds":["phin-ca-phe-sua-da"],"sources":["https://coppercowcoffee.com/blogs/blog-posts/how-to-use-a-phin","https://nguyencoffeesupply.com/blogs/news/what-is-the-vietnamese-phin-filter","https://www.cremashop.eu/nl/brew-guide/vietnamese-coffee"]},{"id":"kyoto-cold-drip","name":{"ro":"Kyoto cold drip","en":"Kyoto cold drip"},"category":"cold","difficulty":3,"gear":{"ro":"Turn de cold drip (Hario, Yama sau similar), filtru de hârtie sau ceramic, apă cu gheață, cântar","en":"Cold drip tower (Hario, Yama or similar), paper or ceramic filter, ice water, scale"},"history":{"ro":"Popularizat în cafenelele kissaten din Kyoto; se spune că provine de la negustorii olandezi care transportau cafea concentrată pe mare.","en":"Popularised in Kyoto's kissaten cafés; it's said to trace back to Dutch traders carrying coffee concentrate at sea."},"howItWorks":{"ro":"Apa cu gheață picură dintr-un rezervor, cu o picătură pe secundă, prin cafea, timp de 3–6 ore. Nu e infuzie, ci percolare foarte lentă la rece.","en":"Ice water drips from a reservoir at about one drop per second through the coffee for 3–6 hours. It's not a steep but a very slow cold percolation."},"profile":{"ro":"Limpede, dulce, cu note de vin sau lichior; mai aromat și mai luminos decât cold brew-ul prin infuzie.","en":"Clear, sweet, with wine or liqueur notes; more aromatic and brighter than steeped cold brew."},"grindKey":"pourover","mistakes":[{"ro":"Picurare prea rapidă: extracție slabă și apoasă.","en":"Dripping too fast: weak, watery extraction."},{"ro":"Nu uzi cafeaua înainte: apa își face canale.","en":"Not pre-wetting the coffee: water channels."},{"ro":"Lași turnul într-un loc cald sau în soare.","en":"Leaving the tower somewhere warm or sunny."}],"tips":[{"ro":"Verifică ritmul la fiecare oră: scade pe măsură ce se golește rezervorul.","en":"Check the rate hourly: it slows as the reservoir empties."},{"ro":"Un filtru de hârtie peste cafea distribuie picăturile egal.","en":"A paper filter on top of the coffee spreads drops evenly."},{"ro":"Lasă-l o zi la frigider: aromele se rotunjesc.","en":"Rest it a day in the fridge: the flavours round out."}],"recipeIds":["kyoto-drip"],"sources":["https://www.yokogaomag.com/editorial/kyoto-cold-brew","https://baristalife.co/blogs/blog/kyoto-drip-cold-brew-tower","https://perfectdailygrind.com/?p=66909"]},{"id":"flash-brew","name":{"ro":"Flash brew (cafea japoneză cu gheață)","en":"Flash brew (Japanese iced coffee)"},"category":"cold","difficulty":2,"gear":{"ro":"V60, Chemex sau AeroPress, gheață, cântar","en":"V60, Chemex or AeroPress, ice, scale"},"history":{"ro":"Tehnica „iced coffee” japoneză e folosită în Japonia de zeci de ani; Hoffmann și alții au popularizat-o în Occident ca alternativă rapidă la cold brew.","en":"Japanese-style iced coffee has been used in Japan for decades; Hoffmann and others popularised it in the West as a quick alternative to cold brew."},"howItWorks":{"ro":"Prepari un concentrat cu apă fierbinte direct peste gheață, care ține cam 40% din apa totală. Apa caldă extrage aromele, iar gheața le răcește înainte să se oxideze.","en":"You brew a hot concentrate directly onto ice that makes up about 40% of the total water. Hot water extracts the aromatics and the ice chills them before they oxidise."},"profile":{"ro":"Luminos, aromat, cu aciditate vie; mult mai fructat decât cold brew-ul.","en":"Bright, aromatic, with lively acidity; far fruitier than cold brew."},"grindKey":"pourover","mistakes":[{"ro":"Folosești aceeași cantitate de apă caldă ca la rețeta fierbinte și obții o băutură apoasă.","en":"Using the full hot-recipe water and ending up with a watery drink."},{"ro":"Măcinare neschimbată: cu mai puțină apă trebuie mai fin.","en":"Unchanged grind: with less water you need finer."},{"ro":"Gheață din congelator cu miros.","en":"Freezer ice with off smells."}],"tips":[{"ro":"Apa caldă + gheața = apa totală a rețetei clasice.","en":"Hot water + ice = the classic recipe's total water."},{"ro":"Cafelele etiopiene și kenyene strălucesc cu gheață.","en":"Ethiopian and Kenyan coffees shine iced."},{"ro":"Gata în 3 minute, față de 12+ ore la cold brew.","en":"Ready in 3 minutes versus 12+ hours for cold brew."}],"recipeIds":["v60-iced","aero-flash","chemex-iced","flash-sweet-cream"],"sources":["https://www.jameshoffmann.co.uk/","https://perfectdailygrind.com/","https://honestcoffeeguide.com/brew-recipes"]},{"id":"cold-brew","name":{"ro":"Cold brew","en":"Cold brew"},"category":"cold","difficulty":1,"gear":{"ro":"Borcan mare sau Hario Mizudashi, sită, filtru de hârtie, cântar","en":"Large jar or Hario Mizudashi, sieve, paper filter, scale"},"history":{"ro":"Variante de extracție la rece există de secole (inclusiv în Japonia, din 1600), dar cold brew-ul modern a explodat în SUA după 2010.","en":"Cold extraction has existed for centuries (including in Japan since the 1600s), but modern cold brew exploded in the US after 2010."},"howItWorks":{"ro":"Cafeaua grosieră stă în apă rece sau la temperatura camerei 12–24 de ore. Fără căldură se extrag mai puțini acizi și compuși amari.","en":"Coarse coffee steeps in cold or room-temperature water for 12–24 hours. Without heat, fewer acids and bitter compounds are extracted."},"profile":{"ro":"Moale, dulce, ciocolatos, aciditate foarte mică; perfect cu lapte.","en":"Smooth, sweet, chocolatey, very low acidity; perfect with milk."},"grindKey":"coldbrew","mistakes":[{"ro":"Măcinare fină: filtrare chinuită și gust tulbure.","en":"Fine grind: painful filtering and a muddy taste."},{"ro":"Infuzie de peste 24 h: gust lemnos.","en":"Steeping past 24 h: a woody taste."},{"ro":"Nu filtrezi prin hârtie și rămâne zaț fin.","en":"Not filtering through paper so fine silt remains."}],"tips":[{"ro":"Fă concentrat 1:5–1:8 și diluează la servire.","en":"Brew a 1:5–1:8 concentrate and dilute to serve."},{"ro":"Prăjirile medii-închise dau cel mai bun cold brew clasic.","en":"Medium-dark roasts make the best classic cold brew."},{"ro":"Cold brew + apă tonică + coajă de portocală = vară.","en":"Cold brew + tonic + orange peel = summer."}],"recipeIds":["cold","cold-brew-concentrate"],"sources":["https://www.hario-europe.com/","https://perfectdailygrind.com/","https://honestcoffeeguide.com/brew-recipes"]},{"id":"turkish-ibrik","name":{"ro":"Cafea la ibric (turcească)","en":"Turkish coffee (ibrik)"},"category":"traditional","difficulty":2,"gear":{"ro":"Ibric de cupru sau inox (cezve), râșniță capabilă de măcinare ca făina, cești mici","en":"Copper or steel ibrik (cezve), grinder capable of flour-fine grind, small cups"},"history":{"ro":"Cafeaua turcească e pe lista UNESCO a patrimoniului imaterial din 2013. În România, cafeaua la ibric e ritualul de dimineață al bunicilor.","en":"Turkish coffee has been on UNESCO's intangible heritage list since 2013. In Romania, ibrik coffee is the grandparents' morning ritual."},"howItWorks":{"ro":"Cafeaua măcinată foarte fin se încălzește împreună cu apa rece până aproape de fierbere. Nu se filtrează: zațul se depune în ceașcă.","en":"Ultra-fine coffee is heated together with cold water to just below the boil. It isn't filtered: the grounds settle in the cup."},"profile":{"ro":"Dens, intens, cu spumă catifelată; dulce dacă pui zahăr de la început.","en":"Dense, intense, with a velvety foam; sweet if sugar goes in at the start."},"grindKey":"turkish","mistakes":[{"ro":"O lași să clocotească: spuma dispare și apare amăreala.","en":"Letting it boil: the foam collapses and bitterness appears."},{"ro":"Amesteci după ce ai pus-o pe foc.","en":"Stirring after it's on the heat."},{"ro":"Râșniță cu lame sau măcinare de espresso: nu e destul de fin.","en":"Blade grinder or espresso grind: not fine enough."}],"tips":[{"ro":"Foc cât mai mic: cu cât urcă mai încet, cu atât mai multă spumă.","en":"Lowest heat: the slower it rises, the more foam."},{"ro":"Lasă ceașca un minut să se așeze zațul.","en":"Let the cup sit a minute for the grounds to settle."},{"ro":"Un ibric îngust la gât păstrează mai bine spuma.","en":"A narrow-necked ibrik keeps foam better."}],"recipeIds":["ibrik"],"sources":["https://ich.unesco.org/en/RL/turkish-coffee-culture-and-tradition-00645","https://perfectdailygrind.com/"]},{"id":"greek-arabic","name":{"ro":"Cafea grecească și qahwa arăbească","en":"Greek coffee and Arabic qahwa"},"category":"traditional","difficulty":2,"gear":{"ro":"Briki pentru grecească; dallah sau oală și termos pentru qahwa; cardamom","en":"Briki for Greek; dallah or pot and thermos for qahwa; cardamom"},"history":{"ro":"Cafeaua grecească e ruda directă a celei turcești, cu propriul vocabular de dulceață. Qahwa arăbească e pe lista UNESCO din 2015 și e simbolul ospitalității în Golf.","en":"Greek coffee is a direct cousin of Turkish, with its own sweetness vocabulary. Arabic qahwa has been on UNESCO's list since 2015 and is the symbol of Gulf hospitality."},"howItWorks":{"ro":"Grecească: ca la ibric, o ceașcă pe rând, cu spuma kaimaki. Qahwa: cafea prăjită foarte deschis, fiartă 10–15 minute și apoi aromată cu cardamom, servită strecurată.","en":"Greek: like the ibrik, one cup at a time, with kaimaki foam. Qahwa: very light-roasted coffee simmered 10–15 minutes, then spiced with cardamom and served strained."},"profile":{"ro":"Grecească: densă și intensă. Qahwa: aurie, ușoară, condimentată, aproape ca un ceai, fără zahăr.","en":"Greek: dense and intense. Qahwa: golden, light, spiced, almost tea-like, unsweetened."},"grindKey":"turkish","mistakes":[{"ro":"Folosești cafea prăjită închis la qahwa: devine amară și pierde culoarea aurie.","en":"Using dark roast for qahwa: it turns bitter and loses its golden colour."},{"ro":"Fierbi cardamomul de la început și se evaporă aroma.","en":"Boiling the cardamom from the start so its aroma evaporates."},{"ro":"Faci mai multe cești grecești deodată și spuma nu ajunge la toți.","en":"Making several Greek cups at once so the foam doesn't go round."}],"tips":[{"ro":"Cere „metrios” dacă vrei semidulce.","en":"Order 'metrios' for semi-sweet."},{"ro":"Pentru qahwa, prăjirea deschisă, de tip „shakra”, e esențială.","en":"For qahwa, a very light 'shakra' roast is essential."},{"ro":"Servește qahwa cu curmale, în cești de câteva înghițituri.","en":"Serve qahwa with dates, in cups of a few sips."}],"recipeIds":["greek-briki","qahwa-arabic"],"sources":["https://ich.unesco.org/en/RL/arabic-coffee-a-symbol-of-generosity-01074","https://www.coffeeness.de/en/qahwa-coffee/","https://gulfnews.com/food/a-quick-guide-to-making-the-perfect-cup-of-saudi-gahwa-at-home-1.1643633219533"]},{"id":"neapolitan-flip","name":{"ro":"Cuccumella napolitană (flip pot)","en":"Neapolitan flip pot (cuccumella)"},"category":"traditional","difficulty":2,"gear":{"ro":"Cuccumella ILSA sau similară (aluminiu ori inox), sursă de căldură","en":"ILSA or similar cuccumella (aluminium or steel), heat source"},"history":{"ro":"Inventată în 1819 de francezul Morize și adoptată de Napoli, unde a fost cafetiera casei până la moka. Eduardo De Filippo i-a dedicat un monolog celebru.","en":"Invented in 1819 by Frenchman Morize and adopted by Naples, where it was the household pot until the moka. Eduardo De Filippo gave it a famous monologue."},"howItWorks":{"ro":"Încălzești apa în vasul de jos, apoi întorci cafetiera; apa picură prin gravitație prin cafea, fără presiune. E practic un pour-over de aragaz.","en":"You heat water in the bottom half, then flip the pot; water drips through the coffee by gravity, without pressure. It's essentially a stovetop pour-over."},"profile":{"ro":"Mai blândă și mai dulce decât moka, cu corp mediu și aromă intensă.","en":"Gentler and sweeter than a moka, with medium body and intense aroma."},"grindKey":"moka","mistakes":[{"ro":"Umpli apa peste orificiul mic.","en":"Filling water above the small hole."},{"ro":"Tasezi cafeaua: picurarea se blochează.","en":"Tamping the coffee: dripping stalls."},{"ro":"O lași pe foc după ce iese aburul.","en":"Leaving it on the heat after steam appears."}],"tips":[{"ro":"Folosește un con de hârtie pe cioc, ca napolitanii.","en":"Put a paper cone on the spout, like Neapolitans do."},{"ro":"Macină puțin mai grosier decât pentru moka.","en":"Grind a little coarser than for a moka."},{"ro":"Încălzește ceștile înainte: cafeaua iese mai rece decât la moka.","en":"Preheat the cups: the coffee comes out cooler than a moka's."}],"recipeIds":["cuccumella-classic"],"sources":["https://www.coffeeness.de/en/what-is-a-cuccuma/","https://www.caffevergnano.com/en/?p=10773","https://www.cooksinfo.com/neapolitan-flip-coffee-maker/"]},{"id":"percolator","name":{"ro":"Percolator","en":"Percolator"},"category":"traditional","difficulty":1,"gear":{"ro":"Percolator de aragaz sau de camping (inox sau emailat), cântar","en":"Stovetop or camping percolator (steel or enamel), scale"},"history":{"ro":"Patentat în SUA în 1889 de Hanson Goodrich, percolatorul a fost cafetiera americană standard până când l-au înlocuit filtrele electrice în anii '70.","en":"Patented in the US in 1889 by Hanson Goodrich, the percolator was America's standard coffee maker until electric drip replaced it in the 1970s."},"howItWorks":{"ro":"Apa fierbinte urcă printr-un tub central și curge iar și iar peste cafeaua din coș. Recircularea extrage mult, așa că timpul și focul trebuie ținute sub control.","en":"Hot water rises through a central tube and showers the coffee basket again and again. The recirculation extracts a lot, so time and heat must be kept in check."},"profile":{"ro":"Fierbinte, robust, amărui; poate fi plăcut și rotund dacă nu îl fierbi.","en":"Hot, robust, bitter-leaning; it can be pleasant and round if you don't boil it."},"grindKey":"french","mistakes":[{"ro":"Îl lași să clocotească 15 minute.","en":"Letting it boil for 15 minutes."},{"ro":"Măcinare fină: trece zațul prin coș.","en":"Fine grind: grounds slip through the basket."},{"ro":"Lași coșul cu zaț în vas după ce ai terminat.","en":"Leaving the basket of grounds in after brewing."}],"tips":[{"ro":"Pornește cu apă fierbinte și ține un clipocit rar.","en":"Start with hot water and keep a slow perk."},{"ro":"Opt-zece minute sunt suficiente.","en":"Eight to ten minutes is plenty."},{"ro":"Bun pentru grupuri mari, la cabană sau cort.","en":"Great for big groups at the cabin or campsite."}],"recipeIds":["percolator-stovetop"],"sources":["https://coletticoffee.com/blogs/camping-coffee-tips/how-to-make-percolator-coffee","https://primulaproducts.com/a/blog/how-to-make-percolator-coffee"]},{"id":"cowboy-coffee","name":{"ro":"Cowboy coffee","en":"Cowboy coffee"},"category":"traditional","difficulty":1,"gear":{"ro":"O oală sau un ibric de camping, sursă de foc","en":"A pot or camping kettle, a heat source"},"history":{"ro":"Cafeaua cowboy-lor și a pionierilor din Vestul american, făcută direct pe foc, fără filtre. Strămoșul ei e cafeaua fiartă scandinavă (kokkaffe).","en":"The coffee of cowboys and pioneers of the American West, made right on the fire without filters. Its ancestor is Scandinavian boiled coffee (kokkaffe)."},"howItWorks":{"ro":"Cafeaua grosieră se infuzează în apă abia luată de pe foc, ca într-o presă fără piston. Un strop de apă rece răcește suprafața și ajută zațul să cadă.","en":"Coarse coffee steeps in just-off-the-boil water, like a press without a plunger. A splash of cold water cools the surface and helps the grounds sink."},"profile":{"ro":"Rustic, cu corp plin și puțin zaț; surprinzător de bun cu o cafea proaspătă.","en":"Rustic, full-bodied, a bit of sediment; surprisingly good with fresh coffee."},"grindKey":"french","mistakes":[{"ro":"Fierbi cafeaua în clocot.","en":"Boiling the coffee hard."},{"ro":"Torni repede și răscolești zațul.","en":"Pouring fast and stirring up the grounds."},{"ro":"Măcinare fină care rămâne în suspensie.","en":"A fine grind that stays suspended."}],"tips":[{"ro":"Ia oala de pe foc înainte să pui cafeaua.","en":"Take the pot off the heat before adding coffee."},{"ro":"Strecoară printr-un șervețel dacă vrei o ceașcă mai curată.","en":"Strain through a napkin for a cleaner cup."},{"ro":"Perfect pentru drumeții, fără echipament în plus.","en":"Perfect for hikes, no extra gear."}],"recipeIds":["cowboy-coffee"],"sources":["https://spotterup.com/how-to-make-cowboy-coffee/","https://onegreatcoffee.com/blogs/latest-news/in-progress-how-to-make-coffee-on-a-stove-top"]},{"id":"moka-pot","name":{"ro":"Moka (ibricul italian)","en":"Moka pot"},"category":"traditional","difficulty":1,"gear":{"ro":"Moka Bialetti sau similară, sursă de căldură, opțional ibric electric pentru apă caldă","en":"Bialetti or similar moka pot, heat source, optional kettle for hot water"},"history":{"ro":"Creată în 1933 de Alfonso Bialetti, inspirată de mașinile de spălat cu leșie. Se găsește în aproape orice casă din Italia și în multe din România.","en":"Created in 1933 by Alfonso Bialetti, inspired by lye washing machines. It's in nearly every Italian home and many Romanian ones."},"howItWorks":{"ro":"Aburul din boiler împinge apa fierbinte în sus, prin cafea, la aproximativ 1–1,5 bar. Nu e espresso (care are 9 bar), dar e un concentrat puternic.","en":"Steam in the boiler pushes hot water up through the coffee at about 1–1.5 bar. It isn't espresso (9 bar), but it's a strong concentrate."},"profile":{"ro":"Intens, cu corp, note de ciocolată și caramel; amar dacă se arde.","en":"Intense, full-bodied, chocolate and caramel notes; bitter if scorched."},"grindKey":"moka","mistakes":[{"ro":"Tasezi cafeaua ca la espresso.","en":"Tamping the coffee like espresso."},{"ro":"Lași moka pe foc până bolborosește puternic.","en":"Leaving it on the heat until it sputters violently."},{"ro":"Pornești cu apă rece pe foc mare: se încinge cafeaua.","en":"Starting with cold water on high heat: the coffee cooks."}],"tips":[{"ro":"Pornește cu apă fierbinte și foc mediu.","en":"Start with hot water and medium heat."},{"ro":"Răcește baza sub jet de apă rece când începe să bolborosească.","en":"Cool the base under cold water when it starts sputtering."},{"ro":"Nu o spăla cu detergent dacă e din aluminiu.","en":"Don't use detergent on an aluminium pot."}],"recipeIds":["moka","brikka-crema","moka-shakerato"],"sources":["https://www.bialetti.com/","https://www.jameshoffmann.co.uk/"]},{"id":"bialetti-brikka","name":{"ro":"Bialetti Brikka","en":"Bialetti Brikka"},"category":"traditional","difficulty":2,"gear":{"ro":"Bialetti Brikka (2 sau 4 căni), sursă de căldură","en":"Bialetti Brikka (2 or 4 cup), heat source"},"history":{"ro":"Lansată de Bialetti în 1999 ca răspuns la dorința de „cremă” acasă, fără mașină de espresso. Supapa a fost reproiectată în 2020.","en":"Launched by Bialetti in 1999 to give 'crema' at home without an espresso machine. The valve was redesigned in 2020."},"howItWorks":{"ro":"O supapă cu greutate pe coloana de ieșire blochează cafeaua până crește presiunea, apoi o eliberează brusc. Rezultatul e o cafea mai concentrată, cu un strat de spumă.","en":"A weighted valve on the outlet column holds back the coffee until pressure builds, then releases it in a burst. The result is a more concentrated coffee with a layer of foam."},"profile":{"ro":"Mai dens și mai cremos decât moka clasică, cu spumă (nu adevărată cremă de espresso).","en":"Denser and creamier than a classic moka, with foam (not true espresso crema)."},"grindKey":"moka","mistakes":[{"ro":"Umpli boilerul ca la moka: apa e prea multă.","en":"Filling the boiler like a moka: too much water."},{"ro":"Închizi capacul și nu vezi momentul pocnetului.","en":"Closing the lid and missing the 'pop'."},{"ro":"Măcinare prea fină: se blochează supapa.","en":"Grinding too fine: the valve clogs."}],"tips":[{"ro":"Folosește foc mediu-mare: Brikka are nevoie de presiune.","en":"Use medium-high heat: the Brikka needs pressure."},{"ro":"Curăță supapa lunar.","en":"Clean the valve monthly."},{"ro":"Excelentă pentru cappuccino de casă.","en":"Excellent for homemade cappuccino."}],"recipeIds":["brikka-crema"],"sources":["https://www.bialetti.com/","https://www.coffeeness.de/en/"]},{"id":"drip-bags","name":{"ro":"Drip bags (cafea la plic)","en":"Single-serve drip bags"},"category":"pourover","difficulty":1,"gear":{"ro":"Plicuri drip bag cu cafea de specialitate, cană înaltă, ibric","en":"Specialty drip bags, tall mug, kettle"},"history":{"ro":"Inventate în Japonia în anii '90 ca „pour-over portabil”. Azi tot mai multe prăjitorii de specialitate, inclusiv românești, le vând.","en":"Invented in Japan in the 1990s as a 'portable pour-over'. Today more and more specialty roasters, Romanian ones included, sell them."},"howItWorks":{"ro":"Un plic de filtru cu 10–12 g cafea măcinată se agață pe marginea cănii, iar tu torni apa în reprize. E un pour-over în miniatură.","en":"A filter pouch with 10–12 g of ground coffee hangs on the mug rim and you pour in stages. It's a miniature pour-over."},"profile":{"ro":"Curat și ușor, mai slab decât un V60; foarte bun la birou sau în călătorii.","en":"Clean and light, weaker than a V60; very good at the office or travelling."},"grindKey":"pourover","mistakes":[{"ro":"Torni toată apa deodată și dă pe dinafară.","en":"Pouring all the water at once and overflowing."},{"ro":"Cană scundă: punga stă în cafea.","en":"A short mug: the bag sits in the coffee."},{"ro":"Plicuri vechi: cafeaua măcinată pierde aroma repede.","en":"Old bags: ground coffee goes stale fast."}],"tips":[{"ro":"Fă bloom cu 30 g, ca la orice pour-over.","en":"Bloom with 30 g, like any pour-over."},{"ro":"Caută plicuri ambalate în azot, cu dată de prăjire.","en":"Look for nitrogen-flushed bags with a roast date."},{"ro":"Pentru o ceașcă mai tare, folosește 150 g în loc de 180 g.","en":"For a stronger cup, use 150 g instead of 180 g."}],"recipeIds":["drip-bag-pro"],"sources":["https://perfectdailygrind.com/","https://honestcoffeeguide.com/brew-recipes"]},{"id":"espresso-basics","name":{"ro":"Bazele espresso-ului","en":"Espresso basics"},"category":"espresso","difficulty":1,"gear":{"ro":"Espressor, râșniță pentru espresso, cântar cu precizie de 0,1 g, tamper, ceașcă preîncălzită.","en":"Espresso machine, espresso-capable grinder, 0.1 g scale, tamper, preheated cup."},"history":{"ro":"Achille Gaggia a patentat în 1938 pistonul cu arc care a dat presiunea înaltă și crema; pompa electrică a venit cu Faema E61, în 1961.","en":"Achille Gaggia patented the spring piston in 1938, which brought high pressure and crema; the electric pump arrived with the Faema E61 in 1961."},"howItWorks":{"ro":"Espresso-ul e o extracție rapidă: apă la ~90–94 °C este împinsă cu ~9 bari printr-o turtă compactă de cafea măcinată fin. Trei numere îl descriu complet: doza (cafea uscată, în grame), randamentul (cât cântărește băutura în ceașcă) și timpul. Raportul doză:randament e primul lucru de fixat, iar timpul e doar un indicator că măcinătura e potrivită.","en":"Espresso is a fast extraction: water at ~90–94 °C is pushed at ~9 bar through a compact bed of finely ground coffee. Three numbers describe it fully: dose (dry coffee, in grams), yield (what the drink weighs in the cup) and time. The dose:yield ratio is the first thing to lock in; time is only a sign that the grind is right."},"profile":{"ro":"Concentrat, cu corp siropos și cremă deasupra. Un shot bine extras e dulce și echilibrat; acru și subțire înseamnă subextracție, amar și astringent înseamnă supraextracție.","en":"Concentrated, syrupy body with crema on top. A well-extracted shot is sweet and balanced; sour and thin means under-extracted, bitter and drying means over-extracted."},"grindKey":"espresso","mistakes":[{"ro":"Măsori în mililitri în loc de grame: crema umflă volumul și minte.","en":"Measuring in millilitres instead of grams: crema inflates volume and lies."},{"ro":"Schimbi doza, măcinătura și randamentul deodată, apoi nu știi ce a ajutat.","en":"Changing dose, grind and yield at once, so you never know what helped."},{"ro":"Folosești cafea prăjită acum o zi sau acum trei luni.","en":"Using coffee roasted yesterday or three months ago."}],"tips":[{"ro":"Lasă boabele să se odihnească 7–21 de zile după prăjire pentru espresso.","en":"Rest beans 7–21 days after roasting for espresso."},{"ro":"Preîncălzește tot: grupul, portafiltrul și ceașca. Pornește aparatul cu 20–30 de minute înainte.","en":"Preheat everything: group, portafilter and cup. Switch the machine on 20–30 minutes ahead."},{"ro":"Ține doza fixă pentru coșul tău (de obicei 18 g într-un coș de 18 g) și reglează doar măcinătura.","en":"Keep the dose fixed for your basket (usually 18 g in an 18 g basket) and adjust only the grind."}],"recipeIds":["espresso","ristretto","lungo"],"sources":["https://home.lamarzoccousa.com/brew-ratios-around-world/","https://clivecoffee.com/blogs/learn/espresso-extraction-time-ratio-a-complete-guide-clive-coffee","https://completehomebarista.com/guides/espresso-extraction-ratio-explained/","https://www.hachette.com.au/james-hoffmann/how-to-make-the-best-coffee"]},{"id":"ratio-families","name":{"ro":"Familii de rapoarte: de la ristretto la soup shot","en":"Ratio families: ristretto to soup shot"},"category":"espresso","difficulty":2,"gear":{"ro":"Același espressor și cântar. Pentru allongé și soup shot ajută controlul presiunii sau al debitului.","en":"Same machine and scale. For allongé and soup shots, pressure or flow control helps."},"howItWorks":{"ro":"Raportul doză:randament schimbă totul. Ristretto (1:1–1:1,5) e scurt și dens; normale (1:2–1:2,5) e reperul; lungo (1:3–1:4) e mai lung și mai subțire. Allongé-ul lui Scott Rao (1:4–1:6) și soup shot-ul (~1:3, sub 2 bari) folosesc măcinătură grosieră și debit mare, gândite pentru prăjiri foarte deschise; turbo shot-ul (1:3 în ~15 s) e varianta rapidă și repetabilă.","en":"The dose:yield ratio changes everything. Ristretto (1:1–1:1.5) is short and dense; normale (1:2–1:2.5) is the reference; lungo (1:3–1:4) is longer and thinner. Scott Rao's allongé (1:4–1:6) and the soup shot (~1:3, under 2 bar) use a coarse grind and high flow, built for very light roasts; the turbo shot (1:3 in ~15 s) is the fast, repeatable variant."},"profile":{"ro":"Ristretto: gros, dulce, puțin acid. Lungo: mai mult amar și volum. Allongé și soup: limpezi, florale, aproape ca o cafea la filtru concentrată, cu puțină cremă.","en":"Ristretto: thick, sweet, a bit acidic. Lungo: more bitterness and volume. Allongé and soup: clear, floral, almost like a concentrated filter coffee, with little crema."},"grindKey":"espresso","mistakes":[{"ro":"Faci lungo cu aceeași măcinătură fină ca la normale și lași 50 s: iese amar.","en":"Pulling a lungo with the same fine grind as a normale for 50 s: it turns bitter."},{"ro":"Încerci allongé cu o prăjire închisă: iese apos și astringent.","en":"Trying an allongé with a dark roast: it comes out watery and harsh."},{"ro":"Judeci un ristretto la fel ca un normale; e normal să fie mai intens și mai acid.","en":"Judging a ristretto like a normale; it is meant to be more intense and acidic."}],"tips":[{"ro":"Prăjire închisă → rapoarte scurte (1:1,5–1:2). Prăjire deschisă → rapoarte lungi (1:2,5–1:5).","en":"Dark roast → short ratios (1:1.5–1:2). Light roast → long ratios (1:2.5–1:5)."},{"ro":"Pentru rapoarte lungi, macină mai grosier, nu doar lăsa shot-ul să curgă mai mult.","en":"For long ratios, grind coarser instead of just letting the shot run longer."},{"ro":"Gustă același shot oprit la 1:1,5, 1:2 și 1:2,5 în trei cești: înveți rapid ce îți place.","en":"Taste one shot split at 1:1.5, 1:2 and 1:2.5 into three cups: you'll learn fast what you like."}],"recipeIds":["ristretto","espresso","lungo","allonge","espresso-turbo","soup-shot"],"sources":["https://home.lamarzoccousa.com/brew-ratios-around-world/","https://decentespresso.com/docs/all_about_rao_allong","https://decentespresso.com/blog/scott_rao_masterclass_allong_vs_standard_espresso_roast_level_flow_rateflavor_","https://clivecoffee.com/blogs/learn/what-are-soup-shots","https://www.home-barista.com/tips/soup-low-pressure-technique-for-extracting-ultra-light-roasts-t100741-10.html","https://completehomebarista.com/guides/espresso-extraction-ratio-explained/"]},{"id":"dialing-in","name":{"ro":"Reglarea pas cu pas (dial-in)","en":"Dialing in, step by step"},"category":"espresso","difficulty":2,"gear":{"ro":"Cântar, cronometru, râșniță cu reglaj fin (trepte mici), un caiet sau jurnalul din aplicație.","en":"Scale, timer, grinder with fine adjustment steps, a notebook or the app's journal."},"howItWorks":{"ro":"Fixezi doza și raportul, apoi reglezi măcinătura până când timpul cade în fereastra țintă (25–32 s pentru 1:2). Abia apoi gusti: acru → mărește randamentul sau macină mai fin; amar → scade randamentul sau macină mai grosier. Schimbă o singură variabilă pe shot și notează tot.","en":"Fix the dose and ratio, then adjust the grind until time lands in the target window (25–32 s for 1:2). Only then taste: sour → increase yield or grind finer; bitter → decrease yield or grind coarser. Change one variable per shot and log everything."
