<title>Bloom Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=Martian+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app; tabs at the bottom; the brew screen reads like a coffee scale display. */
:root{
  --bg:#ECEEE8; --surface:#F8F9F5; --sunk:#E2E5DD; --ink:#1B211D; --muted:#5B655D; --line:#D0D6CB;
  --accent:#A3263A; --accent-ink:#FFFFFF; --bean:#5F6F3F; --amber:#A8661F; --good:#3E7A4F;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111412; --surface:#1A1E1B; --sunk:#0C0E0D; --ink:#E6E8E1; --muted:#99A299; --line:#2C332E;
  --accent:#E8667A; --accent-ink:#1C0A0E; --bean:#A9BA7E; --amber:#E2A55E; --good:#7CC08F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111412; --surface:#1A1E1B; --sunk:#0C0E0D; --ink:#E6E8E1; --muted:#99A299; --line:#2C332E;
  --accent:#E8667A; --accent-ink:#1C0A0E; --bean:#A9BA7E; --amber:#E2A55E; --good:#7CC08F; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;flex-direction:column;gap:0;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

h2.view-title{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:8px 0 4px;text-wrap:balance}
p.lede{color:var(--muted);margin:0 0 16px;max-width:60ch}
h3.sec{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:24px 0 8px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips.wrap{flex-wrap:wrap;overflow:visible}

/* recipe list */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:12px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.row:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.row .name{font-weight:600;font-size:16px;min-width:0}
.row .by{color:var(--muted);font-size:13px}
.row .spec{grid-column:1/-1;font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.row .go{grid-row:1/3;grid-column:2;color:var(--accent);font-size:20px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);vertical-align:middle;margin-left:6px}
.tag.lab{background:color-mix(in srgb,var(--bean) 22%,transparent);color:var(--bean)}

/* buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.f textarea{min-height:110px;resize:vertical;font-family:var(--f-body)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.note{font-size:13px;color:var(--muted)}

/* readout (scale display) */
.readouts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.readouts>div{background:var(--surface);padding:12px 14px;min-width:0}
.readouts .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.readouts .v{font-family:var(--f-mono);font-size:22px;font-weight:500;letter-spacing:-.03em;margin-top:2px}
.readouts .v small{font-size:12px;color:var(--muted);margin-left:2px}
.readouts .s{font-size:12px;color:var(--muted)}
.readouts .wide{grid-column:1/-1}

/* stepper */
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stepper button{background:none;border:0;width:44px;height:44px;font-size:20px;color:var(--accent)}
.stepper input{border:0;background:none;text-align:center;width:100%;min-width:0;font-family:var(--f-mono);font-size:17px;padding:0}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent)}

/* sheets / overlays */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .inner{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 40px}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:6px}
.x{background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:999px;font-size:18px;flex:none}

/* brew screen */
.brewname{font-family:var(--f-display);font-size:24px;line-height:1.15;margin:4px 0 2px;text-wrap:balance}
.display{background:var(--sunk);border-radius:20px;padding:18px 18px 16px;margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t b{font-family:var(--f-mono);font-size:26px;font-weight:500;letter-spacing:-.04em}
.ring .t span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.target .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.target .big{font-family:var(--f-mono);font-size:clamp(40px,13vw,58px);line-height:1;font-weight:500;letter-spacing:-.05em;color:var(--accent)}
.target .big small{font-size:.38em;color:var(--muted);margin-left:2px;letter-spacing:0}
.target .nx{font-size:13px;color:var(--muted);margin-top:8px}
.nowstep{font-size:19px;font-weight:600;line-height:1.3;margin:16px 0 4px;min-height:2.6em;text-wrap:pretty}
.steps{list-style:none;padding:0;margin:12px 0 0;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:52px 64px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.steps li .tm,.steps li .wg{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.steps li.done{opacity:.45}
.steps li.cur{color:var(--accent)}
.steps li.cur .tm,.steps li.cur .wg{color:var(--accent);font-weight:700}
.ctrls{display:flex;gap:8px;margin-top:16px}
.ctrls .btn{flex:1}
.ctrls .btn.primary{flex:2;font-size:17px;padding:14px}
.extras{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.extras div{font-size:14px}
.ing{margin:6px 0 0;padding-left:18px}
.ing li{margin:3px 0}

/* stars + taste */
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:30px;line-height:1;color:var(--line);padding:2px}
.stars button.on{color:var(--amber)}

/* journal */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:6px}
.stats div{background:var(--surface);padding:12px}
.stats b{display:block;font-family:var(--f-mono);font-size:20px;font-weight:500}
.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.entry{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:14px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.entry .d{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.entry .r{font-size:14px;color:var(--amber);letter-spacing:1px}
.entry .t1{font-weight:600}
.entry .t2{grid-column:1/-1;font-size:13px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted);margin-top:16px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:20px;margin-bottom:6px}
.storage{font-size:12px;color:var(--muted);margin-top:14px;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)}

/* compass */
.compass{display:grid;grid-template-columns:22px minmax(0,1fr);grid-template-rows:auto 22px;gap:6px;margin-top:6px}
.compass .yax{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:center;font-weight:700}
.compass .xax{grid-column:2;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cgrid button{aspect-ratio:1.3;min-width:0;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:12.5px;font-weight:600;padding:6px;line-height:1.2;text-wrap:balance}
.cgrid button.mid{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.cgrid button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.advice{list-style:none;padding:0;margin:8px 0 0;counter-reset:a}
.advice li{padding:10px 0 10px 34px;position:relative;border-bottom:1px solid var(--line);counter-increment:a}
.advice li::before{content:counter(a);position:absolute;left:0;top:9px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:12px;display:flex;align-items:center;justify-content:center}
.advice.plain li::before{background:var(--sunk);color:var(--muted)}
.rule{font-size:13px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--amber) 14%,transparent);margin-top:14px}

/* chart */
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:9px}

/* lab */
.labcard{padding:14px 0;border-bottom:1px solid var(--line)}
.labcard h4{margin:0;font-size:16px}
.labcard .o{font-size:12px;color:var(--muted);font-family:var(--f-mono);margin-top:2px}
.labcard p{margin:6px 0 8px;font-size:14px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cmp div{background:var(--sunk);border-radius:10px;padding:10px}
.cmp b{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cmp .rr{color:var(--amber);font-size:15px}
.win{outline:2px solid var(--good)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1>Bloom Lab</h1><small id="tagline">home brew</small></div>

      <button id="lang-ro" data-lang="ro">RO</button><button id="lang-en" data-lang="en">EN</button>
    </div>
  </header>
  <main id="view"></main>
</div>

const Store = {
 kinds:['brews','recipes','exps'], data:{brews:[],recipes:[],exps:[]}, db:null, uid:null, cloud:false,
 lsGet(k){try{return JSON.parse(localStorage.getItem('bloom.'+k)||'[]')}catch(e){return []}},
 lsSet(k){try{localStorage.setItem('bloom.'+k,JSON.stringify(this.data[k]))}catch(e){}},
 col(){return this.db.collection('data/users/'+this.uid)},
 loadLocal(){for(const k of this.kinds) this.data[k]=this.lsGet(k)},
 async connect(){
  try{
   if(!window.claude||!window.claude.use) return;
   const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
   if(!db||!user) return;
   const uid=await user.id(); if(!uid) return;
   this.db=db; this.uid=uid;
   const snap=await this.col().get();
   const remote={brews:new Map(),recipes:new Map(),exps:new Map()};
   snap.docs.forEach(d=>{const v=d.data(); if(v&&remote[v._k]) remote[v._k].set(v.id,JSON.parse(JSON.stringify(v)))});
   this.cloud=true;
   for(const k of this.kinds){
    for(const it of this.data[k]) if(!remote[k].has(it.id)){ remote[k].set(it.id,{...it,_k:k}); this.col().doc(k[0]+'-'+it.id).set({...it,_k:k}).catch(()=>{this.cloud=false}); }
    this.data[k]=[...remote[k].values()].sort((a,b)=>(b.ts||0)-(a.ts||0)); this.lsSet(k);
   }
   render();
  }catch(e){ this.cloud=false }
 },
 put(k,item){
  item.ts=item.ts||Date.now();
  const i=this.data[k].findIndex(x=>x.id===item.id);
  if(i>=0) this.data[k][i]=item; else this.data[k].unshift(item);
  this.lsSet(k);
  if(this.db&&this.cloud) this.col().doc(k[0]+'-'+item.id).set({...item,_k:k}).catch(()=>{this.cloud=false; render()});
 },
 del(k,id){
  this.data[k]=this.data[k].filter(x=>x.id!==id); this.lsSet(k);
  if(this.db&&this.cloud) this.col().doc(k[0]+'-'+id).delete().catch(()=>{});
 }
};

let audioCtx=null, wake=null;
function beep(final){
 if(!brew||!brew.sound) return;
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.value=final?660:880;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.25,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+(final?.7:.25));
  o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+(final?.75:.3))}catch(e){}
 try{navigator.vibrate&&navigator.vibrate(final?[120,80,120]:80)}catch(e){}
}
function toggleBrew(){

 if(brew.running){brew.running=false;brew.elapsed+= (performance.now()-brew.start)/1000;cancelAnimationFrame(brew.raf);$('#go').textContent=t('resume');releaseWake();return}
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume()}catch(e){}
 brew.running=true;brew.start=performance.now();$('#go').textContent=t('pause');
 try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
 loop();
}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
function loop(){tick();if(brew&&brew.running) brew.raf=requestAnimationFrame(loop)}
function elapsedNow(){return brew.elapsed+(brew.running?(performance.now()-brew.start)/1000:0)}
function tick(force){
 if(!brew||!$('#clock')) return;
 const r=brew.r, tt=totalTime(r)||1, el=elapsedNow();
 const i=curIdx(el), started=brew.running||el>0;
 $('#clock').textContent=mmss(Math.floor(el));
 $('#ringArc').setAttribute('stroke-dashoffset',(326.7*(1-Math.min(1,el/tt))).toFixed(1));
 if(i!==brew.idx||force){
  if(i!==brew.idx&&!force&&i>=0) beep(i===r.steps.length-1);
  brew.idx=i;
  document.querySelectorAll('#stepList li').forEach((li,k)=>{li.classList.toggle('done',started&&k<i);li.classList.toggle('cur',started&&k===i)});
  const s=r.steps[Math.max(0,i)], nx=r.steps[i+1];
  // target: the water mark for the current step, or the last known one
  let w=null;for(let k=Math.max(0,i);k>=0;k--){if(r.steps[k].w!=null){w=stepW(r.steps[k]);break}}
  if(!started){const f=r.steps.find(x=>x.w!=null);w=f?stepW(f):null}
  $('#tgt').innerHTML=w!=null?`${fmtG(w)}<small>g</small>`:'–';
  $('#now').textContent=started?L(s):t('ready');
  const nxs=started?nx:r.steps[1];
  $('#nxt').textContent=nxs?`${t('next')} ${mmss(nxs.t)}${stepW(nxs)!=null?' → '+fmtG(stepW(nxs))+' g':''}`:'';
 }
 if(el>=tt&&brew.running&&!brew.finished){brew.finished=true;$('#now').textContent=t('done')}
}

function controlChart(isE,tds,eyv){
 const W=320,H=220,pl=38,pr=10,pt=10,pb=30;
 const x0=14,x1=26, y0=isE?6:.9, y1=isE?14:1.7, iy0=isE?8:1.15, iy1=isE?12:1.45;
 const X=v=>pl+(v-x0)/(x1-x0)*(W-pl-pr), Y=v=>H-pb-(v-y0)/(y1-y0)*(H-pt-pb);
 let g='';
 for(let v=x0;v<=x1;v+=2){g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-width=".6"/><text x="${X(v)}" y="${H-pb+13}" text-anchor="middle">${v}%</text>`}
 const ys=isE?[6,8,10,12,14]:[.9,1.1,1.3,1.5,1.7];
 ys.forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width=".6"/><text x="${pl-5}" y="${Y(v)+3}" text-anchor="end">${String(v).replace('.',lang==='ro'?',':'.')}</text>`});
 g+=`<rect x="${X(18)}" y="${Y(iy1)}" width="${X(22)-X(18)}" height="${Y(iy0)-Y(iy1)}" fill="var(--good)" fill-opacity=".16" stroke="var(--good)" stroke-width="1" stroke-dasharray="3 2"/>`;
 g+=`<text x="${(X(18)+X(22))/2}" y="${Y(iy1)-4}" text-anchor="middle" style="fill:var(--good)">${t('ideal')}</text>`;
 g+=`<text x="${W-pr}" y="${H-3}" text-anchor="end">${t('ey')} →</text><text x="4" y="${pt+4}" transform="rotate(-90 4 ${pt+4})" text-anchor="end" dy="6">TDS ${t('strength').toLowerCase()} ↑</text>`;
 let msg='';
 if(tds!=null&&eyv!=null){
  const cx=X(Math.min(x1,Math.max(x0,eyv))), cy=Y(Math.min(y1,Math.max(y0,tds)));
  g+=`<circle cx="${cx}" cy="${cy}" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  msg=`<div class="readouts" style="margin-top:10px"><div><div class="k">${t('ey')}</div><div class="v">${fmtG(eyv)}<small>%</small></div></div><div><div class="k">TDS</div><div class="v">${fmtG(tds)}<small>%</small></div></div>
  <div class="wide s" style="color:var(--ink);font-size:14px">${eyv<18?t('ey_low'):eyv>22?t('ey_high'):t('ey_ok')}</div></div>`;
 }
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Brewing control chart">${g}</svg>${msg}`;
}

  <div id="imp_msg" class="note"></div>
  <details><summary style="font-weight:600;cursor:pointer;font-size:14px">${t('manual_t')}</summary>
   <form id="mf" style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
    <div class="grid2"><label class="f">${t('name')}<input id="mf_name" required></label><label class="f">${t('method')}<select id="mf_m">${METHODS.map(m=>`<option value="${m}">${t('m_'+m)}</option>`).join('')}</select></label></div>
    <div class="grid3"><label class="f">${t('coffee')} (g)<input id="mf_d" inputmode="decimal" required></label><label class="f">${t('water')} (g)<input id="mf_w" inputmode="decimal" required></label><label class="f">${t('temp')} (°C)<input id="mf_t" inputmode="decimal"></label></div>
    <div class="grid2"><label class="f">${t('grind')}<select id="mf_g">${Object.keys(GRIND).map(k=>`<option value="${k}" ${k==='mfine'?'selected':''}>${esc(L(GRIND[k]))}</option>`).join('')}</select></label><label class="f">${t('origin')}<input id="mf_o"></label></div>
    <label class="f">${t('steps_fmt')}<textarea id="mf_s" class="mono" style="font-family:var(--f-mono);font-size:13px" placeholder="${esc(t('steps_ex'))}"></textarea></label>
    <button class="btn" type="submit">${t('save_recipe')}</button><div id="mf_msg" class="note"></div>
   </form></details>
 </div>

 <h3 class="sec">${t('weird')}</h3>
 <div class="list" style="margin-top:0">${WEIRD.map(recipeRow).join('')}</div>`;

 v.querySelectorAll('[data-ab]').forEach(b=>b.onclick=()=>{const e=exps.find(x=>x.id===b.dataset.ab);if(e)openRecipe(e.base,{exp:e.id,variant:b.dataset.v})});
 v.querySelectorAll('[data-xdel]').forEach(b=>b.onclick=()=>{const id=b.dataset.xdel;b.outerHTML=`<div class="confirm">${t('del_q')} <button class="btn primary" id="xy">${t('yes_del')}</button></div>`;$('#xy').onclick=()=>{Store.del('exps',id);toast(t('deleted'));render()}});
 $('#abf').onsubmit=ev=>{ev.preventDefault();Store.put('exps',{id:uid(),base:$('#ab_base').value,variable:$('#ab_var').value,a:$('#ab_a').value.trim(),b:$('#ab_b').value.trim()});render()};
 $('#mf').onsubmit=ev=>{ev.preventDefault();
  const steps=parseSteps($('#mf_s').value);
  if(!steps.length){$('#mf_msg').textContent=t('bad_steps');return}
  const n=id=>parseFloat(String($(id).value).replace(',','.'));
  saveCustom({name:$('#mf_name').value.trim(),method:$('#mf_m').value,dose:n('#mf_d'),water:n('#mf_w'),temp:isNaN(n('#mf_t'))?null:n('#mf_t'),grind:$('#mf_g').value,by:$('#mf_o').value.trim(),steps});
 };
 const goBtn=$('#imp_go');
 if(!sampleFn) goBtn.disabled=false;
 goBtn.onclick=importWithClaude;
}
function parseSteps(txt){
 const out=[];
 txt.split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{
  const p=line.split('|').map(s=>s.trim()); if(p.length<2) return;
  const m=p[0].match(/^(\d+)(?::(\d{1,2}))?$/); if(!m) return;
  const tt=m[2]!=null?(+m[1]*60+ +m[2]):+m[1];
  const w=p.length>=3&&p[1]!==''?parseFloat(p[1].replace(',','.')):null;
  const text=p.length>=3?p.slice(2).join(' | '):p[1];
  out.push({t:tt,w:isNaN(w)?null:w,ro:text,en:text});
 });
 return out.sort((a,b)=>a.t-b.t);
}
function saveCustom(o){
 const id='c-'+uid();
 const r={id,custom:true,method:METHODS.includes(o.method)?o.method:'lab',name:{ro:o.name,en:o.name},by:o.by||(lang==='ro'?'rețeta mea':'my recipe'),
  dose:+o.dose||15,water:+o.water||250,temp:o.temp??null,grind:GRIND[o.grind]?o.grind:'medium',steps:o.steps,
  ingredients:o.ingredients&&o.ingredients.length?o.ingredients.map(x=>({ro:x,en:x})):undefined,note:o.note?{ro:o.note,en:o.note}:undefined};
 Store.put('recipes',r);toast(t('recipe_saved'));openRecipe(id);
}
async function importWithClaude(){
 const txt=$('#imp_txt').value.trim(), msg=$('#imp_msg'), btn=$('#imp_go');
 if(!txt){$('#imp_txt').focus();return}
 if(!sampleFn){try{sampleFn=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){sampleFn=null}}
 if(!sampleFn){msg.textContent=t('ai_off');const d=document.querySelector('#mf')?.closest('details');if(d)d.open=true;return}
 btn.disabled=true;msg.textContent=t('converting');
 const langName=lang==='ro'?'Romanian':'English';
 const prompt=`You convert a coffee recipe found online into structured JSON for a brewing timer app. Reply with JSON only, no prose.
Schema: {"name": string, "by": string (author or source if mentioned, else ""), "method": one of "pour","immersion","espresso","moka","ibrik","cold","lab" ("immersion" covers AeroPress, French press, Clever; "lab" for unusual drinks), "dose": grams of coffee (number), "water": total grams of water, or espresso yield in grams (number), "temp": water temperature in °C (number or null), "grind": one of "xfine","fine","mfine","medium","mcoarse","coarse", "ingredients": array of strings for anything besides coffee and water (may be empty), "note": short tip string or "", "steps": array of {"t": seconds from start when this step begins (number), "w": cumulative total water on the scale in grams at the end of this step, or null if no water is added, "text": one short imperative instruction}}.
Rules: convert ounces/ml/cups to grams (1 ml water = 1 g). If a quantity is missing, choose a sensible standard value. The last step's "t" is when the brew is finished. Write "name", "note", "ingredients" and step "text" in ${langName}.
Recipe text:
"""${txt.slice(0,6000)}"""`;
 try{
  const r=await sampleFn.json(prompt,{modelTier:'default'});
  if(!r||!Array.isArray(r.steps)||!r.steps.length) throw {code:'shape'};
  const steps=r.steps.filter(s=>s&&typeof s.t==='number'&&s.text).map(s=>({t:Math.max(0,Math.round(s.t)),w:typeof s.w==='number'?s.w:null,ro:String(s.text),en:String(s.text)})).sort((a,b)=>a.t-b.t);
  if(!steps.length) throw {code:'shape'};
  msg.textContent='';
  saveCustom({name:String(r.name||'Rețetă importată'),by:String(r.by||''),method:r.method,dose:r.dose,water:r.water,temp:typeof r.temp==='number'?r.temp:null,grind:r.grind,ingredients:Array.isArray(r.ingredients)?r.ingredients.map(String):[],note:r.note?String(r.note):'',steps});
 }catch(e){
  if(e&&e.code==='not_granted'){sampleFn=null;msg.textContent=t('ai_off')}
  else if(e&&e.code==='rate_limited') msg.textContent=lang==='ro'?'Prea multe cereri. Mai încearcă peste un minut.':'Too many requests. Try again in a minute.';
  else msg.textContent=lang==='ro'?'Nu am reușit să citesc rețeta. Încearcă un text mai clar sau scrie pașii manual.':"Couldn't read that recipe. Try clearer text or write the steps by hand.";
 }finally{btn.disabled=false}
}

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
 const o=e.target.closest('[data-open]'); if(o){openRecipe(o.dataset.open);return}
 const f=e.target.closest('[data-filter]'); if(f){st.filter=f.dataset.filter;render();return}
 const lb=e.target.closest('[data-lang]'); if(lb){lang=lb.dataset.lang;try{localStorage.setItem('bloom.lang',lang)}catch(_){}
  render(); if(brew&&!$('#sheet').hidden){const el=elapsedNow(),run=brew.running;stopBrew();renderBrew();brew.elapsed=el;if(run){brew.running=false;toggleBrew()}else tick(true)}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&brew&&brew.running){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}});

readHash(); Store.loadLocal(); render(); Store.connect();
</script>
